# Hooks Git : une erreur doit être visible avant qu'un autre membre la voie.
# Optionnels : lefthook n'est pas obligatoire pour contribuer (la CI refait
# les mêmes contrôles). Pour les activer : https://lefthook.dev puis
# `lefthook install`.
#
# Volontairement légers : les tests complets tournent en CI seulement, pas à
# chaque commit ni à chaque push, pour ne pas alourdir une machine ordinaire.

pre-commit:
  # Séquentiel : `format` réécrit les fichiers stagés avant les contrôles.
  parallel: false
  commands:
    format:
      glob: "*.dart"
      run: dart format {staged_files}
      stage_fixed: true
    content:
      glob:
        - "content/**/*.yaml"
        - "tools/validate_content.dart"
        - "tools/seed.dart"
        - "supabase/migrations/**"
      run: dart run tools/validate_content.dart
    produit:
      glob: "produit/**"
      run: dart run tools/ctx.dart check

# Pas de hook au push : l'analyse et les tests complets sont lourds pour une
# machine ordinaire. La CI les lance sur chaque PR ; en local, lance-les à la
# main (`dart run melos run analyze`) ou seulement sur le package touché
# (`cd apps/mobile && flutter analyze && flutter test`).
