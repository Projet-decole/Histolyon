# Hooks Git (AD-14) : une erreur doit être visible avant qu'un autre membre
# la voie. lefthook est installé dans le devcontainer ; ailleurs,
# https://lefthook.dev puis `lefthook install`.
#
# Simplifications assumées faute d'outillage existant à ce stade du
# bootstrap (à réviser quand les stories citées existent) :
# - `analyze` tourne sur tout le workspace (`melos run analyze`), pas
#   seulement sur les fichiers stagés : `dart analyze` n'a pas de mode
#   "uniquement ces fichiers" utile sur un workspace multi-packages.
# - `test` (pre-push) tourne sur tout le workspace (`melos run test`), pas
#   seulement le package touché : aucun outil de détection de package
#   modifié n'existe encore dans `tools/`.

pre-commit:
  # Séquentiel : `format` réécrit les fichiers stagés, `analyze` doit lire
  # leur version finale.
  parallel: false
  commands:
    format:
      glob: "*.dart"
      run: dart format {staged_files}
      stage_fixed: true
    analyze:
      glob: "*.dart"
      run: dart run melos run analyze
    content:
      glob:
        - "content/**/*.yaml"
        - "tools/validate_content.dart"
        - "tools/seed.dart"
        - "supabase/migrations/**"
      run: dart run tools/validate_content.dart

pre-push:
  commands:
    test:
      run: dart run melos run test
