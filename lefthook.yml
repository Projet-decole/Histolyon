# Hooks Git : une erreur doit être visible avant qu'un autre membre la voie.
# C'est le filet de sécurité d'un projet développé avec des agents IA : repérer
# un bug au commit ou au push plutôt qu'en relecture. Pour les activer :
# https://lefthook.dev puis `lefthook install`.
#
# Les contrôles ne portent que sur ce qui a changé (fichiers du commit, package
# touché par le push), pour rester supportables sur une machine ordinaire. La
# CI refait ensuite l'analyse et les tests complets sur chaque PR.
# Sauter un hook ponctuellement : `LEFTHOOK=0 git push` (à éviter).

pre-commit:
  # Séquentiel : `format` réécrit les fichiers stagés avant les contrôles.
  parallel: false
  commands:
    format:
      glob: "*.dart"
      run: dart format {staged_files}
      stage_fixed: true
    analyze:
      glob: "*.dart"
      run: dart analyze {staged_files}
    content:
      glob:
        - "content/**/*.yaml"
        - "tools/validate_content.dart"
        - "tools/seed.dart"
        - "supabase/migrations/**"
      run: dart run tools/validate_content.dart
    produit:
      glob: "produit/**"
      run: dart run tools/ctx.dart check

pre-push:
  # Un package à la fois, et seulement s'il a été touché par le push.
  #
  # `unset $(git rev-parse --local-env-vars)` : git exporte GIT_DIR et d'autres
  # variables dans un hook ; Flutter les hérite, ne retrouve plus la version de
  # son propre SDK (« 0.0.0-unknown ») et refuse alors de résoudre les
  # dépendances du workspace. On les retire avant d'appeler Flutter ou Dart.
  parallel: false
  commands:
    tests-mobile:
      glob: "apps/mobile/**"
      run: |
        unset $(git rev-parse --local-env-vars)
        cd apps/mobile && flutter test
    tests-admin:
      glob: "apps/admin/**"
      run: |
        unset $(git rev-parse --local-env-vars)
        cd apps/admin && flutter test
    tests-outils:
      glob: "{tools,test/tools}/**"
      run: |
        unset $(git rev-parse --local-env-vars)
        flutter pub get > /dev/null && dart test --concurrency=1 test/tools
    tokens:
      glob: "packages/design_tokens/**"
      run: dart run tools/check_tokens.dart
