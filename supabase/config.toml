project_id = "histolyon"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

# Bucket audio (Story 5.3) : narrations de Pin. Public en lecture (contenu
# publié consommé directement par l'app, pas de session requise) ; le
# garde-fou de taille par fichier (5 Mo) est appliqué par tools/media_push.dart
# avant l'upload, celui-ci (limite globale du bucket) en filet de sécurité.
[storage.buckets.audio]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["audio/mp4", "audio/aac", "audio/x-m4a"]

# Images des pins (table media, types image/archive_*). Public en lecture.
[storage.buckets.images]
public = true
file_size_limit = "2MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

# Modèles 3D (table modele_3d, D8, AD-11). glTF binaire uniquement.
[storage.buckets.models]
public = true
file_size_limit = "30MiB"
allowed_mime_types = ["model/gltf-binary", "application/octet-stream"]

# Fond de carte lyon.pmtiles (AD-8), produit par tools/tiles.
[storage.buckets.tiles]
public = true
file_size_limit = "200MiB"

[auth]
enabled = true
# App mobile servie en web pour le dev (`melos run app`) ; l'admin Flutter Web
# tourne sur un port choisi par `flutter run`.
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:*"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
