# -----------------------------------------------------------------------------
# Pattern PT1 du pilote (confirmation discrète) appliqué au registre admin.
# Sujet + verbe au passé court, sans exclamation, sans félicitation.
messages_ephemeres:
  trace_enregistree:        { libelle: "Trace enregistrée.",                                  contexte: "Création d'une Trace de validation ou de modération." }
  brouillon_enregistre:     { libelle: "Brouillon enregistré.",                               contexte: "Sauvegarde explicite réussie." }
  sauvegarde_automatique:   { libelle: "Sauvegarde automatique.",                             contexte: "Sauvegarde implicite pendant la saisie." }
  modifications_appliquees: { libelle: "Modifications appliquées.",                           contexte: "Édition d'un Pin existant publiée." }
  pin_publie:               { libelle: "Pin publié.",                                         contexte: "Bascule validé → publié." }
  pin_retire:               { libelle: "Pin retiré.",                                         contexte: "Bascule publié → retiré." }
  pin_promu:                { libelle: "Pin promu en éditorial.",                             contexte: "Sortie réussie du flow H5." }
  contribution_publiee:     { libelle: "Contribution publiée.",                               contexte: "Sortie de modération avec décision publié." }
  contribution_refusee:     { libelle: "Contribution refusée. L'auteur a été notifié.",       contexte: "Sortie de modération avec décision refusé." }
  contribution_masquee:     { libelle: "Contribution masquée.",                               contexte: "Cible publiée passée en masqué." }
  signalement_rejete:       { libelle: "Signalement rejeté.",                                 contexte: "Décision rejeté sur Signalement." }
  signalement_remedie:      { libelle: "Signalement honoré.",                                 contexte: "Décision remédié sur Signalement." }
  categorie_ajoutee:        { libelle: "Catégorie ajoutée au catalogue.",                     contexte: "Catalogue ouvert I7 — nouvelle Catégorie." }
  epoque_ajoutee:           { libelle: "Époque ajoutée au catalogue.",                        contexte: "Catalogue ouvert I7 — nouvelle Époque." }
  filtres_reinitialises:    { libelle: "Filtres réinitialisés.",                              contexte: "Action de réinitialisation depuis un écran avec filtres." }
  erreur_validation_champ:  { libelle: "Champ requis manquant : <nom du champ>.",             contexte: "Tentative de bascule en en_revue avec champ requis vide. Le nom du champ vient du dictionnaire." }
  erreur_sauvegarde:        { libelle: "Sauvegarde impossible. Réessayez.",                   contexte: "Échec d'écriture sur l'environnement back-office." }
  erreur_chargement:        { libelle: "Chargement impossible. Réessayez.",                   contexte: "Échec de lecture sur l'environnement back-office." }
  permission_insuffisante:  { libelle: "Action non autorisée avec votre rôle actuel.",        contexte: "Tentative d'action hors périmètre des rôles attribués au Compte." }

# -----------------------------------------------------------------------------
# 8. Cas particuliers
# -----------------------------------------------------------------------------
cas_particuliers:

  - id: auto_validation_explicite
    contexte: >-
      Anaïs valide ses propres Pins (cumul des rôles éditeur + validateur
      au démarrage). Le palier 4 cluster 05 acte cette posture via
      type_de_validation = auto_validation, tracée comme telle (jamais
      masquée — cluster 05 question ouverte tranchée).
    surface: "E-ADMIN-VALIDATION-SCIENTIFIQUE"
    libelles:
      bandeau: "Auto-validation : vous êtes l'auteur de ce Pin. La Trace enregistrera type_de_validation = auto_validation."
      mention_panneau_decision: "Cette validation sera enregistrée comme auto-validation."
      libelle_trace: "Auto-validation"
    intention: >-
      Rendre visible le cumul des rôles sans le déguiser. Un partenaire
      institutionnel arrivant ultérieurement basculera naturellement sur
      validation_par_tiers sans reformulation côté libellé.

  - id: premiere_saisie_catalogue_vide
    contexte: "Premier lancement du back-office : aucun Pin saisi, catalogues Catégorie/Époque vides ou amorcés."
    surfaces: ["E-ADMIN-ACCUEIL", "E-ADMIN-CATALOGUE-PINS", "E-ADMIN-SAISIE-PIN-TEMPLATE"]
    libelles:
      accueil_files_vides: "Aucune file en attente. Vous pouvez saisir un nouveau Pin."
      catalogue_vide: "Aucun Pin n'a encore été saisi. Saisissez le premier Pin éditorial pour commencer."
      categorie_vide: "Aucune Catégorie n'existe encore. Vous pouvez en ajouter une depuis ce champ."
      epoque_vide: "Aucune Époque n'existe encore. Vous pouvez en ajouter une depuis ce champ."
    intention: >-
      Pas d'invitation marketing (« Bienvenue dans le back-office ! »).
      Constat factuel + chemin d'action immédiat.

  - id: conflit_editorial_communautaire_avant_promotion
    contexte: >-
      Un Pin communautaire publié est candidat à promotion. La microcopy
      distingue le Pin communautaire en l'état du Pin éditorial qu'il
      deviendrait, sans dévaloriser l'origine communautaire.
    surface: "E-ADMIN-PROMOTION-COMMUNAUTAIRE"
    libelles:
      provenance_avant: "Provenance actuelle : communautaire"
      provenance_apres: "Provenance après promotion : éditorial"
      credit_apres: "Crédit côté grand public : pseudonyme de l'auteur original conservé"
      avec_marque_distinctive: "Ce Pin porte encore une marque distinctive. La promotion est refusée tant que la modération n'est pas conclue."
      reference_par_parcours: "Un Parcours communautaire référence ce Pin nommément. La promotion ne modifie pas le Parcours."
    intention: >-
      Pas de hiérarchisation valorisante (« enfin éditorial », « passage au
      niveau supérieur »). La promotion est un acte de modélisation, pas
      un trophée.

  - id: cible_modifiee_pendant_examen
    contexte: "Pendant qu'un modérateur examine une cible, l'auteur la modifie/supprime ou son Compte est supprimé."
    surfaces: ["E-ADMIN-MODERATION-COMMUNAUTAIRE", "E-ADMIN-MODERATION-SOUMISSIONS"]
    libelles:
      auteur_supprime_compte: "L'auteur a supprimé son Compte. Le pseudonyme reste tracé pour audit ; aucune notification ne pourra lui parvenir."
      cible_supprimee_par_auteur: "La cible a été supprimée par son auteur entre-temps. La modération est sans objet ; vous pouvez fermer la fiche."
      pin_cible_retire: "Le Pin cible a été retiré entre-temps. La publication n'aura pas d'effet visible côté grand public ; le refus reste valable."

  - id: signalement_sur_pin_editorial
    contexte: >-
      Le cluster 04 réserve les Signalements aux contenus communautaires.
      Pour un Pin éditorial, la correction passe par E-ADMIN-RETRAIT-
      REOUVERTURE-PIN. Cas marginal, à arbitrer en D10.5 — libellé
      d'orientation prévu.
    surface: "E-ADMIN-MODERATION-COMMUNAUTAIRE (cas marginal)"
    libelles:
      orientation: "Cette cible est un Pin de provenance éditoriale. La correction relève du retrait éditorial. Continuer dans la file de retrait."
