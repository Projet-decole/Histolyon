# -----------------------------------------------------------------------------
# 5. Microcopy des décisions de validation et modération
# -----------------------------------------------------------------------------
# Pour chaque valeur de décision : libellé du bouton (cf. § 3 dictionnaire),
# statut résultant, contrainte sur le motif, confirmation après décision.
decisions:

  trace_de_validation_pin_editorial:
    note: "Trace de validation cluster 05, RÉSERVÉE aux Pins éditoriaux."
    valeurs:
      - { decision: approuvé,            statut_resultant: "Pin validé",                                motif_obligatoire: false, placeholder_motif: "Commentaire éditorial (optionnel)",            confirmation: "Pin approuvé. Trace de validation créée. Le Pin est désormais en validé." }
      - { decision: demande_complément,  statut_resultant: "Pin retourné en brouillon",                 motif_obligatoire: true,  placeholder_motif: "Précisez ce qui manque pour atteindre validé", confirmation: "Demande de complément enregistrée. Trace créée. Le Pin retourne en brouillon ; l'éditeur reprendra la saisie." }
      - { decision: refusé,              statut_resultant: "Pin retourné en brouillon",                 motif_obligatoire: true,  placeholder_motif: "Motif du refus",                              confirmation: "Pin refusé. Trace créée. Le Pin retourne en brouillon." }

  trace_de_moderation_commentaire_retour:
    note: "Trace de modération cluster 04, sur Commentaire ou Retour de parcours."
    valeurs:
      - { decision: publié,              statut_resultant: "Contribution publiée",                                                       motif_obligatoire: false, placeholder_motif: "Commentaire de modération (optionnel)",      confirmation: "Contribution publiée. Trace de modération créée." }
      - { decision: refusé,              statut_resultant: "Contribution refusée (jamais publiée)",                                      motif_obligatoire: true,  placeholder_motif: "Motif transmis à l'auteur (sans humiliation, D9.1)", confirmation: "Contribution refusée. Trace créée. L'auteur a été notifié avec votre motif." }
      - { decision: masqué,              statut_resultant: "Contribution masquée (n'est plus visible publiquement, reste tracée)",       motif_obligatoire: true,  placeholder_motif: "Motif du masquage",                          confirmation: "Contribution masquée. Trace créée." }
      - { decision: démasqué,            statut_resultant: "Contribution rétablie (à nouveau visible publiquement)",                     motif_obligatoire: false, placeholder_motif: "Motif de la levée (optionnel)",              confirmation: "Contribution rétablie. Trace créée." }

  trace_de_moderation_signalement:
    note: "Trace de modération cluster 04, sur Signalement."
    valeurs:
      - { decision: rejeté,              statut_resultant: "Signalement classé sans suite (cible inchangée)",                            motif_obligatoire: true,  placeholder_motif: "Motif du rejet",                             confirmation: "Signalement rejeté. Trace créée. La cible reste en l'état." }
      - { decision: remédié,             statut_resultant: "Signalement honoré, action prise sur la cible",                              motif_obligatoire: true,  placeholder_motif: "Motif et nature de la remédiation",          confirmation: "Signalement honoré. Trace créée. Action consignée sur la cible." }
    action_prise_sur_la_cible_libelles: ["Aucune", "Cible masquée", "Cible retirée", "Cible corrigée"]

  trace_de_moderation_pin_communautaire:
    note: >-
      Trace de modération cluster 04 ÉTENDUE pour Pin communautaire (TRACE
      UNIQUE 2026-05-05). Conjugue validation scientifique et modération en
      un seul acte tracé.
    valeurs:
      - { decision: validé_sources_vérifiées,    statut_resultant: "Pin communautaire validé puis publié, marque distinctive levée", motif_obligatoire: false, placeholder_motif: "Commentaire éditorial (optionnel)", confirmation: "Sources vérifiées. Trace de modération créée. Le Pin est publié, marque distinctive levée." }
      - { decision: demande_complément,          statut_resultant: "Pin retourné en brouillon côté auteur communautaire",            motif_obligatoire: true,  placeholder_motif: "Précisez ce qui manque (Source, cohérence, etc.)", confirmation: "Demande de complément envoyée. Trace créée. Le Pin retourne en brouillon côté auteur." }
      - { decision: retiré_sources_insuffisantes, statut_resultant: "Pin retiré",                                                    motif_obligatoire: true,  placeholder_motif: "Motif transmis à l'auteur",          confirmation: "Pin retiré pour sources insuffisantes. Trace créée. L'auteur a été notifié." }

  trace_de_moderation_parcours_communautaire:
    note: "Modération d'un Parcours communautaire récemment publié avec marque distinctive (H4)."
    valeurs:
      - { decision: publié,              statut_resultant: "Parcours validé, marque distinctive levée",                               motif_obligatoire: false, placeholder_motif: "Commentaire (optionnel)",                    confirmation: "Parcours publié. Marque distinctive levée. Trace de modération créée." }
      - { decision: demande_correction,  statut_resultant: "Parcours reste publié avec marque distinctive le temps de la correction", motif_obligatoire: true,  placeholder_motif: "Précisez la correction attendue",            confirmation: "Correction demandée. Trace créée. L'auteur a été notifié." }
      - { decision: refusé,              statut_resultant: "Parcours retiré",                                                         motif_obligatoire: true,  placeholder_motif: "Motif transmis à l'auteur",                  confirmation: "Parcours retiré. Trace créée. L'auteur a été notifié." }

  promotion_communautaire_editorial:
    note: "Trace de validation cluster 05 avec décision = approuvé et mention spécifique en motif. Sortie du flow H5."
    valeurs:
      - { decision: approuvé_promotion,  statut_resultant: "Pin de provenance éditoriale (auteur_communautaire conservé en crédit)", motif_obligatoire: true, valeur_par_defaut: "Promotion communautaire → éditorial", placeholder_motif: "Mention spécifique + commentaire éditorial éventuel", confirmation: "Pin promu en éditorial. Pseudonyme de l'auteur original conservé en crédit. Trace de validation créée." }

  retrait_editorial_ex_post:
    note: "Trace de validation négative ex post (cluster 05) sur Pin éditorial publié, dans le cadre de H6."
    valeurs:
      - { decision: refusé_retrait_editorial, statut_resultant: "Pin retiré", motif_obligatoire: true, valeur_par_defaut: "Retrait éditorial", placeholder_motif: "Motif du retrait (erreur factuelle, source compromise, obsolescence)", confirmation: "Pin éditorial retiré. Trace de validation négative ex post créée. Le Pin disparaît de la Carte et de la recherche grand public." }

# -----------------------------------------------------------------------------
# 6. Dialogues de confirmation back-office
# -----------------------------------------------------------------------------
# Patterns pour actes sensibles. P5 du pilote — annoncer avant d'agir. Le
# bouton dit ce qu'il fait (jamais « OK »). Voix de l'app, vouvoiement formel.
dialogues_de_confirmation:

  - id: confirmation_retrait_pin_publie
    titre: "Retirer ce Pin"
    description: >-
      Le retrait fait disparaître ce Pin de la Carte et des résultats de
      recherche côté grand public. Les Étapes de Parcours qui le référencent
      afficheront un message de dégradation gracieuse. Les Commentaires
      associés restent tracés mais cesseront d'être visibles publiquement.
      Une Trace immuable enregistrera votre décision. Le retrait est
      réversible par réouverture après correction.
    boutons: ["Retirer le Pin", "Annuler"]

  - id: confirmation_suppression_brouillon
    titre: "Supprimer ce brouillon"
    description: >-
      Le brouillon sera supprimé définitivement. Les Sources et Médias
      rattachés ne seront pas supprimés (ils peuvent être réutilisés).
      Cette action est irréversible.
    boutons: ["Supprimer le brouillon", "Annuler"]

  - id: confirmation_promotion
    titre: "Promouvoir ce Pin en éditorial"
    description: >-
      Le Pin passera en provenance éditoriale. Le pseudonyme de l'auteur
      original sera conservé en crédit côté grand public. Une Trace de
      validation enregistrera la promotion. La marque distinctive (s'il en
      restait une) sera levée définitivement. Une notification de courtoisie
      sera adressée à l'auteur original.
    boutons: ["Promouvoir", "Annuler"]

  - id: confirmation_refus_soumission
    titre: "Retirer pour sources insuffisantes"
    description: >-
      Le Pin passera en retiré. L'auteur sera notifié avec votre motif. Une
      Trace de modération immuable enregistrera la décision. Le Pin pourra
      être re-soumis après correction des Sources si l'auteur le souhaite.
    boutons: ["Retirer", "Annuler"]

  - id: confirmation_masquage
    titre: "Masquer cette contribution"
    description: >-
      La contribution ne sera plus visible publiquement. Elle reste tracée
      et peut être démasquée ultérieurement. Une Trace de modération
      enregistrera le masquage.
    boutons: ["Masquer", "Annuler"]

  - id: confirmation_abandon_saisie
    titre: "Quitter la saisie"
    description: >-
      Des modifications n'ont pas été enregistrées. Le brouillon survivra
      avec son contenu antérieur ; les modifications en cours seront perdues.
    boutons: ["Enregistrer puis quitter", "Quitter sans enregistrer", "Annuler"]

  - id: confirmation_migration_template
    titre: "Migrer vers la version active du Template"
    description: >-
      Ce Pin a été saisi sous une version dépréciée du Template. La
      migration vers la version active est recommandée. Le contenu déjà
      saisi sera conservé ; les éventuels nouveaux champs requis devront
      être complétés.
    boutons: ["Migrer", "Conserver la version dépréciée"]

