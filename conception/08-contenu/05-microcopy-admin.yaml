# =============================================================================
# Palier 8 — 05-microcopy-admin
# =============================================================================
# Microcopy back-office à destination d'Anaïs et des rôles admin (validateur
# scientifique, modérateur). Couvre les 8 écrans E-ADMIN-* (palier 7) et les
# flows H1-H6 (palier 6).
#
# Registre TRÈS DIFFÉRENT de la microcopy grand public (cf. 04-microcopy-
# grand-public) : pas de ton conteur, pas de tu narratif. Voix de l'app
# uniquement, vouvoiement systématique, vocabulaire métier admis. Anaïs
# maîtrise les termes du palier 4 (Trace de modération, provenance
# communautaire, validé_sources_vérifiées) — on les expose sans pédagogie.
#
# Cohérence stricte avec le pilote 01-strategie-narrative § conteur.
# registres_par_persona.backoffice_anais : neutre, précis, fonctionnel.
# Pas froid pour autant — clair et respectueux. Voix de l'outil de travail.
# =============================================================================

document:
  type: palier_contenu_microcopy_admin
  version: "0.1"
  date: "2026-05-05"
  format: yaml

# -----------------------------------------------------------------------------
# 1. Périmètre
# -----------------------------------------------------------------------------
perimetre:
  inclus:
    - "Dictionnaire admin (verbes, états, filtres) commun aux 8 écrans"
    - "Microcopy par écran admin (titres, actions, sections, états, audit)"
    - "Microcopy des décisions de validation (cluster 05) et modération (cluster 04)"
    - "Dialogues de confirmation back-office (actes sensibles)"
    - "Messages éphémères back-office"
    - "Cas particuliers : auto-validation, catalogue vide, conflit éditorial/communautaire"
  exclus:
    - "Microcopy grand public (voir 04-microcopy-grand-public)"
    - "Stratégie i18n du back-office (Anaïs lit en français — voir 06-i18n)"
    - "Format de saisie des Templates et composants UI (palier 13)"
  test_de_purete: >-
    Si demain l'environnement back-office bascule de tableurs structurés à
    un CMS web dédié, les libellés ici restent-ils valides ? Si oui, c'est
    bon — la microcopy ne dépend pas de l'implémentation.

# -----------------------------------------------------------------------------
# 2. Registre admin
# -----------------------------------------------------------------------------
registre:

  principes:
    neutre: "Pas de jugement, pas de félicitation, pas de commisération. La microcopy CONSTATE et NOMME — elle n'évalue pas l'opérateur."
    precis: "Le terme métier exact est préféré au terme générique. « Trace de modération » plutôt que « historique » ; « validé_sources_vérifiées » plutôt que « approuvé »."
    fonctionnel: "Chaque libellé répond à une question pratique : qu'est-ce que c'est, qu'est-ce que ça fait, qu'est-ce qui se passe maintenant. Pas d'ornement."

  distinction_avec_grand_public:
    voix_de_l_app_uniquement: >-
      Pas de récit en back-office. La distinction « voix du récit / voix de
      l'app » du pilote ne s'applique pas. Vouvoiement systématique.
    pas_d_emerveillement_pas_d_invitation: >-
      Pas de chrome chaleureux, pas de teaser, pas d'invitation marketing.
      L'opérateur travaille — il ne « découvre » pas la file de modération,
      il s'y rend parce que c'est son métier.
    p4_reste_valable: >-
      « Ne jamais culpabiliser » (pilote) reste vrai : une file pleine
      n'est pas reprochée, une décision n'est pas commentée. L'outil reste
      à sa place.

  vocabulaire_metier_admis:
    note: >-
      Termes métier exposables tels quels sans pédagogie. Anaïs et les
      rôles admin maîtrisent (palier 2 § Anaïs, palier 4 clusters 04+05).
    termes:
      - "Pin, Parcours, Étape, Catégorie, Époque, Source, Média"
      - "Template, version de Template"
      - "Trace de validation (cluster 05), Trace de modération (cluster 04)"
      - "provenance éditoriale, provenance communautaire"
      - "auteur communautaire, pseudonyme, signaleur"
      - "Signalement, Commentaire, Retour de parcours"
      - "brouillon, en_revue, validé, publié, retiré"
      - "en_attente, refusé, masqué, démasqué, supprimé_par_auteur"
      - "nouveau, en_examen, rejeté, remédié"
      - "validé_sources_vérifiées, retiré_sources_insuffisantes"
      - "auto_validation, validation_par_tiers"
      - "marque distinctive (signalisation grand public d'une vérification en cours)"

  ce_qu_on_evite:
    - "Termes infantilisants ou ludiques (Bravo, Super, Yes)"
    - "Émojis"
    - "Tournures conteur (« Vous voici devant la file »)"
    - "Adjectifs valorisants (« puissant outil », « riche bibliothèque »)"
    - "Reformulation marketing des termes métier"
    - "Tournures défensives ou excusantes (« Désolé, mais… »)"

# -----------------------------------------------------------------------------
# 3. Dictionnaire admin
# -----------------------------------------------------------------------------
dictionnaire:

  verbes_d_action:
    - { libelle: "Approuver",                       contexte: "validation Pin éditorial — décision approuvé" }
    - { libelle: "Refuser",                         contexte: "validation ou modération — décision refusé" }
    - { libelle: "Demander un complément",          contexte: "décision demande_complément" }
    - { libelle: "Valider les sources",             contexte: "modération Pin communautaire — validé_sources_vérifiées" }
    - { libelle: "Retirer pour sources insuffisantes", contexte: "modération Pin communautaire — retiré_sources_insuffisantes" }
    - { libelle: "Publier",                         contexte: "modération Commentaire / Retour / Parcours — publié" }
    - { libelle: "Masquer",                         contexte: "Commentaire ou Retour publié à masquer" }
    - { libelle: "Démasquer",                       contexte: "levée d'un masquage" }
    - { libelle: "Promouvoir en éditorial",         contexte: "promotion communautaire → éditorial (H5)" }
    - { libelle: "Retirer le Pin",                  contexte: "retrait d'un Pin publié (H6)" }
    - { libelle: "Rouvrir le Pin",                  contexte: "réouverture d'un Pin retiré après correction" }
    - { libelle: "Rejeter le signalement",          contexte: "Signalement infondé — décision rejeté" }
    - { libelle: "Remédier",                        contexte: "Signalement honoré — décision remédié" }
    - { libelle: "Soumettre pour validation",       contexte: "saisie Pin éditorial — bascule brouillon → en_revue" }
    - { libelle: "Enregistrer le brouillon",        contexte: "sauvegarde explicite" }
    - { libelle: "Reprendre le brouillon",          contexte: "ouverture d'un Pin existant en brouillon" }
    - { libelle: "Annoter",                         contexte: "validation — pose d'annotation granulaire sans modifier le rédactionnel" }
    - { libelle: "Amender avant promotion",         contexte: "promotion — renvoi vers saisie pour enrichissement éditorial" }
    - { libelle: "Annuler",                         contexte: "abandon d'une décision en cours (jamais sur Trace créée — immuabilité)" }
    - { libelle: "Réinitialiser les filtres",       contexte: "remise à zéro des filtres d'un écran de file" }

  etats:
    pin: ["Brouillon", "En revue", "Validé", "Publié", "Retiré"]
    commentaire_retour: ["En attente", "Publié", "Refusé", "Masqué", "Supprimé par l'auteur"]
    signalement: ["Nouveau", "En examen", "Rejeté", "Remédié"]
    template: ["Brouillon", "Actif", "Déprécié"]
    note_correspondance: >-
      Les libellés affichés correspondent un-à-un aux valeurs métier des
      cycles de vie des clusters 01, 04, 05 (P7 cohérence terminologique).

  filtres:
    provenance: ["Toutes provenances", "Éditorial", "Communautaire"]
    statut_pin: ["Tous statuts", "Brouillon", "En revue", "Validé", "Publié", "Retiré"]
    type_contribution: ["Tous types", "Commentaires", "Retours de parcours"]
    signalement: ["Toutes contributions", "Avec signalement actif", "Sans signalement"]
    type_validation: ["Tous types", "Auto-validation", "Validation par tiers"]

