    - { id: D21, libelle: "Mettre en favori",          usage: "Marquer un Pin/Parcours favori (B7)." }
    - { id: D22, libelle: "Retirer des favoris",       usage: "Retour PT1 attendu : D54." }
    - { id: D23, libelle: "Signaler",                  usage: "Ouvrir le formulaire de signalement (G3) sur communautaire." }
    - { id: D24, libelle: "Soumettre",                 usage: "Envoyer contribution à modération. Préférable à « Publier » (visibilité non garantie)." }
    - { id: D25, libelle: "Publier",                   usage: "Publication communautaire d'un Parcours personnel (C13). Seul cas où « Publier » est employé." }
    - { id: D26, libelle: "Se connecter",              usage: "Authentifier un Compte existant." }
    - { id: D27, libelle: "Créer un compte",           usage: "Toujours formulé comme une option, jamais comme une obligation." }
    - { id: D28, libelle: "Se déconnecter",            usage: "Sortir du Compte sur cet appareil sans le supprimer." }
    - { id: D29, libelle: "Effacer l'historique",      usage: "Effacement total. Précédé d'un dialogue M8." }
    - { id: D30, libelle: "Autoriser",                 usage: "Acceptation contextuelle avant le prompt OS." }
    - { id: D31, libelle: "Ouvrir les paramètres système", usage: "Permission refusée définitivement (cf. PT5)." }

  statuts:
    - { id: D40, libelle: "Chargement",                usage: "Préférable à « Loading » ou à un blanc." }
    - { id: D41, libelle: "En cours",                  usage: "Parcours engagé, audio active, soumission en traitement." }
    - { id: D42, libelle: "Terminé",                   usage: "Parcours complété, action aboutie." }
    - { id: D43, libelle: "En modération",             usage: "Visible à l'auteur seul. Préférable à « En attente » (vague)." }
    - { id: D44, libelle: "Hors ligne",                usage: "Sans tiret. Bandeau P3 et dérivés." }
    - { id: D45, libelle: "Erreur de chargement",      usage: "Toujours suivi de D4 disponible." }
    - { id: D46, libelle: "Brouillon",                 usage: "Contribution sauvegardée non encore soumise." }
    - { id: D47, libelle: "Publié",                    usage: "Contribution validée et visible." }
