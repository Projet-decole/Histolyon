# =============================================================================
# Palier 8 — 04-microcopy-grand-public
# =============================================================================
# Microcopy des 40 écrans grand public du palier 7. Application stricte du
# pilote 01-strategie-narrative (ton conteur, voix récit/app, P1-P7, PT1-PT7,
# anti-patterns).
#
# Convention : libellés communs au dictionnaire, référencés par id (D1, D2…).
# Les écrans ne rappellent que ce qui leur est SPÉCIFIQUE.
# =============================================================================

document:
  type: palier_contenu_microcopy_grand_public
  version: "0.1"
  date: "2026-05-05"
  format: yaml

# -----------------------------------------------------------------------------
# 1. Périmètre
# -----------------------------------------------------------------------------
perimetre:

  inclus:
    - "Dictionnaire transversal (verbes, statuts, sections, entités, connecteurs)"
    - "Patterns par mode de présentation (P5.M2-M9)"
    - "Microcopy structurante par écran grand public (palier 7)"
    - "Demandes de permission contextualisées (PT4)"
    - "Erreurs et états dégradés génériques"
    - "Microcopy de cohésion narrative (Parcours, proximité)"

  exclus:
    - "Microcopy admin — voir 05"
    - "Contenu narratif réel des Pins/Parcours — matière éditoriale"
    - "Structure des templates — voir 02, 03"
    - "Stratégie i18n — voir 06"
    - "Mesures chiffrées — paliers 11, 16"
    - "Composants UI, dimensions — paliers 9, 10, 12"

  test_de_purete: "Si demain l'app passe à un autre stack, les libellés tiennent-ils ? Si oui, c'est bon."

# -----------------------------------------------------------------------------
# 2. Dictionnaire transversal
# -----------------------------------------------------------------------------
# Format compact : { id, libelle, usage }. Voix = app par défaut sauf mention.
# Référencé partout par id. Les écrans ne rappellent que les SPÉCIFIQUES.
dictionnaire:

  verbes_d_action:
    - { id: D1,  libelle: "Continuer",                 usage: "Avancer dans un flow engagé sans valider de sensible." }
    - { id: D2,  libelle: "Annuler",                   usage: "Renoncer sans effet ; conserver le contexte. Jamais « OK »." }
    - { id: D3,  libelle: "Confirmer",                 usage: "Acquiescer décision NON sensible. Sensible → libellé qui dit l'action (cf. P5)." }
    - { id: D4,  libelle: "Réessayer",                 usage: "Relancer après échec réseau ou chargement." }
    - { id: D5,  libelle: "Plus tard",                 usage: "Reporter une proposition non bloquante. Préférable à « Refuser »." }
    - { id: D6,  libelle: "Retour",                    usage: "Revenir à la surface précédente (P5.N1)." }
    - { id: D7,  libelle: "Voir plus",                 usage: "Étendre une liste tronquée. Préférable à « Charger plus » (technique)." }
    - { id: D8,  libelle: "Fermer",                    usage: "Refermer une surface ponctuelle (M6) ou un message persistant." }
    - { id: D9,  libelle: "Enregistrer",               usage: "Sauvegarde explicite (brouillon, image, code visuel)." }
    - { id: D10, libelle: "Partager",                  usage: "Partage natif système (F1, F2, F3)." }
    - { id: D11, libelle: "Copier le lien",            usage: "Copier le Lien universel. Retour PT1 = D52." }
    - { id: D12, libelle: "Modifier",                  usage: "Entrer en édition d'un objet existant." }
    - { id: D13, libelle: "Supprimer",                 usage: "Détruire définitivement. Toujours précédé d'un dialogue M8." }
    - { id: D14, libelle: "Démarrer",                  usage: "Lancer un Parcours." }
    - { id: D15, libelle: "Reprendre",                 usage: "Continuer un Parcours en cours, ou audio en pause." }
    - { id: D16, libelle: "Relancer",                  usage: "Recommencer un Parcours déjà complété ou abandonné." }
    - { id: D17, libelle: "Mettre en pause",           usage: "Suspendre un Parcours ou une lecture audio." }
    - { id: D18, libelle: "Abandonner",                usage: "Sortir d'un Parcours en cours (dialogue M8)." }
    - { id: D19, libelle: "Sauter cette étape",        usage: "Marquer l'étape non complétée, passer à la suivante." }
