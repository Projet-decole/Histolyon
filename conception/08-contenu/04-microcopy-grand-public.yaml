# -----------------------------------------------------------------------------
# 5. Microcopy de demande de permission
# -----------------------------------------------------------------------------
# Pour chaque permission, un dialogue préalable (E-TRANSVERSES-DIALOGUE-PERMISSION)
# qui explique le bénéfice contextuel ET la garantie de cadre AVANT que l'OS
# n'affiche son prompt. Application stricte de PT4.
permissions:

  - permission: geolocalisation
    contexte_d_appel: "Tap sur le point d'accès localisation de la Carte, ou démarrage d'un Parcours en mode terrain (C4 → C5), ou activation de Surprenez-moi (A5)."
    titre_dialogue: "Activer la localisation"
    description_dialogue: >-
      Pour vous proposer ce qui se trouve à proximité, l'app a besoin de
      connaître votre position. Aucune donnée n'est transmise au-delà de
      votre téléphone.
    boutons: ["Autoriser", "Plus tard"]
    refus_consequence: "Vous pouvez utiliser HistoLyon sans la localisation. Vous explorerez la carte manuellement."
    deja_refusee_orientation: "Vous avez précédemment refusé la localisation. Pour la réactiver, ouvrez les paramètres de votre téléphone."

  - permission: notifications
    contexte_d_appel: "Activation du mode Surprenez-moi (A5), ou démarrage d'un Parcours en mode terrain qui s'appuie sur des alertes d'arrivée à étape (C5)."
    titre_dialogue: "Activer les notifications"
    description_dialogue: >-
      Pour vous prévenir quand vous passez près d'un lieu intéressant ou
      quand vous arrivez à une étape, l'app a besoin de pouvoir vous
      envoyer des notifications. Vous pouvez les désactiver à tout moment.
    boutons: ["Autoriser", "Plus tard"]
    refus_consequence: "Le mode Surprenez-moi reste désactivé. Vous pourrez l'activer plus tard depuis les paramètres."
    deja_refusee_orientation: "Vous avez précédemment refusé les notifications. Pour les réactiver, ouvrez les paramètres de votre téléphone."

  - permission: camera
    contexte_d_appel: "Bascule vers la consultation AR (B4 → B5) sur un Pin doté d'un Modèle 3D ancré géographiquement."
    titre_dialogue: "Activer la caméra"
    description_dialogue: >-
      Pour superposer la reconstitution 3D à l'emplacement réel, l'app a
      besoin d'accéder à votre caméra. La caméra n'est utilisée que pendant
      la consultation AR — aucune image n'est enregistrée.
    boutons: ["Autoriser", "Plus tard"]
    refus_consequence: "Vous pouvez consulter le modèle 3D sans superposition à la caméra."
    deja_refusee_orientation: "Vous avez précédemment refusé l'accès à la caméra. Pour le réactiver, ouvrez les paramètres de votre téléphone."

# -----------------------------------------------------------------------------
# 6. Microcopy d'erreurs et d'états dégradés
# -----------------------------------------------------------------------------
# Libellés génériques. Une instance d'écran peut surcharger en spécifiant
# (cf. § 4), mais ces formes sont la base si rien n'est précisé.
erreurs_et_etats_degrades:

  connexion_perdue_pendant_action:
    voix: app
    libelle: "Connexion perdue. Vos modifications sont conservées, vous pouvez réessayer dès le retour de la connexion."
    note: "PT5 refus gracieux. Pas « Erreur réseau » (technique), pas « Oups ! » (peppy)."

  connexion_retrouvee:
    voix: app
    libelle: "Connexion retrouvée."
    note: "M9 simple. À utiliser en complément du bandeau P3 quand l'utilisateur a une opération en attente."

  cible_pin_retiree:
    voix: app
    libelle_inline: "Ce pin n'est plus disponible."
    libelle_avec_action: "Ce pin n'est plus disponible. Retour à la carte."
    note: "Ne JAMAIS dire « Erreur 404 » ou « Contenu introuvable ». Le retrait est une décision, pas un bug."

  cible_parcours_retiree:
    voix: app
    libelle_inline: "Ce parcours n'est plus disponible."
    libelle_complet: "Ce parcours n'est plus disponible publiquement. Si vous l'aviez en cours, votre progression reste à vous."

  permission_refusee_apres_demande:
    voix: app
    libelles_par_permission:
      geolocalisation: "Permission de localisation refusée. Vous pouvez explorer la carte manuellement."
      notifications: "Permission de notifications refusée. Le mode Surprenez-moi reste désactivé."
      camera: "Permission de caméra refusée. Vous pouvez consulter le modèle 3D sans la superposition à la caméra."
    note: "PT5. Ce que la suite reste possible, posé sereinement."

  permission_definitivement_refusee_par_os:
    voix: app
    libelle: "Cette permission a été refusée définitivement. Pour la réactiver, ouvrez les paramètres de votre téléphone."
    action: "Ouvrir les paramètres système"
    reutilise_dictionnaire: [D31]

  echec_de_chargement:
    voix: app
    libelle_court: "Erreur de chargement."
    libelle_avec_action: "Erreur de chargement. Réessayez."
    note: "D45 + D4. PT5. Pas de stack trace, pas de code d'erreur visible utilisateur."

  echec_d_envoi:
    voix: app
    libelle: "L'envoi n'a pas abouti. Réessayez."
    note: "Préférable à « Échec de la requête ». Le « n'a pas abouti » est neutre, pas accusateur."

  validation_manquante_champ_requis:
    voix: app
    libelle_generique: "Ce champ est requis."
    libelle_email_invalide: "Cet email n'a pas le bon format."
    libelle_pseudonyme_pris: "Ce pseudonyme est déjà pris."
    note: "Toujours une indication précise du quoi. Pas de « Saisie incorrecte » (vague)."

  saisie_invalide_seuil_minimum:
    voix: app
    libelle_pattern: "Ajoutez encore quelques caractères avant d'envoyer."
    libelle_specifique_commentaire: "Ajoutez quelques mots avant d'envoyer."
    note: "Pas de compteur en mode reproche (« 0/200 caractères »). Le compteur reste un indicateur neutre."

  serveur_indisponible:
    voix: app
    libelle: "Le service est momentanément indisponible. Réessayez dans quelques instants."
    note: "Rare. Préférable à « Erreur 500 »."

# -----------------------------------------------------------------------------
# 7. Microcopy de cohésion narrative
# -----------------------------------------------------------------------------
# Transitions et notifications qui tissent la narration AU FIL des Parcours
# et des notifications de proximité. Voix DU RÉCIT (tutoiement narratif).
# Articulation directe avec les flows C5, C6 et E1, E2.
cohesion_narrative:

  transitions_mode_terrain_c5:
    voix: récit
    note: "Voix du récit cohérente avec le tutoiement narratif (cf. pilote § conteur.voix)."
    patterns:
      - situation: "Démarrage d'un parcours en mode terrain (étape 1)"
        libelle: "Tu démarres le parcours. La première étape est à {distance}."
      - situation: "Approche de l'étape courante"
        libelle: "Tu approches de l'étape {n}."
      - situation: "Arrivée à l'étape (E2)"
        libelle: "Tu es arrivé à l'étape {n} sur {total}."
      - situation: "Étape suivante"
        libelle: "L'étape suivante est à {distance}."
      - situation: "Éloignement du tracé"
        libelle: "Tu sembles t'éloigner du tracé."
      - situation: "Dernière étape franchie"
        libelle: "Dernière étape. Le bout du chemin."

  transitions_mode_canape_c6:
    voix: récit (titres / transitions narratives) ; app (libellés d'action)
    patterns:
      - situation: "Bouton de transition vers étape suivante"
        libelle: "Étape suivante"
        voix: app
      - situation: "Bouton de transition vers étape précédente"
        libelle: "Étape précédente"
        voix: app
      - situation: "Étape courante mise en évidence (titre narratif)"
        libelle: "Étape {n} sur {total} — {titre_pin}"
        voix: app
        note: "Composé de libellés app, mais l'enveloppe peut être enrichie en mode présentation par une transition narrative tirée du contenu éditorial du Parcours (cf. cluster 02 transitions_narratives — hors périmètre microcopy)."

  notifications_de_proximite:
    voix: récit pour le message, app pour les libellés d'action
    e1_surprenez_moi:
      message: "Une histoire t'attend à proximité."
      action_implicite: "(tap sur la notification = ouverture de l'aperçu rapide du Pin concerné)"
    e2_arrivee_a_etape:
      message: "Tu es arrivé à l'étape {n} sur {total}."
      action_implicite: "(tap sur la notification = ouverture de la consultation approfondie de l'étape)"
    notification_systeme_externe:
      note: >-
        Quand l'app n'est pas au premier plan, la notification est rendue
        par l'OS. Le titre est « HistoLyon » (le système ajoute le nom de
        l'app), le corps suit les patterns ci-dessus. Le tu narratif est
        conservé.

  reconnaissance_de_fin_de_parcours_c9:
    voix: récit
    note: "PT6 reconnaissance de fin et PT7 tonalité de complétion partielle (cf. pilote)."
    patterns:
      - situation: "Complétion totale"
        libelle: "Tu as parcouru les {n} étapes du {nom_parcours}. Voici ce qu'on a vu ensemble."
      - situation: "Complétion partielle"
        libelle: "Tu as parcouru {n} étapes sur {total}. Le reste t'attend quand tu voudras."
      - situation: "Parcours retiré pendant qu'il était en cours"
        libelle: "Ce parcours n'est plus disponible publiquement, mais ce que tu as vu reste à toi."

  premier_lancement_a1:
    voix: récit
    libelle: "Lyon. Tu peux remonter le temps, ici, là où tu marches."
    note: "Exemple canonique du pilote. Apparaît en accueil discret au tout premier lancement (E-CARTE-PRINCIPALE — état premier_lancement)."
