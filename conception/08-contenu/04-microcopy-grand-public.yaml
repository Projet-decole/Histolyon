  entites_libelles_visibles:
    note: "Cohérence terminologique (cf. pilote P7). Pas de variation lexicale (« point d'intérêt », « itinéraire »)."
    entrees:
      - { id: D90,  libelle: "Pin",                  usage: "Capitalisé en début de phrase, minuscule au fil." }
      - { id: D91,  libelle: "Parcours",             usage: "Invariable au pluriel. Minuscule au fil." }
      - { id: D92,  libelle: "Étape",                usage: "Numérotation : « Étape 3 sur 7 »." }
      - { id: D93,  libelle: "Catégorie",            usage: "Catalogue ouvert." }
      - { id: D94,  libelle: "Époque",               usage: "Préférable à « Période » (vague)." }
      - { id: D95,  libelle: "Source",               usage: "Source documentaire. Pluriel courant." }
      - { id: D96,  libelle: "Couche cartographique", usage: "Souvent abrégé en « couche »." }
      - { id: D97,  libelle: "Commentaire",          usage: "Minuscule au fil." }
      - { id: D98,  libelle: "Signalement",          usage: "Soumission de modération." }
      - { id: D99,  libelle: "Retour de parcours",   usage: "Forme courte « retour » au fil." }
      - { id: D100, libelle: "Compte",               usage: "Distinct du Profil (qui existe par défaut)." }
      - { id: D101, libelle: "Code visuel",          usage: "Préférable à « QR code » (anglicisme)." }
      - { id: D102, libelle: "Lien",                 usage: "Forme courte du Lien universel." }

  connecteurs_listes:
    - { id: D110, libelle: "Aucun",             usage: "État vide. « Aucun favori pour l'instant »." }
    - { id: D111, libelle: "Tous",              usage: "Filtre maximal. Préférable à « Tout » (vague)." }
    - { id: D112, libelle: "Récents",           usage: "Tri par date la plus récente." }
    - { id: D113, libelle: "Plus anciens",      usage: "Préférable à « Anciens » (suggère obsolescence)." }
    - { id: D114, libelle: "Tout réinitialiser", usage: "Lever tous les filtres." }
    - { id: D115, libelle: "Voir tout",         usage: "Vers liste exhaustive depuis aperçu tronqué." }
    - { id: D116, libelle: "Filtrer",           usage: "Ouvrir M6 de filtres." }
