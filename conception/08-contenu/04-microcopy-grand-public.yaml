# -----------------------------------------------------------------------------
# 3. Patterns de microcopy par mode de présentation
# -----------------------------------------------------------------------------
# Pour chaque mode P5.M2-M9 : voix, longueur, libellés structurants, exemples.
# Patterns PT1-PT7 référencés par id (cf. pilote).
patterns_par_mode:

  - mode: P5.M2
    nom: "Aperçu rapide"
    voix_par_defaut: récit (teaser) + app (boutons)
    longueur_typique: phrase pour le teaser, haïku pour les actions
    libelles_structurants:
      titre: "titre du Pin (cf. cluster 01) — pas de qualificatif"
      teaser: "extrait court du contenu narratif (cf. 02-template-pin) — voix du récit"
      categorie_epoque: "libellé court issu du catalogue (D93, D94)"
      actions:
        - "D20 Approfondir (point d'accès vers M3)"
        - "D21 Mettre en favori / D22 Retirer des favoris"
        - "D10 Partager"
        - "D23 Signaler (uniquement si Pin communautaire)"
    exemples_canoniques:
      - contexte: "Aperçu rapide d'un Pin sur la Carte (E-CARTE-APERCU-PIN)"
        teaser: "Cette traboule traversait toute la maison. Les canuts l'utilisaient pour sortir leurs pièces de soie sans les abîmer dans la pluie."
        note: "Phrase-fait-pourquoi. Le teaser réel est de la responsabilité éditoriale ; ici on capture le PATTERN de longueur et de cadrage."
      - contexte: "Aperçu rapide d'un Parcours dans le catalogue (état hypothétique au sein de E-PARCOURS-FICHE-DETAIL)"
        teaser_court: "Sept étapes, une heure de marche, du Vieil Lyon au Jardin des Curiosités."
        note: "Métadonnées synthétisées en une phrase neutre."

  - mode: P5.M3
    nom: "Consultation approfondie"
    voix_par_defaut: récit (récit principal) + app (chrome et boutons)
    longueur_typique: récit ou paragraphe pour le contenu, haïku pour les actions
    libelles_structurants:
      titre: "titre du Pin ou du Parcours, sans préfixe (« Bellecour », pas « Pin : Bellecour »)"
      sections_de_navigation:
        - "Récit / Sources / Commentaires (Pin)"
        - "Étapes / Retours / Détails (Parcours)"
      actions:
        - "D20 Approfondir (vers M4 si applicable)"
        - "D21/D22 favoris, D10 partage, D23 signalement"
        - "D6 Retour"
    exemples_canoniques:
      - contexte: "Section commentaires vide d'un Pin"
        invite: "Soyez le premier à laisser un commentaire."
        note: "PT3 invitation sobre. Pas de « Aucun commentaire pour l'instant 😊 ». Pas non plus « Personne n'a réagi »."
      - contexte: "Pin communautaire en revue (marque distinctive)"
        message: "Sources en cours de vérification."
        note: "D50 du dictionnaire. Phrase nominale, factuelle."

  - mode: P5.M4
    nom: "Mode présentation"
    voix_par_defaut: minimal — récit pour le contenu projeté, voix de l'app uniquement pour le retour
    longueur_typique: récit pour le contenu ; haïku unique pour le retour
    libelles_structurants:
      contenu: "le contenu narratif du Pin tel qu'en M3, sans changement"
      retour: "« D6 Retour » discret, OU pas de libellé textuel si l'icône suffit (palier 10)"
    exemples_canoniques:
      - contexte: "Mme Martin projette en classe — bascule M3 → M4"
        retour: "Quitter la présentation"
        note: "Légère reformulation de D6 acceptable ici (« Quitter la présentation » plutôt que « Retour ») parce que la notion de pile est invisible en M4."

  - mode: P5.M6
    nom: "Surface ponctuelle"
    voix_par_defaut: app
    longueur_typique: haïku ou phrase pour les libellés, paragraphe rare
    libelles_structurants:
      titre: "intention courte, formulée comme l'action (« Filtrer le catalogue », « Choisir une époque »). Préférable à un nom (« Filtres »)."
      champs: "libellé du champ + indication courte si nécessaire"
      actions: "validation positive (D14, D9, D24, D25 selon contexte) + D2 Annuler"
    exemples_canoniques:
      - contexte: "E-CARTE-RECHERCHE saisie vierge"
        invite: "Cherchez un lieu, un quartier, une époque."
        note: "PT3 invitation sobre. Le « cherchez » impératif est ici une invitation, pas une injonction."
      - contexte: "E-PARCOURS-FILTRES validation"
        bouton: "Voir les parcours"
        note: "Plutôt que « Appliquer » (technique). Le libellé dit ce qu'il fait."
      - contexte: "E-COMMUNAUTE-REDACTION-COMMENTAIRE — saisie invalide"
        message: "Ajoutez quelques mots avant d'envoyer."
        note: "PT5 refus gracieux. Pas « Champ obligatoire » (technique froid)."

  - mode: P5.M7
    nom: "Alerte ponctuelle"
    voix_par_defaut: récit pour le message, app pour les actions
    longueur_typique: phrase
    libelles_structurants:
      message: "phrase d'invitation ou de constat doux (PT2 alerte gracieuse OU PT3 invitation sobre)"
      actions: "tap implicite = accepter, geste de fermeture = refuser, ou deux issues explicites pour invitations binaires (D2 / D14 selon contexte)"
    exemples_canoniques:
      - contexte: "Alerte de proximité Surprenez-moi (E1) sur E-CARTE-ALERTE-PROXIMITE"
        message: "Une histoire t'attend à cinquante mètres."
        note: "Voix du récit (tu). Le distance est volontairement floue — pas une mesure technique."
      - contexte: "Alerte d'arrivée à étape (E2)"
        message: "Tu es arrivé à l'étape 3 sur 7."
        note: "Voix du récit. Cohérent avec PT2."
      - contexte: "Invitation au micro-parcours découverte (E-TRANSVERSES-INVITATION-MICROPARCOURS)"
        message: "Découvrir Lyon en quelques minutes ?"
        actions: ["Découvrir", "Plus tard"]
        note: "PT3 invitation sobre. Pas « Voulez-vous faire le tour ? » (timide). Pas « Profitez de notre tutoriel ! » (peppy)."

  - mode: P5.M8
    nom: "Dialogue de confirmation"
    voix_par_defaut: app
    longueur_typique: phrase pour le titre, paragraphe pour la description, haïku pour les boutons
    libelles_structurants:
      titre: "libellé d'action — ce que la confirmation va faire (« Supprimer votre Compte », « Abandonner ce parcours »). PAS un titre décoratif (« Êtes-vous sûr ? »)."
      description: "court paragraphe qui dit ce qui sera fait, ce qui sera perdu, l'éventuelle réversibilité (P5)."
      boutons:
        - "issue de confirmation : libellé qui dit l'action (D13, D18, D25, etc.) — pas « OK »"
        - "issue d'annulation : D2 Annuler"
    exemples_canoniques:
      - contexte: "Confirmation de suppression de Compte (E-PROFIL-PARAMETRES-COMPTE — flow D9)"
        titre: "Supprimer votre Compte"
        description: "La suppression efface vos données synchronisées (favoris, parcours créés, historique). Vos contributions publiques (commentaires, parcours partagés) restent visibles sans votre pseudonyme. Cette action est irréversible."
        boutons: ["Supprimer", "Annuler"]
        note: "Exemple canonique du pilote. P5 annoncer avant d'agir."
      - contexte: "Confirmation d'abandon de Parcours en cours (flow C7)"
        titre: "Abandonner ce parcours ?"
        description: "Vous quittez le parcours en cours. Vous pourrez toujours le relancer plus tard depuis Mes parcours."
        boutons: ["Abandonner", "Annuler"]
        note: "P4 ne pas culpabiliser. Le « pourrez toujours » rassure sans flatter."
      - contexte: "Confirmation de publication d'un Parcours personnel (flow C13)"
        titre: "Publier ce parcours ?"
        description: "La publication change la provenance du parcours en communautaire. Votre pseudonyme apparaît comme auteur. Avant publication, le parcours passe par modération."
        boutons: ["Publier", "Annuler"]

  - mode: P5.M9
    nom: "Message éphémère"
    voix_par_defaut: app
    longueur_typique: haïku ou phrase
    libelles_structurants:
      message: "PT1 confirmation discrète OU PT2 alerte gracieuse"
      action_secondaire: "rare — D55 « Annuler » uniquement quand l'action est réversible et que l'annulation est utile (cf. retrait d'un favori)"
    exemples_canoniques:
      - contexte: "Lien copié (PT1)"
        message: "Lien copié."
        note: "D52. Phrase nominale, point final, pas d'exclamation."
      - contexte: "Éloignement du tracé (PT2)"
        message: "Tu sembles t'éloigner du tracé."
        note: "Voix du récit. Le « sembles » est une attention, pas une accusation. P4 ne pas culpabiliser."
      - contexte: "Modération en cours après envoi d'un commentaire"
        message: "Votre commentaire est en cours de modération. Il apparaîtra dès qu'il sera validé."
        note: "Plus long qu'un haïku — admis ici parce que l'utilisateur a besoin du contexte. Cf. exemple canonique du pilote."

# -----------------------------------------------------------------------------
# 4. Microcopy par écran
# -----------------------------------------------------------------------------
# Pour chaque écran grand public du palier 7, on pose les libellés
# STRUCTURANTS : titre, états clés (vide, erreur, offline, premier_usage),
# actions principales, messages spécifiques. Le reste se déduit du dictionnaire
# (D…) et du pattern de mode.
ecrans:

  carte:

    - ecran: E-CARTE-PRINCIPALE
      titre: "Carte"
      libelles_specifiques:
        premier_lancement_voix_recit: "Lyon. Tu peux remonter le temps, ici, là où tu marches."
        navigateur_temporel_indication_premier_passage: "Glissez pour traverser les époques."
        point_acces_recherche: "Rechercher"
        point_acces_couches: "Couches"
        point_acces_localisation: "Me localiser"
        point_acces_surprenez_moi_actif: "Surprenez-moi (activé)"
        point_acces_surprenez_moi_inactif: "Surprenez-moi"
        message_hors_zone_lyon_voix_app: "Vous semblez être en dehors de la zone couverte. La carte revient sur Lyon."
        vide_a_l_epoque: "Aucun pin à cette époque dans cette zone. Élargissez la vue ou changez d'époque."
        offline_sans_cache: "Connexion indisponible et carte non préchargée. Reconnectez-vous pour explorer la carte."
      reutilise_dictionnaire: [D70, D40, D44, D70, D96, D133, D134, D6, D2]

    - ecran: E-CARTE-APERCU-PIN
      titre: "(titre du Pin — pas de chrome de titre supplémentaire)"
      libelles_specifiques:
        bouton_approfondir: "Voir le récit"
        signalement_uniquement_communautaire: "Signaler ce pin"
        offline_sans_cache: "Ce pin n'a pas été préchargé. Reconnectez-vous pour le lire."
        pin_retire: "Ce pin n'est plus disponible. Retour à la carte."
      reutilise_dictionnaire: [D20, D21, D22, D10, D23, D8, D44, D49, D50, D90]

    - ecran: E-CARTE-RECHERCHE
      titre: "Rechercher"
      libelles_specifiques:
        invite_saisie_vierge: "Cherchez un lieu, un quartier, une époque."
        compteur_resultats: "{n} résultats"
        compteur_resultats_singulier: "1 résultat"
        aucun_resultat: "Aucun résultat. Essayez d'élargir votre recherche."
        offline_recherche_locale: "Recherche limitée au contenu téléchargé."
      reutilise_dictionnaire: [D2, D40, D44, D94, D93, D8, D116, D117]

    - ecran: E-CARTE-FILTRES-COUCHES
      titre: "Couches"
      libelles_specifiques:
        compteur_pins_visibles: "{n} pins visibles"
        raccourci_tout_voir: "Tout afficher"
        aucune_couche_active: "Aucune couche active. La carte est vide."
        nouveaute: "Nouveau"
      reutilise_dictionnaire: [D96, D110, D8, D2]

