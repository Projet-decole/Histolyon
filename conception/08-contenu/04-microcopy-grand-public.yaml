    - { id: D56, libelle: "Modifications enregistrées", usage: "Après modification de paramètres." }
    - { id: D57, libelle: "Brouillon enregistré",      usage: "Après sauvegarde explicite d'un brouillon." }
    - { id: D58, libelle: "Envoyé pour modération",    usage: "Après soumission. Préférable à « Soumis » (technique)." }

  sections:
    - { id: D70, libelle: "Carte",            usage: "Section S1." }
    - { id: D71, libelle: "Parcours",         usage: "Section S2 — vue catalogue." }
    - { id: D72, libelle: "Profil",           usage: "Section S3. Préférable à « Mon compte » (exclut anonyme) ou « Moi » (familier)." }
    - { id: D73, libelle: "Mes parcours",     usage: "Vue interne S2 (brouillons, en cours, historique)." }
    - { id: D74, libelle: "Catalogue",        usage: "Vue interne S2 du contenu éditorial et communautaire." }
    - { id: D75, libelle: "Favoris",          usage: "Sous-section S3." }
    - { id: D76, libelle: "Historique",       usage: "Sous-section S3 (sans qualificatif)." }
