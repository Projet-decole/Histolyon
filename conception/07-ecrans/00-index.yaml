# =============================================================================
# Palier 7 — Écrans — INDEX
# =============================================================================
# Le palier 7 livre l'inventaire EXHAUSTIF des écrans de l'app HistoLyon. Pour
# chaque écran : son mode (palier 5), sa surface parente, ses zones
# fonctionnelles, ses états (vide, chargement, rempli, erreur, offline,
# permission refusée, premier usage…), ses éléments interactifs, ses flows
# actifs, ses surfaces imbriquées.
#
# C'est un palier de SYNTHÈSE — il assemble les modes (palier 5), les entités
# (palier 4) et les flows (palier 6) en spécifications concrètes. Il ne
# réinvente RIEN.
#
# Granularité : 1 fiche par ÉCRAN avec TOUS ses états (pas une fiche par
# état). 1 fichier par écran (cf. brief intention.yaml). Les écrans sont
# regroupés en 8 sous-dossiers par surface ou famille fonctionnelle.
# =============================================================================

document:
  type: palier_ecrans_index
  numero: 7
  version: "0.1"
  date: "2026-05-05"
  role: "Index, format de fiche, inventaire des 48 écrans"
  format: yaml
  prerequis_de_lecture:
    - "design/conception/04-donnees/00-index.yaml + clusters"
    - "design/conception/05-architecture-info.yaml — modes M1-M9, surfaces S1-S3, persistantes P1-P3"
    - "design/conception/06-flows/00-index.yaml + 8 fichiers de famille (A à H)"

# -----------------------------------------------------------------------------
# 1. Périmètre
# -----------------------------------------------------------------------------
perimetre:

  inclus:
    - "Pour chaque écran : mode (P5), surface parente, raison d'être, composition fonctionnelle (zones), états (vide/chargement/rempli/erreur/offline/permission refusée/premier usage), éléments interactifs, flows actifs, surfaces imbriquées"
    - "Tous les écrans grand public (carte, pin, parcours, profil, communauté, partage)"
    - "Surfaces transverses (persistantes P1-P3, dialogues M8 génériques, messages éphémères M9 génériques, alertes M7, demande de permission)"
    - "Écrans back-office Anaïs (admin/) — décision utilisateur 2026-05-05 : Anaïs persona MAJEUR mérite ses écrans même si desktop hors palier 5"

  exclus:
    - "Composants UI nommés (BottomSheet, FAB, TabBar, Drawer) — palier 10"
    - "Pixels, position spatiale précise, dimensions, mise en page détaillée — palier 10 + palier 12"
    - "Couleurs, opacités, valeurs visuelles — paliers 9, 12"
    - "Microcopy exacte (libellés, titres, messages) — palier 8"
    - "Animations, courbes, timings — palier 11"
    - "Mesures techniques chiffrées — palier 16"
    - "Implémentation technique (router, gestion d'état, stockage)"

  test_de_purete: >-
    Si demain on bascule de Flutter à du natif iOS, ou on remplace tous
    les composants UI par des analogues, la fiche d'écran reste-t-elle
    valide ? Si oui, c'est bon. Si non, elle a contaminé le palier 10
    (composants) ou le palier 12 (tokens).

# -----------------------------------------------------------------------------
# 2. Découpage en 8 sous-dossiers
# -----------------------------------------------------------------------------
sous_dossiers:

  - id: "01"
    nom: "carte/"
    role: "Tout ce qui vit dans la surface principale Carte (P5.S1) : vue d'accueil, aperçu Pin, recherche, filtres de couches, alerte de proximité"
    pilote: true

  - id: "02"
    nom: "pin/"
    role: "Consultations approfondies de Pin (P5.M3, P5.M4) et variantes 3D / AR"

  - id: "03"
    nom: "parcours/"
    role: "Tout ce qui vit dans la surface Parcours (P5.S2) : catalogue, filtres, fiche, lancement, déroulé terrain et canapé, saut d'étape, célébration, éditeur de Parcours personnel"

  - id: "04"
    nom: "profil/"
    role: "Tout ce qui vit dans la surface Profil (P5.S3) : accueil, favoris, historique, paramètres, gestion du Compte (création / connexion / sync)"

  - id: "05"
    nom: "communaute/"
    role: "Surfaces de production communautaire : rédaction d'un Commentaire, rédaction d'un Signalement, soumission d'un Pin, suivi des soumissions, rédaction d'un Retour de parcours"

  - id: "06"
    nom: "partage/"
    role: "Surfaces de partage : Code visuel, écran de fin de parcours partageable"

  - id: "07"
    nom: "transverses/"
    role: "Surfaces réutilisables : surfaces persistantes P1-P3, dialogue M8 générique, message éphémère M9 générique, dialogue de permission juste-à-temps, indication ponctuelle d'onboarding"

  - id: "08"
    nom: "admin/"
    role: "Écrans back-office (desktop) pour Anaïs : tableau de bord, catalogue Pins, saisie via Template, validation scientifique, modération communautaire, modération soumissions, promotion communautaire, retrait/réouverture"

