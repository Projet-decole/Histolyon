# -----------------------------------------------------------------------------
# 4. Format d'une fiche d'écran
# -----------------------------------------------------------------------------
# Format strict, illustré par les fichiers du sous-dossier pilote carte/.
format_des_fiches:

  champs_obligatoires:
    - id
    - nom
    - mode
    - surface_parente
    - raison_d_etre
    - composition       # zones fonctionnelles, sans pixels
    - etats             # tous les états pertinents (vide, chargement, erreur, offline, etc.)
    - elements_interactifs
    - flows_actifs

  champs_recommandes:
    - surfaces_imbriquees    # surfaces qui peuvent s'ouvrir par-dessus
    - entites_affichees      # liste des entités du palier 4 affichées
    - questions_ouvertes

  consigne_composition: |
    composition décrit les ZONES FONCTIONNELLES de l'écran — quoi
    s'y passe, pas comment c'est rendu. Pas de pixels, pas de
    composant UI nommé, pas de position spatiale précise.

    Bon : "zone d'aperçu rapide affichant titre, catégorie, époque, teaser narratif"
    Mauvais : "BottomSheet de 40% de hauteur en bas de l'écran, fond crème"

  consigne_etats: |
    Énumérer TOUS les états pertinents pour l'écran. Pour chacun, une
    phrase qui décrit ce qui change fonctionnellement (pas le rendu).

    États récurrents :
      - nominal_charge : tout est chargé et l'écran fonctionne normalement
      - chargement : données en cours de chargement
      - vide : aucune donnée à afficher (favori vide, recherche sans résultat)
      - offline_avec_cache : pas de réseau mais données locales disponibles
      - offline_sans_cache : pas de réseau et pas de données locales
      - erreur : échec de chargement ou d'opération
      - permission_refusee : permission système requise non accordée
      - premier_usage : première fois que l'utilisateur arrive ici
      - état spécifique : tout autre état fonctionnellement signifiant

  consigne_references:
    mode: "Préfixe P5.M{1-9} ou « back-office »"
    surface_parente: "Préfixe P5.S{1-3} ou P5.P{1-3} ou « transverse » ou « back-office »"
    flows_actifs: |
      Liste d'identifiants courts (A1, B2, C5, D6, E1, F5, G3, H1...).
      INTERDIT : chaînes en français (« porte d'entrée vers H1, H2... », « tout flow émettant un message éphémère »).
      EXCEPTION pour les écrans-templates et dispatchers : utiliser le marker
      ["template-générique"] et lister les instances dans une note séparée
      (cf. E-TRANSVERSES-DIALOGUE-CONFIRMATION, E-ADMIN-ACCUEIL).
    entites_affichees: |
      Nom métier (Pin, Parcours, Étape, Profil, Compte, Trace de modération...).
      Position : préférer la position au niveau de chaque ZONE de la composition.
      Au niveau racine de la fiche est admis seulement si toutes les zones
      affichent les mêmes entités (rare).
    surfaces_imbriquees: "Référence à un autre écran par son id (E-CARTE-RECHERCHE, E-TRANSVERSES-DIALOGUE-CONFIRMATION...)"
    exemples_concrets_dans_les_fiches: |
      Quand une fiche illustre une zone par un exemple éditorial concret
      (« Antiquité / XVIIIe / Aujourd'hui sur Bellecour », un motif d'annotation
      type « cette date est-elle exacte ? »), MARQUER explicitement comme
      « (exemple — palier 8) » pour éviter la confusion avec une bavure
      microcopy. Les exemples sont autorisés mais doivent être tracés.

  contraintes_de_redaction:
    - "Pas de composant UI nommé (BottomSheet, FAB, TabBar, Drawer)"
    - "Pas de pixels, dimensions, position spatiale précise"
    - "Pas de couleur, opacité, valeur visuelle"
    - "Pas de microcopy exacte (libellés entre guillemets) — palier 8"
    - "Pas d'animation ni de timing — palier 11"
    - "Pas de mesure technique — palier 16"
    - "Si en doute, mettre dans questions_ouvertes plutôt qu'inventer"

# -----------------------------------------------------------------------------
# 5. Conventions
# -----------------------------------------------------------------------------
conventions:

  un_fichier_par_ecran: >-
    Chaque écran a son propre fichier YAML dans son sous-dossier (ex.
    07-ecrans/carte/01-principale.yaml). Numérotation dans le sous-dossier
    pour ordonner. Un sous-dossier = un thème ; un fichier = un écran.

  references_inter_ecrans: >-
    Les surfaces_imbriquees citent un autre écran par son id (préfixe E-).
    Permet de naviguer dans l'inventaire sans ambiguïté.

  variantes_admises: >-
    - admin/ ne référence pas P5.* (back-office hors palier 5)
    - Les fiches transverses peuvent avoir surface_parente = "transverse"
    - Les fiches polymorphes (E-COMMUNAUTE-REDACTION-SIGNALEMENT) peuvent
      avoir surface_parente = "polymorphe (S1, S2…)"
