# =============================================================================
# Palier 6 — Flows — INDEX
# =============================================================================
# Le palier 6 livre le DÉROULÉ pas à pas de chaque parcours utilisateur. Il
# s'appuie sur les fonctionnalités du palier 3, les entités du palier 4, et
# les surfaces / modes / règles du palier 5. Il ne réinvente rien — il
# ASSEMBLE.
#
# Granularité : flows ATOMIQUES. Un flow = un déclencheur clair, une
# séquence, une sortie nette. Les enchaînements vers un autre flow se font
# par référence (« bascule vers Cx ») — pas par imbrication.
#
# Sources de référence STRICTEMENT limitées au palier 3, palier 4 et palier 5
# de design/conception/. Le fichier archives/_bmad-output/design/user-flows.md
# n'est PAS utilisé (décision utilisateur 2026-05-05 — confiance insuffisante).
# =============================================================================

document:
  type: palier_flows_index
  numero: 6
  version: "0.1"
  date: "2026-05-05"
  role: "Index et conventions du palier 6"
  format: yaml
  prerequis_de_lecture:
    - "design/conception/03-fonctionnalites/00-index.yaml + les 11 domaines D1-D11"
    - "design/conception/04-donnees/00-index.yaml + les 6 fichiers de cluster"
    - "design/conception/05-architecture-info.yaml"

# -----------------------------------------------------------------------------
# 1. Périmètre
# -----------------------------------------------------------------------------
perimetre:

  inclus:
    - "Déroulé pas à pas de chaque flow utilisateur (étapes, états, bifurcations)"
    - "Cas particuliers (offline, permission refusée, abandon, conflit)"
    - "Sorties (normales et exceptionnelles)"
    - "Articulation avec les surfaces et modes du palier 5"
    - "Articulation avec les entités et invariants du palier 4"
    - "Renvoi aux fonctionnalités du palier 3 par identifiant Dx.y"

  exclus:
    - "Écrans spécifiques, mise en page, position spatiale — palier 7"
    - "Composants UI nommés (BottomSheet, FAB, TabBar) — palier 10"
    - "Microcopy, libellés exacts — palier 8"
    - "Animations, courbes, timings — palier 11"
    - "Couleurs, opacités, valeurs visuelles — paliers 9, 12"
    - "Mesures techniques chiffrées — palier 16"

  test_de_purete: >-
    Si demain on bascule de Flutter à du natif iOS, ou d'un router
    à un autre, est-ce que la fiche reste valide ? Si oui, c'est
    bon. Si non, elle a contaminé l'implémentation ou la couche
    écran (palier 7).

# -----------------------------------------------------------------------------
# 2. Découpage en 7 fichiers
# -----------------------------------------------------------------------------
fichiers:

  - id: 01
    nom: "Découverte et exploration"
    fichier: "01-decouverte.yaml"
    role: "Premier lancement, exploration de la carte, recherche, activation des modes, demande de permission"
    flows: [A1, A2, A3, A4, A5, A6]

  - id: 02
    nom: "Consultation d'un Pin"
    fichier: "02-consultation-pin.yaml"
    role: "Aperçu rapide, consultation approfondie, navigation multi-époque, 3D/AR, post-narratif, favori"
    flows: [B1, B2, B3, B4, B5, B6, B7]

  - id: 03
    nom: "Parcours"
    fichier: "03-parcours.yaml"
    role: "Catalogue, fiche, lancement, déroulé terrain et canapé, déviations, fin, création, publication"
    flows: [C1, C2, C3, C4, C5, C6, C7, C8, C9, C10, C11, C12, C13]
    pilote: true
    note: "Pilote — sert d'exemple canonique de format pour les autres fichiers"

  - id: 04
    nom: "Profil et données personnelles"
    fichier: "04-profil-compte.yaml"
    role: "Espace personnel, favoris, historique, paramètres, Compte (création / connexion / sync / suppression)"
    flows: [D1, D2, D3, D4, D5, D6, D7, D8, D9]

  - id: 05
    nom: "Notifications de proximité"
    fichier: "05-notifications.yaml"
    role: "Déclenchement Surprenez-moi, arrivée à étape de parcours, fallback manuel"
    flows: [E1, E2, E3]

  - id: 06
    nom: "Partage et entrées externes"
    fichier: "06-partage.yaml"
    role: "Déclenchement de partage, fin de parcours partageable, code visuel, Lien universel reçu"
    flows: [F1, F2, F3, F4, F5]

  - id: 07
    nom: "Communauté"
    fichier: "07-communaute.yaml"
    role: "Commentaires, signalements, soumission de pin, suivi de soumission, Retour de parcours"
    flows: [G1, G2, G3, G4, G5, G6]

  - id: 08
    nom: "Back-office et production"
    fichier: "08-back-office.yaml"
    role: "Saisie pin éditorial, validation scientifique, modération, promotion communautaire, retrait/réouverture"
    flows: [H1, H2, H3, H4, H5, H6]

