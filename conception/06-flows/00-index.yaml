# -----------------------------------------------------------------------------
# 4. Format d'une fiche de flow
# -----------------------------------------------------------------------------
# Format strict. Le pilote 03-parcours.yaml l'illustre concrètement.
format_des_fiches:

  champs_obligatoires:
    - id
    - nom
    - declencheur
    - acteurs
    - deroule
    - sorties_normales

  champs_recommandes:
    - pre_requis_specifiques     # voir consigne ci-dessous — UNIQUEMENT non triviaux
    - bifurcations
    - cas_particuliers
    - entites_impliquees
    - surfaces_et_modes
    - references_palier_3
    - invariants_respectes
    - questions_ouvertes

  consigne_pre_requis: |
    Les pre_requis_specifiques ne contiennent QUE des conditions
    NON TRIVIALES qui pourraient être vraies ou fausses au moment
    du déclenchement et qui CONDITIONNENT le déroulé.

    À NE PAS écrire :
      - "Le Pin existe" (s'il est tapé, c'est qu'il existe)
      - "L'utilisateur a un Profil" (toujours vrai, cf. cluster 03 I6)
      - "L'app est lancée" (évident)
      - "La Carte est affichée" (sauf si c'est précisément la condition discriminante)

    À écrire (exemples valides) :
      - "Permission de géolocalisation accordée" (peut être refusée)
      - "Au moins un Compte créé" (condition I2 pour publier)
      - "Mode Surprenez-moi activé dans les préférences du Profil"
      - "Connexion réseau disponible" (si la fonctionnalité requiert)
      - "Au moins un Parcours en provenance personnelle existant" (pour relancer)
      - "Pin doté d'un Modèle 3D" (pour le flow 3D/AR)
      - "Parcours dans l'état en cours" (pour la pause / saut d'étape)

    Si un flow n'a aucun pré-requis non trivial, omettre le champ.

  consigne_deroule: |
    Le déroulé décrit la séquence d'actions du flow normal (chemin
    nominal). Chaque étape comporte au moins une action ; un état
    d'app est précisé quand il aide à comprendre.

    Exemple :
      deroule:
        - etape: 1
          action: "..."
          surfaces_actives: [P5.S1, P5.M2]    # facultatif
        - etape: 2
          action: "..."

    Les variations et chemins alternatifs vont dans `bifurcations`,
    pas dans le déroulé.

    VARIANTE — déroulé en sous-cas nommés (pour flows à plusieurs
    branches structurellement distinctes) :
      deroule:
        cas_xxx:
          - etape: 1
            action: "..."
        cas_yyy:
          - etape: 1
            action: "..."

    Cette variante est utilisée par C7, C12, G3, H4, H6 quand un
    flow couvre plusieurs branches de même nature (ex. cas_pin /
    cas_parcours pour H4, cas_ajout / cas_retrait / cas_reordonnancement
    pour C12). Réservée aux cas où la séparation rend la lecture plus
    claire qu'une succession de bifurcations.

  consigne_bifurcations: |
    Format : `si <condition utilisateur ou système> → <conséquence>`
    Conséquence typique : « bascule vers le flow Xy » ou « le flow
    se termine en sortie alternative Z ».

    Une bifurcation ne décrit pas le détail de ce qui se passe
    après la bascule — la cible (autre flow, sortie) le décrit.

  consigne_cas_particuliers: |
    Cas où le déroulé nominal est altéré par une condition
    extérieure : offline, permission refusée, erreur réseau,
    conflit avec un autre flow actif, etc. Format :
      cas_particuliers:
        - cas: "..."
          comportement: "..."

    Distincts des bifurcations qui sont des choix utilisateur
    explicites.

  consigne_references:
    surfaces_et_modes: "Préfixe P5. (ex. P5.S1, P5.M3, P5.P1, P5.N4, P5.C2, P5.E2) pour éviter les conflits de naming avec les familles de flows (C, E)."
    references_palier_3: "Format Dx.y (ex. D1.1, D2.5)"
    entites_impliquees: "Nom métier de l'entité (Pin, Parcours, Étape, Profil, Compte, Trace de modération…) — pas d'identifiant numérique"
    invariants_respectes: "Format Ix (ex. I1, I3, I9)"

  derogations_admises:
    - portee: "Famille H (back-office)"
      derogation: "Le champ surfaces_et_modes peut être absent — les flows H1-H6 opèrent sur des surfaces back-office hors du palier 5 (qui ne couvre que l'app grand public). La structure des surfaces back-office relève du palier 13 admin."
    - portee: "Toute entité immuable (append-only)"
      derogation: "Le cycle_de_vie peut être réduit à `etats: [créée]` + `transitions: []` + une note d'immutabilité. Cf. cluster 04 Trace de modération et cluster 05 Trace de validation pour le précédent palier 4."

# -----------------------------------------------------------------------------
# 5. Conventions de naming et référencement
# -----------------------------------------------------------------------------
conventions_naming:

  flows: "Lettre de famille (A à H) + numéro (ex. A1, B2, C13)"

  references_inter_flows: >-
    Au sein d'un déroulé ou d'une bifurcation, on cite un autre
    flow par son identifiant entre parenthèses : « bascule vers
    B1 » ou « le flow B1 est appelé pour traiter ce cas ». La
    bascule signifie que le flow appelant cesse et que le flow
    appelé prend le relais.

  references_palier_5: >-
    Toutes les références au palier 5 sont préfixées P5. — surfaces
    P5.S1/S2/S3, modes P5.M1 à P5.M9, surfaces persistantes
    P5.P1/P2/P3, règles de navigation P5.N1 à P5.N7, règles de
    coexistence P5.C1 à P5.C6, entrées externes P5.E1 à P5.E3.
    Ce préfixe évite l'ambiguïté avec les familles C et E du
    palier 6.

  references_palier_3: "Format Dx.y simple, sans préfixe (déjà sans ambiguïté)"

  references_palier_4: >-
    Les entités sont citées par leur nom métier (Pin, Parcours,
    Étape, Profil, Compte, Favori, Historique de visite, Commentaire,
    Retour de parcours, Signalement, Trace de validation, Trace de
    modération, Template, Lien universel, Image partageable, Code
    visuel, Catégorie, Époque, Source, Média, Badge, Modèle 3D,
    Fragment musical, Couche cartographique). Les invariants par
    identifiant Ix.
