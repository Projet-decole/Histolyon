  - "M2 aperçu rapide — CRV-EASE-OUT sobre ou CRV-SPRING-DOUX tactile ? À acter CHO-OUVERTURE-M2."
  - "Calage du slider d'Époque — CRV-EASE-OUT sobre ou CRV-SPRING-NET franc ? Test_litmus Mme Martin (projection). À acter CHO-CALAGE-EPOQUE."
  - "DUR-INSTANT à 60ms — sous le seuil de perceptibilité usuel. À VALIDER au palier 16 (proxy-personas)."
