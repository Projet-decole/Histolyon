persona_check:
    kenji:
        pertinence: "Modérée — touriste, peu susceptible de soumettre un pin sur Lyon, mais peut commenter, signaler une erreur factuelle, laisser un retour sur un parcours qu'il a vécu"
        scenarios_passes:
            - scenario: "Kenji repère une erreur factuelle dans un pin (date, nom de personnage)"
              reponse: "Couvert par D9.4 (signalement avec motif 'information historiquement fausse'). Le motif est clair, l'identité de Kenji n'est pas exposée."
            - scenario: "Kenji finit un parcours communautaire et veut donner un retour rapide"
              reponse: "Couvert par D9.3 (retour facultatif en fin de parcours communautaire). Kenji peut passer son chemin si l'interaction lui semble lourde — la fin de parcours fonctionne sans."
            - scenario: "Kenji veut commenter un pin mais n'a pas de compte"
              reponse: "Lecture des commentaires possible sans compte (D9.1). Pour écrire, le compte est requis (cohérent avec D6.5). Pour Kenji qui n'est à Lyon que 2 jours, c'est un arbitrage assumé."
        questions_levees:
            - "Le flot de création de compte doit rester compatible avec un touriste (langue, vitesse) — articulé en D6"

    mme_dupont:
        pertinence: "Élevée — autrice de parcours communautaires (sortie scolaire), reçoit des retours de la part d'autres parents/enseignants"
        scenarios_passes:
            - scenario: "Mme Dupont publie un parcours scolaire et veut savoir s'il a été utile"
              reponse: "Couvert par D9.3 (retours sur parcours communautaires). Elle voit la synthèse si seuil atteint, et l'ensemble des retours dans son profil."
            - scenario: "Son parcours reçoit un commentaire blessant"
              reponse: "Le commentaire passe par modération (D9.1 + D10.5). Mme Dupont peut signaler (D9.4) ; son identité de signaleuse n'est pas révélée."
            - scenario: "Mme Dupont ne veut pas être évaluée pour un parcours expérimental"
              reponse: "Couvert par D9.3 (l'auteur peut désactiver les retours sur son parcours)."
            - scenario: "Mme Dupont propose un pin sur un personnage local oublié"
              reponse: "Couvert par D9.2 (soumission de pin), avec validation par l'équipe avant publication. Mme Dupont, étant enseignante, est attentive à la rigueur — la nécessité de modération lui parle."
        questions_levees:
            - "Le délai de modération typique d'une soumission doit être communiqué — Mme Dupont prépare ses sorties à l'avance, elle a besoin d'une visibilité"

    mme_martin:
        pertinence: "Faible — usage canapé en classe, consomme du contenu validé. Pas un usage cible direct de la couche communautaire."
        scenarios_passes:
            - scenario: "Mme Martin tombe sur un commentaire utilisateur en cours de projection en classe"
              reponse: "Question de visibilité des commentaires en mode présentation sans chrome (canonique D2.5) — recommandation forte : les commentaires ne sont pas affichés dans ce mode (le contenu éditorial seul est projeté). À acter en palier 7 et palier 9."
            - scenario: "Mme Martin signale une erreur factuelle vue en classe"
              reponse: "Possible via D9.4, mais pas en pleine projection. À acter en palier 7."
        questions_levees:
            - "Confirmer en palier 7 que le mode présentation sans chrome masque les commentaires (D9.1) et tout marqueur de signalement éventuel"
            - "À l'inverse, Mme Martin pourrait être un valideur scientifique de fait pour les soumissions concernant son sujet d'enseignement — articuler avec D10.5 si le projet le souhaite, hors scope actuel"

    pere_lyonnais:
        pertinence: "Très élevée — habitant de longue date, connaît son quartier, a des choses à dire et à proposer"
        scenarios_passes:
            - scenario: "Le père lyonnais découvre un pin sur sa rue et veut ajouter une anecdote familiale"
              reponse: "Couvert par D9.1 (commentaire). Compte requis — cohérent avec une contribution responsabilisée."
            - scenario: "Le père connaît un fait historique sur un mur de son quartier qui n'a pas de pin"
              reponse: "Couvert par D9.2 (soumission de pin). Modération avant publication — il sait pourquoi (essence § historicite)."
            - scenario: "Le père tombe sur un commentaire qui révèle l'adresse précise d'une personne"
              reponse: "Couvert par D9.4 (signalement, motif atteinte à la vie privée). Il peut masquer pour lui-même immédiatement et son identité n'est pas exposée."
            - scenario: "Le père ne veut pas que son identité civile apparaisse"
              reponse: "Couvert par D9.1 et D9.2 (pseudonyme et représentation graphique uniquement, jamais identité civile). Pour les soumissions, choix du mode de crédit (anonyme/pseudonyme/attribution explicite)."
        questions_levees:
            - "Le flux de création de compte (D6.5) doit rester ultra-court — sinon le père lyonnais ne contribuera jamais"

    anais_back_office:
        pertinence: "Élevée — Anaïs est l'éditrice de contenu, donc la contrepartie côté back-office des soumissions et des signalements"
        scenarios_passes:
            - scenario: "Une soumission utilisateur arrive dans la file de modération"
              reponse: "Renvoi vers D10.5 (file de modération), où Anaïs (ou le modérateur dédié) traite. Le D9 ne définit pas l'outillage admin."
            - scenario: "Plusieurs signalements convergent sur un même contenu"
              reponse: "Renvoi vers D10.5. D9.4 garantit que les signalements sont tracés et ne se perdent pas — D10.5 les organise en file."
            - scenario: "Un utilisateur signale abusivement un contenu légitime"
              reponse: "Le D9.4 trace le signalement et permet à D10.5 de prendre en compte le pattern. La sanction côté abuseur (avertissement, suspension) est en D10.5."
        questions_levees:
            - "L'articulation D9.4 / D10.5 doit être très propre côté terminologie (motifs de signalement identiques, statuts identiques) — à confirmer lors de la rédaction de D10"
