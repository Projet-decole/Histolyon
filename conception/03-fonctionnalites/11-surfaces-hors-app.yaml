persona_check:
    kenji:
        pertinence: "Très élevée — partage social d'une découverte ou d'une fin de parcours sur Instagram"
        scenarios_passes:
            - scenario: "Partage d'une découverte sur Instagram en 10 secondes, sans comprendre une UI française"
              reponse: "Couvert par D11.5 (partage natif système — UI native qu'il connaît déjà sur son téléphone japonais) et D11.4 (image partageable de fin de parcours, atmosphérique, parle d'elle-même)"
            - scenario: "Préparation à l'hôtel hors-ligne d'un itinéraire reçu d'un ami via lien"
              reponse: "Couvert par D11.1 (lien universel — ouvre l'app si installée) ; mode hors-ligne du contenu géré par D1.1 (canonique) et D3 (parcours)"
            - scenario: "Le partage produit une image jolie et lisible, sans qu'il ait à composer du texte"
              reponse: "Couvert par D11.4 — l'image parle pour elle-même, sobre, atmosphérique"
        questions_levees:
            - "Langues supportées sur la version web (D11.2) — à arbitrer"

    mme_dupont:
        pertinence: "Très élevée — envoi du parcours préparé aux six parents accompagnateurs"
        scenarios_passes:
            - scenario: "Envoi du parcours aux 6 parents via mail/WhatsApp, sans qu'ils créent de compte"
              reponse: "Couvert par D11.1 (lien universel) et D11.2 (version web — destination quand l'app n'est pas installée, sans mur d'inscription)"
            - scenario: "Un parent ouvre le lien le jour J, sans formation, et sait quoi faire en moins de 30 secondes"
              reponse: "Couvert par D11.2 (version web responsive en lecture seule, sobre, ton conteur) ; performance et accessibilité critiques nommées en enjeux"
            - scenario: "Impression d'une feuille pour les parents avec un code à scanner"
              reponse: "Couvert par D11.3 (code visuel imprimable — encode le même lien que D11.1, scan = comportement identique au lien)"
        questions_levees:
            - "Comportement précis du partage d'une image en plus du lien quand on partage un parcours (D11.5) — à arbitrer en palier 6"

    mme_martin:
        pertinence: "Faible à modérée — peu de partage, mais usage potentiel du code visuel pour panneau en classe"
        scenarios_passes:
            - scenario: "Affichage d'un code dans une salle de classe pour que les élèves accèdent à un pin"
              reponse: "Couvert par D11.3 (code visuel imprimable). Le scan amène les élèves sur la version web (D11.2) ou l'app si installée — usage cohérent avec son contexte projection"
            - scenario: "Projection au tableau"
              reponse: "Hors périmètre D11 — relève de D2.5 (mode présentation sans chrome) appliqué à la consultation, pas à une surface hors-app"
        questions_levees: []

    pere_lyonnais:
        pertinence: "Modérée — partage ponctuel d'une découverte qui l'a marqué"
        scenarios_passes:
            - scenario: "Partage d'une anecdote à un ami pour qu'il aille voir aussi"
              reponse: "Couvert par D11.1 (lien universel) et D11.5 (partage natif système). L'ami reçoit le lien, l'ouvre, accède au contenu via l'app ou la version web — sans friction"
            - scenario: "Retrouver une découverte le soir pour la raconter à un ami"
              reponse: "Hors périmètre D11 — relève de D6 (historique). Le partage qui suit éventuellement passe par D11"
