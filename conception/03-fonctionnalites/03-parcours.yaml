    - id: D3.8
      nom: "Partage de parcours"

      raison_d_etre: >-
          Permettre à un utilisateur de partager un parcours créé ou
          découvert — Mme Dupont envoie son parcours aux parents
          accompagnateurs, Kenji partage un parcours qui lui a plu,
          l'office du tourisme imprime un code visuel pour son comptoir.
          Le partage est un nœud de viralité douce (essence : pas de growth
          hack, mais permettre la diffusion organique).

      comportement: >-
          Depuis la fiche parcours (D3.3) ou depuis la vue carte d'un
          parcours actif, un accès 'Partager' déclenche le partage natif
          système (référence D11.5) qui propose : (1) un lien universel
          court envoyable par messagerie ; (2) un code visuel imprimable
          (référence D11.3) — utile pour impression (feuille parents,
          panneau office du tourisme) ; (3) une option de copie du lien.
          Si l'app EST INSTALLÉE chez le destinataire → ouvre directement
          la fiche du parcours dans l'app. Sinon → version web responsive
          (D11.2) en lecture seule avec proposition de téléchargement de
          l'app. Pas de code alphanumérique (essence § ce_qu_on_refuse
          implicite : friction inutile).

      regles_fonctionnelles:
