    - id: D3.7
      nom: "Création de parcours"

      raison_d_etre: >-
          Permettre à un utilisateur (Mme Dupont en tête) de créer son
          propre parcours — pour une sortie scolaire, pour un thème
          personnel, pour partager à la communauté. Le brief précise
          (§ 9.7) que Mme Dupont n'est pas designer : le flux DOIT être
          simple.

      comportement: >-
          L'utilisateur active le point d'accès création (depuis le
          catalogue D3.2 ou un raccourci). Un écran de création s'ouvre
          avec un titre éditable et la carte en fond. Il ajoute des étapes
          de deux manières : (a) sur la carte — il navigue, tap un pin,
          l'aperçu du pin (D2.4) propose un accès à l'ajout au parcours
          en construction ; le pin se numérote automatiquement. (b) Via
          la recherche — un
          champ disponible, des résultats avec accès d'ajout par résultat.
          Il peut RÉORDONNER les étapes par manipulation directe ; la carte
          met à jour l'itinéraire en temps réel. Un accès optionnel
          'Optimiser l'itinéraire' propose de réarranger pour minimiser la
          distance — accepter ou garder l'ordre pédagogique. Des notes
          personnelles par étape ('Pause goûter ici') sont possibles.
          Les MÉTADONNÉES sont AUTO-CALCULÉES (durée, distance, époques)
          — rien à saisir. Sauvegarde automatique en BROUILLON. Choix de
          publier à la communauté (compte requis, cf. D6.5) ou de garder
          privé (parcours personnel).

      regles_fonctionnelles:
          - "Ouverture via le point d'accès création du catalogue (D3.2)"
          - "Écran de création : titre + carte + recherche"
          - "Ajout d'étape par tap sur un pin de la carte (référence D2.4)"
          - "Ajout d'étape par recherche (résultat + accès d'ajout)"
          - "Numérotation automatique au fur et à mesure"
          - "Réordonnancement par manipulation directe ; carte mise à jour en temps réel"
          - "'Optimiser l'itinéraire' : accès optionnel (jamais auto-appliqué)"
          - "Notes personnelles par étape (champ texte court)"
          - "Métadonnées auto-calculées (durée, distance, époques)"
          - "Sauvegarde brouillon automatique"
          - "Publication explicite (compte requis pour publier à la communauté)"
          - "Pas de création de pins custom (uniquement pins existants, cf. brief § 9.7)"
          - "Pas d'édition du contenu des pins"
          - "Pas de transitions narratives custom (réservé aux éditoriaux)"

      capabilites:
          - "Créer un parcours avec un titre"
          - "Ajouter un pin existant comme étape (par carte ou recherche)"
          - "Numéroter automatiquement les étapes"
          - "Réordonner les étapes par manipulation directe"
          - "Optimiser l'ordre des étapes (suggestion non-imposée)"
          - "Ajouter une note personnelle par étape"
          - "Calculer durée, distance, époques traversées automatiquement"
          - "Sauvegarder en brouillon automatiquement"
          - "Publier à la communauté (compte requis)"
          - "Garder privé (parcours personnel)"

      ce_qu_on_ne_fait_pas:
          - "Pas de création de pins custom (utilise uniquement les pins existants)"
          - "Pas d'édition du contenu d'un pin par l'utilisateur"
          - "Pas de transitions narratives custom (réservé aux éditoriaux)"
          - "Pas de paywall ou abonnement pour créer (essence § ce_qu_on_refuse)"
          - "Pas de validation préalable obligatoire pour publier (mais modération a posteriori, cf. D9.4)"

      criteres_de_reussite:
          - "Mme Dupont prépare un parcours du Vieux Lyon en moins de 30 minutes (test_litmus n°1)"
          - "L'ajout d'une étape se fait en peu d'actions"
          - "Le réordonnancement par manipulation directe est fluide et lisible"
          - "Les métadonnées auto-calculées sont fiables"

      definition_of_done:
