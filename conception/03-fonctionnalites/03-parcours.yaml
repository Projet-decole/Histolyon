    # ===========================================================================
    - id: D3.6
      nom: "Mode canapé"

      raison_d_etre: >-
          Le mode canapé n'est PAS un mode dégradé — c'est un usage à part
          entière (essence § ce_qu_on_refuse : 'Le mode canapé comme mode
          dégradé'). Mme Martin en classe, Kenji à l'hôtel, le père qui
          browse le soir : tous méritent le même soin que l'utilisateur
          sur le terrain. Ce sous-domaine décrit comment vivre un parcours
          sans géoloc, avec le contenu intégral et des transitions
          d'époques mises en scène pour le 'wow'.

      comportement: >-
          Si l'utilisateur démarre un parcours sans être à proximité de la
          première étape (détecté via géoloc, ou via choix explicite de
          l'exploration depuis sa position actuelle), l'app bascule
          automatiquement en mode canapé — sans rien demander. Un
          indicateur discret signale le mode exploration dans la présence
          persistante. La navigation devient manuelle : pins numérotés
          sur la carte, accès au passage à l'étape précédente ou suivante
          au lieu de la direction. L'utilisateur
          peut naviguer dans l'ordre qu'il veut. Le contenu reste IDENTIQUE
          — consultation approfondie, audio, quiz, archives. Seule la
          couche de navigation physique (direction, distance, géodéclenchement)
          est retirée. Quand on passe d'une étape à l'autre, les TRANSITIONS
          D'ÉPOQUE sont mises en scène : la carte effectue sa transition
          d'époque visiblement (cf. D1.3) — c'est le 'wow' du mode canapé.
          Le MODE PRÉSENTATION SANS CHROME (référence canonique D2.5) est
          promu particulièrement ici, pour Mme Martin qui projette en classe.

      regles_fonctionnelles:
          - "Bascule automatique en mode canapé si pas à proximité (sans demande à l'utilisateur)"
          - "Indicateur discret signalant le mode exploration dans la présence persistante"
          - "Navigation manuelle : passage à l'étape précédente ou suivante"
          - "Pas de géoloc déclenchée"
          - "Contenu intégral (essence § principe : citoyen de première classe)"
          - "Transitions d'époque mises en scène entre étapes (animation D1.3 visible)"
          - "Mode présentation sans chrome promu (référence D2.5)"
          - "Pas de message signalant un mode dégradé ou la non-présence à Lyon"

      capabilites:
          - "Détecter automatiquement le mode canapé (pas à proximité)"
          - "Présenter l'indicateur du mode exploration"
          - "Permettre la navigation manuelle entre étapes"
          - "Mettre en scène les transitions d'époque"
          - "Activer le mode présentation sans chrome depuis la consultation approfondie"
          - "Maintenir audio, quiz, archives — contenu intégral"

      ce_qu_on_ne_fait_pas:
          - "Pas de message signalant un mode dégradé ou la non-présence à Lyon (essence § ce_qu_on_refuse)"
          - "Pas de fonctionnalités amputées par rapport au mode terrain"
          - "Pas de turn-by-turn (cohérent avec D3.5)"
          - "Pas de bascule manuelle utilisateur (auto-détection prime — éviter friction)"

      criteres_de_reussite:
          - "Mme Martin projette un parcours en classe en mode présentation sans chrome (test_litmus mme_martin n°1 transposé)"
          - "Kenji explore un parcours depuis l'hôtel sans se sentir 'puni'"
          - "Le père lyonnais 'fait' un parcours communautaire le dimanche soir sans bouger — expérience complète"
          - "La transition d'époque entre 2 étapes est ressentie comme un 'voyage' (essence § émerveillement)"

      definition_of_done:
          - "La bascule automatique en mode canapé fonctionne sans friction"
          - "L'indicateur du mode exploration est visible"
          - "La navigation manuelle (précédente / suivante) fonctionne"
          - "Les transitions d'époque sont visibles entre étapes"
          - "Le mode présentation sans chrome est activable et fonctionnel"
          - "Le contenu est identique au mode terrain"

      enjeux_transversaux:
          accessibilite: >-
              Les accès navigation manuelle doivent avoir des cibles
              suffisantes. Le mode présentation sans chrome reste accessible
              aux lecteurs d'écran (cf. D2.5).
          performance: >-
              Les transitions d'époque doivent être fluides — c'est le
              'wow' du mode canapé. Le passage entre étapes doit être perçu
              comme une seule transition.
          vie_privee: "Pas d'enjeu spécifique."

      questions_ouvertes:
          - "Faut-il un mode 'auto-play' du parcours en canapé (avancement auto) ? — recommandation : non par défaut, optionnel"
          - "En classe (Mme Martin) : faut-il un mode 'présentation' avec contrôles visibles uniquement à l'enseignante ? — à arbitrer"

      priorite: "important"

