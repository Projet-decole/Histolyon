    - id: D3.9
      nom: "Fin et célébration"

      raison_d_etre: >-
          Marquer la fin d'un parcours par un MOMENT DE GRATIFICATION qui
          donne envie de raconter, de partager, et éventuellement de
          recommencer. La fin n'est pas une chute brutale — c'est un
          mini-spectacle qui célèbre l'effort et fixe la mémoire (essence
          § émerveillement).

      comportement: >-
          Quand la dernière étape est complétée, un moment de célébration
          en surface dédiée s'affiche avec : (1) une phrase narrative de
          conclusion liée au parcours ; (2) des statistiques — distance
          parcourue, temps passé, étapes complétées, quiz réussis ; (3)
          la trace du trajet effectué avec étapes cochées ; (4) un accès
          au partage qui génère une image partageable (référence D11.4)
          pour les réseaux sociaux ; (5) un badge collectionnable visuel
          lié au parcours, visible sur le profil (D6.6 si activé). Après
          la célébration, le parcours apparaît comme complété dans
          l'espace personnel (D6.2 / D6.3) avec date et statistiques.
          Relançable à tout moment.

