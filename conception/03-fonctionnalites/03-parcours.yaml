    - id: D3.10
      nom: "Edge cases"

      raison_d_etre: >-
          Anticiper les cas atypiques qui se produisent en réalité : l'enfant
          qui fatigue et fait dévier le parcours, la pause forcée, le saut
          d'étape, la classe à 28 téléphones, le parcours qui traverse
          plusieurs époques. Si on ne les pense pas au palier 3, ils
          apparaissent comme bugs en production.

      comportement: >-
          DÉVIATION : pas de recalcul d'itinéraire (pas un GPS). La présence
          persistante continue d'afficher direction et distance. Si
          l'utilisateur s'éloigne nettement du tracé, un message discret
          l'en informe avec un accès au recentrage de la carte. Pas de
          stress.
          PAUSE ET REPRISE : parcours actif persiste en arrière-plan.
          Réouverture de l'app → invitation à reprendre le parcours en
          cours. Progression sauvegardée étape par étape. Une mise en pause
          manuelle désactive le tracking géoloc (économie batterie). Si
          pause prolongée → notification de rappel douce.
          SAUTER UNE ÉTAPE : depuis la liste des étapes (accessible via la
          présence persistante), activation de n'importe quelle étape pour
          y sauter. Étape sautée = état distinct de complétée. Récap final :
          étapes complétées sur total, pas de jugement.
          28 ÉLÈVES SIMULTANÉS : chaque téléphone est indépendant. Un mode
          groupé (déclenchement coordonné par un appareil maître) est
          ENVISAGEABLE plus tard (cf. brief § 9.11) — questionné comme
          ouverture future.
          PARCOURS MULTI-ÉPOQUES : le slider d'époques (D1.2) BOUGE au fil
          des étapes — chaque étape impose son époque. La transition est
          un moment de narration fort. Sur la fiche parcours (D3.3), les
          époques traversées sont listées dans les métadonnées. Un message
          discret indique l'époque imposée par l'étape en cours à chaque
          changement automatique.

      regles_fonctionnelles:
          - "Pas de recalcul d'itinéraire en cas de déviation"
          - "Message discret signalant l'éloignement + accès au recentrage au-delà d'une distance significative du tracé"
          - "Persistance arrière-plan + invitation à reprendre à la réouverture"
          - "Pause manuelle désactive géoloc (batterie)"
          - "Notification de rappel douce après une pause prolongée"
          - "Saut d'étape libre via la liste des étapes"
          - "Récap final sans jugement"
          - "Mode groupé : envisagé pour une évolution future, hors scope actuel"
          - "Slider auto-piloté par l'étape en cours (cf. D1.2 et brief § 9.10)"
          - "Slider non verrouillé (l'utilisateur peut explorer une autre époque manuellement, et le slider revient auto à l'époque de l'étape suivante)"
          - "Message discret indiquant l'époque imposée à chaque transition automatique"

      capabilites:
          - "Détecter une déviation significative du tracé"
          - "Présenter un message discret signalant l'éloignement avec accès au recentrage"
          - "Sauvegarder la progression d'un parcours en arrière-plan"
          - "Proposer une invitation à reprendre à la réouverture"
          - "Envoyer une notification de rappel après une pause prolongée"
          - "Permettre le saut d'étape via la liste"
          - "Différencier visuellement étape complétée / sautée / non vue"
          - "Piloter le slider d'époques selon l'étape en cours"
          - "Présenter un message à chaque transition d'époque automatique"

      ce_qu_on_ne_fait_pas:
          - "Pas de recalcul d'itinéraire (essence § ce_qu_on_refuse — pas un GPS)"
          - "Pas de message agressif ou culpabilisant en cas de déviation"
          - "Pas de mode groupé actuellement"
          - "Pas de blocage du slider d'époques pendant un parcours (l'utilisateur reste libre)"

      criteres_de_reussite:
          - "Mme Dupont voit un enfant fatiguer, dévie pour une pause, l'app ne stresse pas"
          - "Le père lyonnais ferme l'app et la rouvre 2 jours plus tard : reprend où il en était"
          - "Mme Martin saute des étapes en classe sans que l'app la juge"
          - "Le message indiquant l'époque imposée renforce le sentiment de voyage temporel"

      definition_of_done:
          - "La détection de déviation fonctionne"
          - "Le message d'éloignement et l'accès au recentrage fonctionnent"
          - "La persistance du parcours arrière-plan fonctionne"
          - "L'invitation à reprendre à la réouverture fonctionne"
          - "La pause manuelle désactive la géoloc"
          - "La notification après pause prolongée fonctionne"
          - "Le saut d'étape fonctionne (état distinct)"
          - "Le slider est auto-piloté par l'étape en cours"
          - "Le message indiquant l'époque apparaît à chaque changement"

      enjeux_transversaux:
          accessibilite: >-
              Les messages discrets sont lus par lecteurs d'écran. Le
              message 'Reprendre' est navigable au clavier.
          performance: >-
              La détection de déviation ne doit pas trop solliciter la
              batterie (vérification régulière, pas continue).
          vie_privee: >-
              La position est utilisée localement pour la détection de
              déviation. Pas de transmission serveur.

      questions_ouvertes:
          - "Seuil exact de déviation — à valider terrain"
          - "Mode groupé (évolution future) : architecture (un téléphone maître ?) — à anticiper côté palier 4"
          - "Notification de rappel : peut-elle être désactivée par l'utilisateur dans D6.4 ? (recommandation : oui)"

      priorite: "important"

      personas_principaux:
          - mme_dupont
          - mme_martin
          - kenji
          - pere_lyonnais

      dependances:
          - "D3.5 (vivre — base)"
          - "D3.6 (mode canapé)"
          - "D1.2 (slider piloté)"
          - "D4.3 (notifications de proximité en parcours)"

