# =============================================================================
# Palier 3 — Domaine D3 — Parcours
# =============================================================================
# Les parcours offrent un fil narratif structuré là où les pins isolés (D2)
# offrent la sérendipité. Pour Mme Dupont qui prépare une sortie scolaire,
# pour Mme Martin qui projette un cours en classe (mode canapé), pour Kenji
# qui suit un parcours éditorial 'Sur les traces des Canuts', pour le père
# lyonnais qui suit un parcours communautaire dominical — les parcours
# donnent un cap, une intention, une cohérence narrative.
#
# C'est le domaine le plus riche fonctionnellement : 10 sous-domaines qui
# couvrent la totalité du cycle de vie d'un parcours, de sa publication
# jusqu'à sa célébration finale en passant par son lancement, son déroulement
# géolocalisé ou en canapé, et ses nombreux edge cases.
# =============================================================================

document:
    type: palier_fonctionnalites_domaine
    domaine_id: D3
    numero: 3
    audience:
        - "Tout agent qui rédige un palier en aval (4 à 16)"
        - "Devs Flutter (cahier des charges fonctionnel pour les parcours)"
    role: >-
        Décrire fonctionnellement le système de parcours : types, catalogue,
        fiche, lancement, déroulement, mode canapé, création, partage, fin,
        edge cases.
    format: yaml
    prerequis_de_lecture:
        - "design/conception/intention.yaml — § 5.7 et § 11"
        - "design/conception/01-essence.yaml"
        - "design/conception/02-personas.yaml"
        - "design/conception/03-fonctionnalites/00-index.yaml v1.1 — § 2 anti_perimetre_strict OBLIGATOIRE"
        - "design/conception/03-fonctionnalites/01-carte-exploration-temporelle.yaml v1.1 (pilote)"

# -----------------------------------------------------------------------------
# Raison d'être du domaine
# -----------------------------------------------------------------------------
raison_d_etre_du_domaine: >-
    Là où les pins isolés (D2) sont le mode 'flânerie' de l'app, les parcours
    sont le mode 'fil rouge'. Ils ne sont pas au cœur (les piliers de l'essence
    sont la sérendipité géographique, pas l'itinéraire balisé), mais ils sont
    un usage à part entière, particulièrement pour les personas pédagogiques
    (Mme Dupont, Mme Martin) et pour tout utilisateur en quête d'une cohérence
    narrative.

    Ce domaine sert également directement le principe d'émerveillement (un
    parcours bien construit est un voyage, avec une mise en condition, un
    déroulé, une fin) et l'historicité (les parcours éditoriaux portent la
    rigueur scientifique).

# -----------------------------------------------------------------------------
# Sous-domaines
# -----------------------------------------------------------------------------
sous_domaines:
    # ===========================================================================
    - id: D3.1
      nom: "Types de parcours"

      raison_d_etre: >-
          Distinguer trois types de parcours répondant à trois usages clairs :
          (1) éditoriaux signés par l'équipe HistoLyon avec rigueur narrative
          et historique, (2) communautaires créés et publiés par les
          utilisateurs, (3) personnels privés à un utilisateur (créés mais
          non publiés). Cette typologie est la clé du catalogue (D3.2) et
          des règles de publication.

      comportement: >-
          Trois types distincts cohabitent : (1) Parcours éditoriaux —
          conçus par l'équipe / la lead historienne, narrativement riches,
          portent une marque distinctive 'Officiel', démarrent avec un seul
          parcours actuellement ; (2) Parcours communautaires — créés par les
          utilisateurs (D3.7), publiés à la communauté après publication
          explicite par leur auteur (compte requis, cf. D6.5), peuvent
          recevoir des retours (D9.3) ; (3) Parcours personnels — créés
          par l'utilisateur mais NON publiés, restent privés et accessibles
          uniquement à leur auteur dans son espace personnel. Mme Dupont
          l'illustre : elle crée un parcours pour sa sortie, peut le partager
          via lien direct (D11) sans le publier à la communauté.

      regles_fonctionnelles:
          - "3 types : éditorial / communautaire / personnel"
          - "Éditoriaux : marque distinctive officielle visible — actuellement, démarrer avec 1 seul parcours éditorial"
          - "Communautaires : publication explicite par l'auteur, compte requis (D6.5), modération possible (D9.4 + D10.5)"
          - "Personnels : privés, accessibles uniquement à l'auteur dans son espace personnel"
          - "Un parcours communautaire peut être partagé par lien direct (D11) sans être publié à la communauté"
          - "Pas de hiérarchie de qualité automatique (un parcours communautaire bien noté reste communautaire, pas officiel)"

      capabilites:
          - "Distinguer un parcours selon son origine (éditorial / communautaire / personnel)"
          - "Apposer une marque officielle sur les parcours éditoriaux"
          - "Distinguer visuellement chaque type dans le catalogue (D3.2)"
          - "Filtrer le catalogue par type (D3.2)"

      ce_qu_on_ne_fait_pas:
          - "Pas de promotion automatique d'un parcours communautaire en éditorial"
          - "Pas de parcours communautaire visible avant publication explicite par l'auteur"
          - "Pas de parcours personnel visible aux autres utilisateurs"
          - "Pas de plus de 3 types (la typologie reste figée )"

      criteres_de_reussite:
          - "L'utilisateur reconnaît immédiatement un parcours éditorial via sa marque distinctive"
          - "Mme Dupont peut créer un parcours pour sa sortie sans le publier à la communauté"
          - "La rigueur scientifique des éditoriaux (essence § historicité) est garantie par leur statut"

      definition_of_done:
          - "Les 3 types sont supportés"
          - "La marque officielle est appliquée automatiquement aux parcours éditoriaux"
          - "Le filtrage par type fonctionne dans le catalogue"
          - "Un parcours personnel est invisible aux autres utilisateurs"

      enjeux_transversaux:
          accessibilite: >-
              La marque officielle a un label vocal explicite signalant le
              statut officiel (libellé exact en palier 8) pour les lecteurs
              d'écran.
          performance: "Pas d'enjeu spécifique."
          vie_privee: >-
              Un parcours personnel ne doit jamais fuiter (pas d'index public,
              pas de référence dans des résultats de recherche cross-utilisateurs).

      questions_ouvertes:
          - "Un seul parcours éditorial à la livraison ? À confirmer avec la lead/historienne (cf. brief § 9.1)"
          - "Promotion future d'un parcours communautaire en éditorial : quel processus ? (recommandation : décision éditoriale humaine)"

      priorite: "important"

      personas_principaux:
          - mme_dupont
          - mme_martin
          - kenji
          - pere_lyonnais
          - anais_back_office

      dependances: []

    # ===========================================================================
    - id: D3.2
      nom: "Catalogue parcours"

      raison_d_etre: >-
          Donner aux utilisateurs un point d'entrée pour découvrir les
          parcours disponibles, qu'ils soient éditoriaux, communautaires
          ou personnels. C'est la surface Parcours, l'une des trois
          surfaces principales de l'app (Carte / Parcours / Profil) — la
          forme exacte de la navigation entre ces surfaces relève du
          palier 5.

      comportement: >-
          La surface Parcours s'organise en trois zones (cf. brief § 9.2) :
          une zone éditoriale mettant en avant les parcours signés par
          l'équipe, une zone communautaire regroupant les parcours publiés
          par les utilisateurs, et un espace personnel rassemblant les
          parcours créés, sauvegardés, en cours ou terminés. Une bascule
          permet de passer entre l'exploration (zones éditoriale +
          communautaire) et l'espace personnel. Un système de recherche
          et filtres est disponible : type, durée, distance, époque,
          catégorie de pins. Un filtre de proximité est activé par défaut
          si la géoloc est disponible. Un point d'accès permanent à la
          création de parcours est offert (D3.7).

      regles_fonctionnelles:
          - "3 zones : éditoriale / communautaire / espace personnel (via bascule)"
          - "Filtres disponibles : type, durée, distance, époque, catégorie de pins"
          - "Filtre de proximité activé par défaut si géoloc disponible"
          - "Point d'accès permanent à la création (D3.7)"
          - "Distinction visuelle nette éditoriaux vs communautaires"
          - "Évaluation moyenne sur communautaires affichée seulement si l'auteur l'a activée et seuil minimal atteint (cf. D9.3)"

      capabilites:
          - "Présenter les parcours en 3 zones distinctes"
          - "Filtrer par type, durée, distance, époque, catégorie via les filtres"
          - "Trier par proximité géographique si géoloc disponible"
          - "Naviguer vers la fiche parcours (D3.3) à l'activation"
          - "Lancer la création d'un parcours via le point d'accès dédié"
          - "Basculer entre l'exploration et l'espace personnel"

      ce_qu_on_ne_fait_pas:
          - "Pas de mélange éditoriaux et communautaires dans la même zone"
          - "Pas de tri imposé par popularité des communautaires (essence § ce_qu_on_refuse implicite — pas de growth hack)"
          - "Pas de promotion sponsorisée"
          - "Pas de catalogue infini sans filtres (forcer la pertinence)"

      criteres_de_reussite:
          - "Mme Dupont trouve un parcours éditorial sur le Vieux Lyon rapidement"
          - "Le père lyonnais retrouve facilement ses parcours sauvegardés / créés (test_litmus pere_lyonnais)"
          - "La distinction éditoriaux / communautaires est immédiate visuellement"

      definition_of_done:
          - "Les 3 zones (éditoriale, communautaire, espace personnel) s'affichent"
          - "Les filtres fonctionnent (au moins 5 types de filtres)"
          - "Le point d'accès création lance D3.7"
          - "La bascule exploration / espace personnel fonctionne"
          - "Le tri par proximité est actif par défaut quand géoloc disponible"

      enjeux_transversaux:
          accessibilite: >-
              Le catalogue doit être navigable au clavier. Le nombre de
              résultats doit être annoncé par lecteurs d'écran. Les
              distinctions visuelles éditoriaux/communautaires ne doivent
              pas reposer uniquement sur la couleur.
          performance: >-
              Le catalogue doit se charger rapidement à l'ouverture de la
              surface. L'application des filtres doit être perçue comme
              immédiate.
          vie_privee: "Pas d'enjeu spécifique."

      questions_ouvertes:
          - "Politique d'éditorialisation de la zone éditoriale : algorithmique ou manuelle ? (recommandation : manuelle pour l'instant)"

      priorite: "important"

      personas_principaux:
          - mme_dupont
          - kenji
          - pere_lyonnais
          - mme_martin

      dependances:
          - "D3.1 (types de parcours)"
          - "D3.3 (fiche parcours — accessible au tap)"
          - "D3.7 (création — déclenchée par le point d'accès)"
          - "D9.3 (évaluations communautaires — affichage)"

    # ===========================================================================
    - id: D3.3
      nom: "Fiche parcours"

      raison_d_etre: >-
          Donner à l'utilisateur tout ce qu'il faut pour décider de démarrer
          ou non un parcours, en restant dans le ton conteur. La fiche est
          l'écran qui s'ouvre depuis le catalogue (D3.2) et propose le
          contexte, l'intention narrative, les contraintes pratiques (durée,
          distance, étapes) et l'accès au démarrage.

      comportement: >-
          La fiche parcours s'ouvre en surface dédiée depuis le catalogue.
          Elle présente : (1) une mise en condition visuelle d'ouverture
          (image atmosphérique avec titre du parcours et marque officielle
          ou identification visuelle de l'auteur) ; (2) les métadonnées —
          durée estimée à pied, distance, nombre d'étapes, époque(s)
          traversée(s), indication de densité du contenu (3 niveaux,
          libellés exacts en palier 8) ; (3) un teaser narratif court en
          ton conteur ; (4) un aperçu de l'itinéraire avec étapes
          numérotées, agrandissable ; (5) la liste des étapes — numéro,
          nom du lieu, teaser court, activation permettant d'ouvrir
          l'aperçu du pin (D2.4) ; (6) un accès au démarrage qui adapte
          son libellé selon le contexte (3 variantes selon que l'utilisateur
          est à proximité du départ, éloigné, ou en mode canapé — libellés
          exacts en palier 8) ; (7) une zone secondaire — auteur, date,
          nombre de complétions, accès au partage (référence D11.5) et à
          la sauvegarde.

      regles_fonctionnelles:
          - "Présentation en surface dédiée (pas un aperçu superposé)"
          - "Mise en condition visuelle obligatoire (titre + identification de l'auteur ou marque officielle)"
          - "Métadonnées : durée, distance, étapes, époque(s), indication de densité (3 niveaux)"
          - "Teaser narratif obligatoire (court, ton conteur)"
          - "Aperçu de l'itinéraire avec étapes numérotées"
          - "Liste des étapes : activation → aperçu du pin (D2.4)"
          - "Accès au démarrage avec libellé contextuel (3 variantes selon proximité)"
          - "Accès au partage (référence D11.5) et à la sauvegarde dans l'espace personnel (D6.2)"

      capabilites:
          - "Présenter la fiche complète d'un parcours"
          - "Adapter le libellé du démarrage selon la proximité du départ (3 variantes contextuelles)"
          - "Permettre l'aperçu d'une étape sans démarrer (référence D2.4)"
          - "Présenter l'auteur (équipe pour éditorial / utilisateur pour communautaire)"
          - "Permettre le partage (référence D11.5)"
          - "Permettre la sauvegarde dans l'espace personnel (D6.2)"
          - "Permettre l'agrandissement de l'aperçu de l'itinéraire"

      ce_qu_on_ne_fait_pas:
          - "Pas d'ouverture en aperçu superposé (surface dédiée obligatoire)"
          - "Pas de teaser narratif absent (la mise en condition narrative est clé)"
          - "Pas d'accès au démarrage avant que les métadonnées et le teaser soient consultables"
          - "Pas d'indication de difficulté physique (essence § ce_qu_on_refuse — pas de gamification fitness)"

      criteres_de_reussite:
          - "Mme Dupont décide rapidement si le parcours convient à sa classe"
          - "Le teaser narratif donne envie sans tout révéler (essence § émerveillement)"
          - "L'auteur (équipe / communautaire) est immédiatement reconnaissable"

      definition_of_done:
          - "Tous les blocs (1-7) s'affichent et sont fonctionnels"
          - "Le libellé de démarrage adapte son texte selon la proximité"
          - "Les étapes sont consultables en aperçu pin"
          - "L'aperçu de l'itinéraire est agrandissable"
          - "Le partage et la sauvegarde fonctionnent"

      enjeux_transversaux:
          accessibilite: >-
              La fiche est navigable au clavier et lue par lecteurs d'écran.
              Le démarrage doit avoir un focus stable. Les étapes sont
              navigables individuellement.
          performance: >-
              Chargement rapide à l'ouverture. L'aperçu de l'itinéraire ne
              doit pas bloquer le rendu de la fiche.
          vie_privee: "Pas d'enjeu spécifique."

      questions_ouvertes:
          - "Définition opérationnelle de 'à proximité' pour le libellé du démarrage (rayon ?) — palier 7"
          - "Format de l'indication de densité du contenu (icônes ? texte ?) — palier 13"

      priorite: "important"

      personas_principaux:
          - mme_dupont
          - kenji
          - mme_martin
          - pere_lyonnais

      dependances:
          - "D3.2 (catalogue — point d'entrée)"
          - "D2.4 (aperçu pin — accessible via les étapes)"
          - "D3.4 (lancement — déclenché par le démarrage)"
          - "D6.2 (favoris — sauvegarde)"
          - "D9.3 (évaluations communautaires — affichage)"

      comportements_transverses_referenced:
          - "Partage natif système (canonique D11.5) — accès au partage de la fiche"
          - "Géolocalisation (canonique D1.1) — détermine le libellé du démarrage"

    # ===========================================================================
    - id: D3.4
      nom: "Lancement de parcours"

      raison_d_etre: >-
          Faire le pont entre 'décider de faire un parcours' et 'le vivre'.
          Le lancement est un MOMENT D'ÉMERVEILLEMENT — la carte se recadre,
          l'itinéraire apparaît, les pins s'organisent autour du parcours.
          C'est une transition chorégraphiée qui signale à l'utilisateur
          'tu rentres dans une histoire'.

      comportement: >-
          Au démarrage depuis la fiche (D3.3), l'app bascule sur la
          surface Carte — le parcours se vit SUR la carte, pas dans un
          écran séparé. La carte se recadre sur l'ensemble de
          l'itinéraire, puis se rapproche de la première étape. Pendant
          cette transition, l'itinéraire apparaît — une ligne reliant les
          pins dans l'ordre, avec une distinction visuelle entre segments
          parcourus et non parcourus. Les pins HORS parcours sont
          visuellement atténués (cf. D2.1) mais restent cliquables. Les
          pins du parcours sont mis en avant et numérotés. Une présence
          persistante en pied d'écran s'affiche : titre du parcours,
          étape en cours, indication de progression, accès aux contrôles
          (pause, quitter, liste des étapes). Le slider d'époques (D1.2)
          se positionne automatiquement sur l'époque de la première étape.
          Si le démarrage initial était la variante "rejoindre le départ"
          (utilisateur éloigné), l'app ouvre l'application de navigation
          système pour amener l'utilisateur au point de départ.

      regles_fonctionnelles:
          - "Bascule automatique sur la surface Carte au démarrage"
          - "Recadrage de la carte sur l'itinéraire complet, puis approche de l'étape 1"
          - "Itinéraire visible avec distinction parcouru / non parcouru"
          - "Pins hors parcours atténués (cf. D2.1)"
          - "Pins du parcours mis en avant et numérotés"
          - "Présence persistante en pied d'écran avec contrôles du parcours"
          - "Slider d'époques (D1.2) auto-positionné sur l'époque de l'étape 1"
          - "Si variante 'rejoindre le départ' (utilisateur éloigné) : ouverture de l'application de navigation système"

      capabilites:
          - "Basculer sur la surface Carte au démarrage"
          - "Recadrer la carte sur l'itinéraire complet puis sur l'étape 1"
          - "Présenter l'itinéraire avec distinction parcouru / non parcouru"
          - "Modifier la présentation des pins selon parcours actif (cf. D2.1)"
          - "Numéroter les pins du parcours"
          - "Maintenir une présence persistante avec les contrôles du parcours"
          - "Positionner le slider d'époques automatiquement"
          - "Ouvrir l'application de navigation système quand l'utilisateur démarre éloigné"

      ce_qu_on_ne_fait_pas:
          - "Pas d'écran 'Lancement' dédié (la carte est l'écran)"
          - "Pas de turn-by-turn GPS (essence § ce_qu_on_refuse)"
          - "Pas de tutoriel ou de pop-up explicatif au lancement"

      criteres_de_reussite:
          - "Le moment 'Démarrer' produit un effet visuel marquant (essence § émerveillement)"
          - "L'utilisateur comprend immédiatement où il doit aller (étape 1 mise en avant)"
          - "Mme Dupont en sortie scolaire voit immédiatement le tracé"

      definition_of_done:
          - "La bascule sur Carte fonctionne au démarrage"
          - "Le recadrage et l'approche de l'étape 1 fonctionnent"
          - "L'itinéraire est visible et stylisé"
          - "Les pins du parcours sont numérotés, les pins hors parcours sont atténués"
          - "La présence persistante apparaît"
          - "Le slider est auto-positionné"
          - "'S'y rendre' ouvre l'application de navigation système"

      enjeux_transversaux:
          accessibilite: >-
              Le lecteur d'écran annonce le démarrage du parcours. La
              présence persistante est accessible (les contrôles ont des
              labels vocaux).
          performance: >-
              L'animation de lancement doit être fluide. Le recadrage et
              l'approche doivent être perçus comme une seule transition,
              pas comme deux étapes saccadées.
          vie_privee: "Pas d'enjeu spécifique."

      questions_ouvertes:
          - "Faut-il une voix-off de bienvenue lue par l'audio au lancement ? (recommandation : non par défaut)"

      priorite: "important"

      personas_principaux:
          - mme_dupont
          - kenji
          - mme_martin
          - pere_lyonnais

      dependances:
          - "D3.3 (fiche parcours — point de départ)"
          - "D1.1 (carte de base)"
          - "D1.2 (slider — auto-positionné)"
          - "D2.1 (pins — présentation modifiée)"
          - "D3.5 (vivre le parcours — destination)"
          - "D3.6 (mode canapé — variant si pas à Lyon)"

      comportements_transverses_referenced:
          - "Géolocalisation (canonique D1.1)"

    # ===========================================================================
    - id: D3.5
      nom: "Vivre un parcours étape par étape"

      raison_d_etre: >-
          Accompagner l'utilisateur de l'étape 1 à la dernière, sans
          friction et sans turn-by-turn GPS — l'app est un compagnon de
          balade, pas un GPS. Ce sous-domaine décrit ce qui se passe ENTRE
          le lancement (D3.4) et la fin (D3.9) : l'arrivée à une étape, la
          navigation entre étapes, les transitions narratives, l'audio en
          marche, la progression visuelle.

      comportement: >-
          L'utilisateur marche vers la première étape. Quand la géoloc
          détecte son entrée à proximité du pin, un signal discret le
          prévient et la consultation approfondie du pin (D2.5) s'ouvre
          automatiquement. Si la géoloc est imprécise, un déclenchement
          manuel d'arrivée est disponible (le fameux fallback). Un accès
          au passage à l'étape suivante est toujours disponible pour
          sauter une étape. Pour la navigation entre étapes : direction
          et distance simples sont affichées dans la présence persistante
          — pas de turn-by-turn. Le tracé sur la carte fait le reste. Un
          accès au déport vers l'application de navigation système est
          offert si l'utilisateur veut un vrai GPS. Pendant la marche,
          des transitions narratives (texte ou audio court, parcours
          éditoriaux uniquement) peuvent s'afficher pour faire le LIEN
          entre deux étapes. L'audio (D7) peut continuer en arrière-plan
          même quand la consultation est fermée — mains libres. La
          présence persistante affiche la progression (étape courante /
          total) avec une indication de l'étape en cours.

      regles_fonctionnelles:
          - "La géoloc déclenche l'arrivée à proximité du pin"
          - "Signal discret + ouverture automatique de la consultation à l'arrivée"
          - "Déclenchement manuel d'arrivée disponible (fallback en cas de géoloc imprécise)"
          - "Accès au passage à l'étape suivante toujours accessible (saut volontaire)"
          - "Direction et distance simples, pas turn-by-turn (essence § ce_qu_on_refuse)"
          - "Déport vers l'application de navigation système disponible (renvoi externe)"
          - "Transitions narratives entre étapes : parcours éditoriaux uniquement (qualité non garantie pour les communautaires)"
          - "Audio peut continuer en arrière-plan (référence D7.4)"
          - "Présence persistante affiche : titre, étape en cours, progression (courant / total), accès aux contrôles"

      capabilites:
          - "Détecter l'arrivée à une étape via géoloc"
          - "Déclencher signal discret + ouverture de la consultation à l'arrivée"
          - "Permettre le déclenchement manuel d'arrivée (fallback)"
          - "Permettre le saut volontaire vers l'étape suivante"
          - "Présenter direction et distance vers la prochaine étape"
          - "Déporter vers l'application de navigation système pour navigation détaillée"
          - "Présenter des transitions narratives entre étapes (éditoriaux)"
          - "Maintenir la lecture audio en arrière-plan"
