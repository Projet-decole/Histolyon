persona_check:
    kenji:
        pertinence: "Élevée — l'AR est l'argument d'émerveillement le plus fort qu'il rapportera au Japon"
        scenarios_passes:
            - scenario: "Devant un édifice à Lyon, lever son téléphone et voir une reconstitution superposée"
              reponse: "Couvert par D8.3 (superposition AR avec ancrage géographique). Conditionnel à la disponibilité d'un contenu 3D/AR pour ce pin (D8.4). Priorité 'si_le_temps' — on garantit au minimum 1 cas."
            - scenario: "Comprendre la 3D/AR sans tutoriel ni français"
              reponse: "Couvert : le point d'accès D8.1 est conditionnel et visible sur les pins concernés ; la consultation D8.2 a une contextualisation. La compréhension repose sur l'évidence du visuel, pas sur une explication textuelle."
            - scenario: "Permission caméra refusée par défaut sur son terminal d'hôtel"
              reponse: "Couvert par D8.3 : retour propre à la consultation 3D, pas de drame, pas de dégradation perçue (cohérent avec la posture canonique permissions juste-à-temps D5.5)."
        questions_levees:
            - "Quel(s) bâtiment(s) seront prioritaires pour Kenji (Vieux Lyon, Croix-Rousse) ? — arbitrage lead/historienne"

    mme_dupont:
        pertinence: "Modérée — la 3D/AR peut être un moment fort d'une sortie, mais le parcours ne doit jamais en dépendre"
        scenarios_passes:
            - scenario: "Préparer une sortie incluant un pin avec contenu 3D/AR"
              reponse: "Le point d'accès est conditionnel (D8.1) — Mme Dupont sait à l'avance si un pin a de la 3D/AR. Aucune dépendance imposée : si la 3D ne marche pas le jour J (terminal d'un parent incompatible), la sortie tient quand même grâce au contenu textuel/image équivalent (a11y D8.2)."
            - scenario: "Parent accompagnateur dont le terminal n'est pas compatible AR"
              reponse: "Couvert par D8.3 : la bascule AR n'est simplement pas proposée, sans message culpabilisant. Le parent peut consulter en 3D (D8.2) si le terminal supporte la 3D, sinon il consulte le contenu approfondi (D2.5) qui contient l'équivalent."
        questions_levees:
            - "Compatibilité AR sur l'ensemble du parc de smartphones des parents accompagnateurs — à valider"

    mme_martin:
        pertinence: "Élevée — la projection en classe d'une reconstitution 3D est un moment fort du cours d'histoire urbaine"
        scenarios_passes:
            - scenario: "Projeter une reconstitution 3D au tableau pour un cours sur l'évolution urbaine"
              reponse: "Couvert par D8.2 (consultation 3D immersive en mode présentation sans chrome canonique D2.5). La lisibilité depuis le fond de la classe est un critère explicite. La contextualisation (source) reste accessible — crédibilité préservée devant les élèves."
            - scenario: "Expliquer aux élèves que l'AR existe sur le terrain sans pouvoir l'activer en classe"
              reponse: "Couvert : la consultation 3D (D8.2) suffit en mode canapé/classe, l'AR (D8.3) n'est pas nécessaire pour le cours."
            - scenario: "Citer la source de la reconstitution devant les élèves"
              reponse: "Couvert par D8.2 (contextualisation accessible pendant la consultation) et D8.4 (production avec sources renseignées et validées)."
        questions_levees:
            - "Niveau de fidélité visuelle nécessaire pour ne pas paraître 'gadget' devant des collégiens — à arbitrer avec le dev 3D/VR"

    pere_lyonnais:
        pertinence: "Élevée — l'AR sur sa rue produit l'effet de révélation 'voilà ce qui était là' qui est exactement son moteur (cf. citation persona)"
        scenarios_passes:
            - scenario: "Découvrir par hasard qu'un pin de son quartier propose l'AR"
              reponse: "Couvert par D8.1 (point d'accès conditionnel — son apparition est en soi un signal). Cohérent avec le principe de sérendipité (essence § principe sérendipité)."
            - scenario: "Lever son téléphone devant un mur familier et voir ce qui s'y trouvait"
              reponse: "Couvert par D8.3 (superposition AR avec ancrage géographique sur place)."
            - scenario: "Activer l'AR sans avoir préparé quoi que ce soit"
              reponse: "Couvert : zéro préparation nécessaire, permission caméra demandée juste-à-temps."
        questions_levees: []

    anais_back_office:
        pertinence: "Élevée sur D8.4 (production des reconstitutions) — c'est elle qui orchestre l'attachement contenu/pin/sources"
        scenarios_passes:
            - scenario: "Attacher un modèle 3D produit par le dev 3D/VR à un pin existant, avec sources et époque"
              reponse: "Couvert par D8.4 (capabilités de production). Détail du workflow d'attachement à articuler avec D10."
            - scenario: "Soumettre la reconstitution à validation scientifique"
              reponse: "Couvert par D8.4 (validation préalable obligatoire avant disponibilité grand public). Workflow exact défini en D10."
        questions_levees:
            - "Validation scientifique d'un modèle 3D : critères ad-hoc ou mêmes que pour un texte ? — à acter avec la lead/historienne"
