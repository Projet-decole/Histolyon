statut_phase_3:
  date_lancement: "2026-05-07"
  sous_agents_planifies: 5
  repartition:
    A: "categories/ (11 SVG)"
    B: "categories/14/ (11 SVG XS dédiés stroke 2)"
    C: "ui/ partie 1 (15 SVG : navigation + audio + saisie + états + actions)"
    D: "ui/ partie 2 (14 SVG : check + sections + réseau + liens + cartographie + modes)"
