internationalisation:

  - id: ICON-UI-LANGUE
    nom_palier_13: "selecteur_langue"
    source: "lucide:languages"
    statut: "NON UTILISÉE — application mono-langue (palier 8 06-i18n). Conservée dans le système au cas où une sélection de langue serait introduite plus tard ; aucun écran ne la consomme actuellement."
    metaphore: "Deux glyphes superposés évoquant deux systèmes d'écriture — convention universelle pour la sélection de langue."
    slot_palier_10: []
    variants: { tailles: [MD, LG], etats: [default, pressed] }
    mapping_couleurs:
