  total_composants_figma_reutilisables: 116

# -----------------------------------------------------------------------------
# 7. Format de fiche enrichi
# -----------------------------------------------------------------------------
format_des_fiches:

  champs_obligatoires:
    - id                          # snake_case, préfixe comp-
    - nom
    - famille                     # atome | molecule | fonctionnel | shell | back-office
    - raison_d_etre
    - ancrage                     # ecrans + composants_qui_l_integrent
    - composition                 # composants enfants avec slots nommés et cardinalité, [] si atome pur

  champs_obligatoires_si_interactif:
    - intention_portee            # close/ouverte, échelle E1-E4, cible référencée
    - etats_interactifs           # default, pressed, focused, disabled, expanded, collapsed, selected, etc.
    - interactions_natives        # gestes acceptés et signaux émis

  champs_recommandes:
    - variants                    # variants visuels (provenance, taille, etc.)
    - consequences_variabilite    # truncate / adaptatif / placeholder
    - couplage_etat_partage       # producteur / consommateur de quel état (référence § 4)
    - patterns_attaches           # patterns d'interaction depuis § 5
    - machine_etats               # pour composants à comportement riche (5-7 cas)
    - dependances_palier_amont    # mappings P9, modes P5, entités P4, patterns P8
    - questions_ouvertes
    - anti_perimetre_specifique

  exemple_canonique_intention_close:
    code: |
      - id: comp-button-back
        nom: "Bouton retour"
        famille: atome
        raison_d_etre: "Cible navigationnelle de retour gracieux (P5.N1) présente sur tout écran de niveau 2 ou 3."

        ancrage:
          ecrans: ["la quasi-totalité des écrans M3", "écrans M6 ponctuelles", "templates M8"]
          composants_qui_l_integrent: ["comp-header-titre-action (variant avec retour)"]

        composition:
          - id: comp-icone
            slot: "icone"
            cardinalite: 1
            note: "icône fonctionnelle de retour ; concrète au palier 13"

        intention_portee:
          parametrable: false
          echelle: E3_navigationnelle
          intention: "retour_gracieux"
          cible_referencee: "P5.N1 — un seul geste vers le niveau immédiatement supérieur"
          cas_deep_link: "Si l'écran a été atteint via Lien universel sans pile constituée, le retour mène à la surface principale logique de la cible (cf. P5.E2). Précision IMPORTANTE — sans elle, les devs feront faux."
          note: >-
            Composant à INTENTION CLOSE — non surchargeable. L'écran qui
            l'instancie n'a pas à câbler son comportement. Si un cas
            métier nécessite une autre cible, utiliser comp-button-tertiary
            avec onPressed exposé (intention ouverte).

        etats_interactifs:
          - default: "état de repos"
          - pressed: "tap en cours"
          - disabled: "non interactif (rare — typiquement quand pas de niveau supérieur)"
          - focused: "focus clavier/lecteur d'écran (a11y)"

        interactions_natives:
          - "Tap → déclenche le retour gracieux (intention close)"

        consequences_variabilite:
          - "Pas de texte variable (icône uniquement)"

        questions_ouvertes:
          - "Variant 'retour avec libellé' (ex. 'Retour' visible) pour certains contextes a11y ? — palier 13 et palier 16."

  exemple_canonique_intention_ouverte:
    code: |
      - id: comp-button-primary
        nom: "Bouton primaire"
        famille: atome
        raison_d_etre: "Cible d'action principale dans toute surface, affirmée visuellement."

        ancrage:
          ecrans: [E-CARTE-RECHERCHE, E-PARCOURS-LANCEMENT, E-PROFIL-CREATION-COMPTE, ...]
          composants_qui_l_integrent: [comp-dialogue-confirmation, comp-dialogue-permission, comp-message-ephemere, ...]

        composition:
          - id: comp-libelle-bouton
            slot: "label"
            cardinalite: 1
          - id: comp-icone
            slot: "icone"
            cardinalite: 0..1
            note: "icône optionnelle"

        intention_portee:
          parametrable: true
          echelle: variable   # E2 / E3 / E4 selon contexte
          intention: "action_principale"
          contrats:
            - "L'écran qui l'intègre DOIT définir la cible (flow palier 6 ou intention P5)"
            - "Voir elements_interactifs des écrans palier 7 pour les câblages concrets"
          note: "Composant à INTENTION OUVERTE — câblage par le parent."

        etats_interactifs:
          - default
          - pressed
          - disabled
          - loading: "action en cours (pendant un appel asynchrone)"
          - focused

        interactions_natives:
          - "Tap → émet signal d'action (callback parent)"

        variants:
          - dimension: taille
            valeurs: [standard, compact]
          - dimension: pleine_largeur
            valeurs: [oui, non]

        consequences_variabilite:
          - "Texte variable → truncate avec ellipse à partir d'un seuil (palier 12)"
          - "i18n : longueurs FR / EN / JA divergent ; vérifier perceptibilité de l'intention en palier 16"

  consigne_intention_portee: |
    Champ OBLIGATOIRE pour tout composant interactif. Trois sous-cas :

    (a) Intention CLOSE (ex. button-back, selecteur-section, alerte-proximite) :
        parametrable: false
        echelle: E1 | E2 | E3 | E4
        intention: <nom court de l'intention>
        cible_referencee: <référence palier 5 (N/M/S) ou palier 6 (flow)>
        + note explicative

    (b) Intention OUVERTE (ex. button-primary, button-tertiary) :
        parametrable: true
        echelle: variable (selon usage par l'écran)
        intention: <nom de la classe d'intention, ex. action_principale>
        contrats: liste des contrats que l'écran appelant doit respecter

    (c) Composant non-interactif (libellé, séparateur) :
        intention_portee: { non_interactif: true }

  consigne_couplage_etat_partage: |
    Pour les composants à échelle E4 (système), déclarer explicitement :
      couplage_etat_partage:
        - etat: ETAT-EPOQUE-COURANTE
          role: producteur | consommateur | les_deux
          note: "..."

    Référencer un état listé en § 4. Si manquant, l'ajouter en § 4
    avec validation utilisateur.

  consigne_machine_etats: |
    Pour les 5-7 composants à comportement riche (slider, viewers,
    lecteurs, formulaires complexes), section dédiée :
      machine_etats:
        etats: [...]
        transitions:
          - de: <etat>
            vers: <etat>
            sur: <evenement>
            condition: <optionnelle>

    Pour les composants simples (atomes interactifs typiques), la liste
    plate des etats_interactifs suffit — pas de machine_etats.

  consigne_slots: |
    Le champ composition utilise des SLOTS NOMMÉS pour les composants
    qui en ont besoin (molécules, shell, back-office) :
      composition:
        - id: comp-libelle-texte
          slot: "titre"
          cardinalite: 1
          note: "variante 'titre' (cf. dimension variante_semantique de comp-libelle-texte en 01-atomes)"
        - id: comp-button-primary
          slot: "issue_confirmation"
          cardinalite: 1
        - id: comp-button-secondary
          slot: "issue_annulation"
          cardinalite: 1

    Pour les atomes purs : composition: []

  vocabulaire_a_eviter:
    - "valeurs en pixels, hex, ms, % avec valeur"
    - "noms de widgets Flutter (TextButton, Container, etc.)"
    - "noms d'icônes concrètes (heart, share, etc.)"
    - "courbes d'animation (ease-out, spring)"
    - "microcopy exacte entre guillemets"

  vocabulaire_admis:
    - "qualifié : 'cible tactile généreuse', 'arrondi modéré'"
    - "fonctionnel : 'tap', 'long-press', 'drag', 'focus'"
    - "directionnel : 'plus grand que', 'priorité supérieure'"
    - "sémantique d'interaction : 'intention close', 'cible navigationnelle', 'producteur d'état'"

# -----------------------------------------------------------------------------
# 8. Conventions de référencement
# -----------------------------------------------------------------------------
conventions:
  ecrans: "Référence par id E-XXX-YYY (palier 7)"
  modes_et_surfaces: "Préfixe P5. (P5.M1-M9, P5.S1-S3, P5.P1-P3, P5.N1-N7, P5.C1-C6, P5.E1-E3) — convention canonique des paliers 6, 7, 9"
  flows: "Référence par id court (A1, B2, C5, D6, E1, F5, G3, H1) — palier 6"
  entites: "Nom métier (Pin, Parcours, Étape, Profil, Compte, Trace de modération…) — palier 4"
  invariants: "Format Ix (I1-I10) — palier 4"
  mappings_palier_9: "Référence au fichier (09-cartographie/02-pins.yaml dimension provenance) ou à la décision (palier 9 décision D3)"
  echelles_d_interaction: "Format Ex (E1-E5) — § 3 ci-dessus"
  etats_partages: "Format ETAT-XXX (§ 4)"
  patterns_d_interaction: "Format PI-XXX (§ 5)"

# -----------------------------------------------------------------------------
# 9. Composants pivots
# -----------------------------------------------------------------------------
# Liste effective des pivots auto-identifiés par les fiches d'atomes
# (chacun annonçant explicitement « Pivot du palier 10 » dans sa raison_d_etre).
composants_pivots:
  - id: comp-button-primary
    note: "≥8 intégrations recensées dans les 48 écrans palier 7 et dans plusieurs molécules/dialogues"
  - id: comp-libelle-texte
    note: "≥40 intégrations — toute composition contient du texte (titres, corps, métadonnées, captions)"
  - id: comp-icone
    note: "≥30 intégrations — utilisée par la quasi-totalité des composants atomes interactifs et plusieurs fonctionnels"
  - id: comp-libelle-bouton
    note: "transverse — utilisé par tous les boutons textuels (primary, secondary, tertiary, fab)"
  - id: comp-chip-categorie
    note: "≥10 intégrations — cards, items de liste, fiches Pin et Parcours, formulaire de saisie"

# -----------------------------------------------------------------------------
# 10. Décisions structurelles prises
# -----------------------------------------------------------------------------
decisions_structurelles_prises:

  - id: D1
    decision: "Découpage en 5 fichiers (atomes, molécules, fonctionnels, shell, back-office)"
    pourquoi: "Structure naturelle par nature du composant (atome/molécule/fonctionnel/shell/back-office)."

  - id: D2
    decision: "Composants polymorphes vs spécifiques — décidé AU CAS PAR CAS dans les fiches"
    pourquoi: "Pas de règle universelle. Justification à tracer par fiche."

  - id: D3
    decision: "Distinction badge / étiquette de statut / indicateur de chargement CONSERVÉE"
    pourquoi: "Sémantiques disjointes."

  - id: D4
    decision: "Composants Pin et Tracé : composant unique avec PROPS ORTHOGONALES (provenance × multi-époque × vérification × contexte parcours × déjà visité)"
    pourquoi: "Réification directe de la posture B palier 9."

  - id: D5
    decision: "INTERACTIONS portées par les composants explicitement listées au palier 10"
    pourquoi: "Insistance utilisateur 2026-05-06."

  - id: D6
    decision: "Champ consequences_variabilite OBLIGATOIRE pour tout composant à contenu variable"
    pourquoi: "Insistance utilisateur 2026-05-06."

  - id: D7
    decision: "SÉMANTIQUE D'INTERACTION élevée au palier 10 (intention close vs ouverte, échelle E1-E4)"
    pourquoi: >-
      Le bouton retour FAIT pop par nature ; la navbar SWITCH par nature.
      Cette sémantique appartient au composant, pas à un palier 11 réduit
      au timing.

  - id: D8
    decision: "Palier 11 RECADRÉ en 'réponse temporelle aux changements d'état'"
    pourquoi: >-
      L'ancienne formulation 'interactions et motion' mélangeait gestes
      primitifs, micro-motion, chorégraphies, liaisons paramétriques.
      Le palier 11 se restreint au timing. cf. intention.yaml.

  - id: D9
    decision: "Inventaire de l'ÉTAT APPLICATIF PARTAGÉ dans le palier 10 (§ 4)"
    pourquoi: >-
      Slider d'Époque, Parcours en cours, audio, Compte, etc. — états
      transversaux qui pilotent plusieurs composants à distance.
      Sans inventaire, les devs Flutter improvisent un state-management
      qui ne ressemble à rien à la conception.

  - id: D10
    decision: "TYPOLOGIE 5 ÉCHELLES E1-E5 inscrite dans l'index palier 10 (§ 3)"
    pourquoi: >-
      Cadre commun obligatoire pour toute interaction. Conditionne
      l'architecture Flutter (Listener interne / Navigator / state
      manager global)."

# -----------------------------------------------------------------------------
# 11. Persona check global
# -----------------------------------------------------------------------------
persona_check_global:

  kenji:
    impact: "élevé"
    note: "Composants i18n-aware (texte variable JA / FR / EN). Conséquences variabilité critiques. Intention close de comp-selecteur-section-principale doit fonctionner sans tutoriel."

  mme_dupont:
    impact: "moyen"
    note: "Composants Parcours doivent permettre de créer en moins de 30 minutes. Lien universel reçu via E-PARCOURS-FICHE-DETAIL atterrit sans Compte (intention close E3 préservée)."

  mme_martin:
    impact: "élevé"
    note: "Mode présentation (M4) : composants persistants P1/P2/P3 ont un état 'minimized' (sommeil visuel). Lisibilité de tous les composants depuis le fond de classe."

  pere_lyonnais:
    impact: "élevé"
    note: "comp-alerte-proximite (M7), comp-message-ephemere, comp-controle-favori sont sa surface principale. Intention close de comp-button-back garantit sa navigation intuitive."

  anais_back_office:
    impact: "MAJEUR"
    note: "Tout 05-back-office.yaml. Formulaire saisie Pin = composant à machine d'état riche. Intention close (validation, soumission, retrait, promotion). Drapeaux rouges persona (templates rigides, pas de prévisualisation, pas de versioning) à adresser."
