  - id: comp-formulaire-saisie-pin
    nom: "Formulaire de soumission Pin (communautaire)"
    famille: fonctionnel
    raison_d_etre: "Saisie d'un Pin de provenance communautaire (palier 6 flow G4). Composant unique avec sections internes (titre, catégorie, époque, localisation, narration, sources, médias). Évaluation : split NON recommandé (pas d'ancrage palier 7 pour les sous-composants isolés, validation cross-fields forte)."
    ancrage: { ecrans: [E-COMMUNAUTE-SOUMISSION-PIN] }
    composition:
