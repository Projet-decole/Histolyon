  # sous-typologie des éléments interactifs. Déjà matérialisés en maquette palier 5.

  - id: comp-enigme
    nom: "Énigme"
    famille: fonctionnel
    raison_d_etre: >-
      Sous-type post-narratif (08-contenu/02-template-pin.yaml id 'enigme') : défi
      de lecture attentive ou d'observation du lieu réel. L'énigme RACONTE — elle ne
      pose pas un QCM et n'affiche pas de score ; énoncé qui pointe quelque chose à
      chercher + révélation différée à la demande. Anti-gamification stricte.
    ancrage:
      ecrans: [E-PIN-CONSULTATION-APPROFONDIE (zone post-narrative)]
      composants_qui_l_integrent: [comp-zone-post-narrative]
    composition:
      - { id: comp-libelle-texte, slot: enonce, cardinalite: 1 }
      - { id: comp-libelle-texte, slot: reponse, cardinalite: 1, note: "révélée à la demande" }
      - { id: comp-button-tertiary, slot: reveal, cardinalite: 1, note: "Dévoiler ↔ Replier" }
    etats_interactifs: [posee, devoilee]
    interactions_natives:
      - "Tap reveal → bascule posee↔devoilee (révélation narrative, ni validation ni score)"
    intention_portee:
      parametrable: false
      echelle: E1_atomique
      intention: "reveler_reponse"
      note: "Intention CLOSE — la révélation est interne au composant."
    consequences_variabilite:
      - "Longueur de l'énoncé variable (phrase à paragraphe) ; i18n FR/EN/JA"
    anti_perimetre_specifique:
      - "Pas de badge/niveau/score (anti-pattern Duolingo, cf. 08-contenu post_narratif)"

  - id: comp-citation
    nom: "Citation historique"
    famille: fonctionnel
    raison_d_etre: >-
      Sous-type post-narratif (08-contenu/02-template-pin.yaml id
      'citation_historique') : archive ou témoignage qui prolonge le récit dans un
      registre d'époque — introduction sobre du conteur + citation entre guillemets
      + crédit court. Bloc statique (sources visibles, P6 historicité).
    ancrage:
      ecrans: [E-PIN-CONSULTATION-APPROFONDIE (zone narration ou post-narrative)]
      composants_qui_l_integrent: [comp-zone-narration, comp-zone-post-narrative]
    composition:
