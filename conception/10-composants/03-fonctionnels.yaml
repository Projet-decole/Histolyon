  - id: comp-formulaire-connexion-compte
    nom: "Formulaire connexion Compte"
    famille: fonctionnel
    raison_d_etre: "Connexion à un Compte existant. Producteur de ETAT-COMPTE-CONNECTE."
    ancrage: { ecrans: [E-PROFIL-CONNEXION-COMPTE] }
    composition:
      - { id: comp-champ-saisie-texte, slot: identifiant, cardinalite: 1 }
