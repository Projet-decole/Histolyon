      - { id: comp-libelle-texte, slot: citation, cardinalite: 1, note: "texte cité entre guillemets" }
      - { id: comp-libelle-texte, slot: attribution, cardinalite: 1, note: "crédit + date + source" }
    intention_portee: { non_interactif: true }
    consequences_variabilite:
      - "Longueur de la citation variable (haïku à paragraphe) ; crédit obligatoire"

  - id: comp-saviez-vous
    nom: "Le saviez-vous"
    famille: fonctionnel
    raison_d_etre: >-
      Sous-type post-narratif (08-contenu/02-template-pin.yaml id 'le_saviez_vous') :
      fait annexe qui prolonge le récit — anecdote, détail, écho contemporain.
      Ouverture marquée (« Le saviez-vous ») + fait + résonance. PROLONGEMENT (ajoute,
      ne répète pas). Bloc statique.
    ancrage:
