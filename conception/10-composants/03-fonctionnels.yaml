  # ---------------------------------------------------------------------------
  # Contenus complexes — cascade depuis palier 5 maquette (2026-06-25)
  # ---------------------------------------------------------------------------
  # Componentisation de 4 blocs de contenu complexe : 3 sous-types post-narratifs
  # définis au palier 8 (08-contenu/02-template-pin.yaml) + le puzzle issu de la
  # vision (01-essence) et de l'entité Média (04-donnees/01-contenu.yaml). Cette
