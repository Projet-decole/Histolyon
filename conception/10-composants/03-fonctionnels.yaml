# -----------------------------------------------------------------------------
# 2. Machines d'état détaillées (7 composants riches)
# -----------------------------------------------------------------------------
# Pour chaque composant à machine d'état riche, états + transitions +
# événements déclencheurs. Référencé depuis chaque fiche par "voir § 2".
machines_etats:

  comp-pin:
    note: >-
      Le Pin n'a pas une machine d'état au sens transitions séquentielles —
      il a une MATRICE de variants orthogonaux. Représentation par contraintes
      invariantielles plutôt que par diagramme classique.
    matrice_variants:
      provenance: [editorial, communautaire]
      multi_epoques: [simple, empile]
      statut_verification: [absent, en_cours]
      contexte_parcours: [normal, etape_courante, etape_complete, etape_future, hors_parcours]
      deja_visite: [non, oui]
    contraintes_invariantielles:
      - { id: I3, regle: "provenance=editorial → statut_verification=absent (toujours)" }
      - { id: I8, regle: "multi_epoques admis sans restriction" }
      - { id: I9, regle: "Pin sans coordonnées géographiques → invisible Carte" }
      - { id: PR1, regle: "(etape_courante ET deja_visite) → mise en relief prime sur atténuation" }
      - { id: PR2, regle: "(hors_parcours ET deja_visite) → cumul des deux modulations" }
    transitions_etat_d_interaction:
      - { de: default, vers: pressed, sur: tap_press }
      - { de: pressed, vers: selected, sur: tap_release }
      - { de: selected, vers: default, sur: tap_hors_ou_navigation_externe }

  comp-slider-epoque:
    etats: [repos, dragging, snapping, pilote_automatique]
    transitions:
      - { de: repos, vers: dragging, sur: pointer_down_handle }
      - { de: dragging, vers: snapping, sur: pointer_up }
      - { de: snapping, vers: repos, sur: snap_complete, condition: "Époque ancrée la plus proche atteinte" }
      - { de: repos, vers: pilote_automatique, sur: parcours_actif_emet_pilotage, condition: "ETAT-PARCOURS-EN-COURS impose une Époque cible" }
      - { de: pilote_automatique, vers: dragging, sur: pointer_down_handle, note: "interaction utilisateur prime sur pilotage automatique (à confirmer palier 11)" }
    evenements_emis:
      - { evenement: drag_continue, charge: "position interpolée 0.0–1.0", consommateur: "ETAT-EPOQUE-COURANTE (mise à jour continue, cascade fond carte palier 9 D8)" }
      - { evenement: snap_complete, charge: "Époque ancrée finale", consommateur: "ETAT-EPOQUE-COURANTE + recharge Pins (palier 3 D1.2)" }

  comp-carte:
    etats: [nominal, panning, zooming, loading_tuiles, offline_avec_cache, offline_sans_cache, geoloc_cursor_actif, pin_selected]
    transitions:
      - { de: nominal, vers: panning, sur: pan_drag_start }
      - { de: panning, vers: nominal, sur: pan_drag_end }
      - { de: nominal, vers: zooming, sur: pinch_zoom }
      - { de: zooming, vers: nominal, sur: pinch_release }
      - { de: nominal, vers: loading_tuiles, sur: pan_zoom_atteint_zone_non_chargee }
      - { de: loading_tuiles, vers: nominal, sur: tuiles_recues }
      - { de: '*', vers: offline_avec_cache, sur: ETAT-CONNEXION-RESEAU_perdu, condition: "tuiles préchargées disponibles" }
      - { de: '*', vers: offline_sans_cache, sur: ETAT-CONNEXION-RESEAU_perdu, condition: "pas de tuiles préchargées" }
      - { de: nominal, vers: pin_selected, sur: tap_pin }
    evenements_emis:
      - { evenement: pin_selected, consommateur: "écran parent, ouvre B1 aperçu" }
    cascades_consommees:
      - { source: ETAT-EPOQUE-COURANTE, effet: "interpolation continue des 5 axes paramétriques (palier 9 01-fond-et-epoques)" }
      - { source: ETAT-PARCOURS-EN-COURS, effet: "affichage tracé + étape courante en relief" }

  comp-lecteur-audio:
    etats: [buffering, playing, paused, ended, error, seeking]
    transitions:
      - { de: buffering, vers: playing, sur: audio_pret_et_tap_play }
      - { de: buffering, vers: error, sur: telechargement_echec }
      - { de: playing, vers: paused, sur: tap_pause }
      - { de: paused, vers: playing, sur: tap_play }
      - { de: 'playing|paused', vers: seeking, sur: drag_timeline }
      - { de: seeking, vers: playing, sur: relachement_timeline }
      - { de: 'playing|seeking', vers: ended, sur: fin_naturelle_audio }
    evenements_emis:
      - { evenement: play_demarre, consommateur: "ETAT-AUDIO-EN-COURS (producteur)" }
      - { evenement: ended, consommateur: "ETAT-AUDIO-EN-COURS (libère état)" }

  comp-formulaire-saisie-pin:
    etats: [empty, partial_draft, full_draft, validating, submitting, submitted, error, offline_queued]
    transitions:
      - { de: empty, vers: partial_draft, sur: premier_champ_renseigne }
      - { de: partial_draft, vers: full_draft, sur: tous_champs_requis_renseignes }
      - { de: full_draft, vers: partial_draft, sur: champ_efface_revient_invalide }
      - { de: full_draft, vers: validating, sur: tap_cta_soumettre, condition: "validation locale OK" }
      - { de: validating, vers: submitting, sur: validation_serveur_OK }
      - { de: submitting, vers: submitted, sur: api_accepte_creation }
      - { de: '*', vers: error, sur: validation_locale_KO_ou_serveur_rejette_ou_timeout }
      - { de: '*', vers: offline_queued, sur: ETAT-CONNEXION-RESEAU_perdu_pendant_soumission }
    invariants:
      - "Brouillon préservé localement à toutes étapes — l'utilisateur ne perd jamais sa saisie"
    note: >-
      Verdict : split en sous-composants (saisie-meta, saisie-narration,
      saisie-medias, saisie-sources) NON recommandé actuellement car validation
      cross-fields forte, machine d'état unitaire, pas d'ancrage palier 7
      pour les sous-composants isolés. Ré-évaluable plus tard si admin renforcé.

  comp-recherche-surface:
    etats: [empty, typing, querying, results_loaded, no_results, error, offline_local]
    transitions:
      - { de: empty, vers: typing, sur: focus_clavier_et_saisie }
      - { de: typing, vers: querying, sur: debounce_ecoule }
      - { de: querying, vers: results_loaded, sur: api_retour_OK_avec_resultats }
      - { de: querying, vers: no_results, sur: api_retour_OK_sans_resultats }
      - { de: querying, vers: error, sur: timeout_ou_erreur_serveur }
      - { de: '*', vers: offline_local, sur: ETAT-CONNEXION-RESEAU_perdu, note: "recherche dégradée sur cache local" }
      - { de: 'results_loaded|no_results', vers: typing, sur: continue_saisie }
    note: "Le debounce (durée précise) est au palier 11."

  comp-quiz:
    etats: [unanswered, answering, answered, feedback_revealed, hint_shown, completed, error]
    transitions:
      - { de: unanswered, vers: answering, sur: tap_reponse_candidate }
      - { de: answering, vers: answered, sur: tap_valider }
      - { de: answered, vers: feedback_revealed, sur: revelation_serveur_ou_locale }
      - { de: '*', vers: hint_shown, sur: tap_hint_optionnel }
      - { de: feedback_revealed, vers: completed, sur: derniere_question }
      - { de: feedback_revealed, vers: unanswered, sur: question_suivante, note: "boucle si plusieurs questions" }
