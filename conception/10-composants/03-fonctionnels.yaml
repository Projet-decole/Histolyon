# =============================================================================
# Palier 10 — Composants fonctionnels (PILOTE)
# =============================================================================
# Composants qui réifient un concept métier (palier 9 grammaire visuelle,
# palier 4 entités) ou portent une machine d'état d'interaction. Distincts
# des atomes (briques DRY pures), des molécules (combinaisons d'atomes),
# des shell (templates de mode), et des back-office (composants admin).
#
# PILOTE — calibre le format pour 01-atomes, 02-molecules, 04-shell,
# 05-back-office.
# =============================================================================

document:
  type: palier_composants_fonctionnels
  numero: 10
  fichier: "03-fonctionnels.yaml"
  version: "0.1"
  date: "2026-05-06"
  format: yaml
  pilote: true
  prerequis_de_lecture:
    - "design/conception/10-composants/00-index.yaml v0.2 — § 3 échelles E1-E5, § 4 état partagé, § 5 patterns, § 7 format de fiche"
    - "design/conception/09-cartographie/ — mappings réifiés ici (Pin, Tracé, Cluster, Carte, Slider d'Époque)"
    - "design/conception/05-architecture-info.yaml — modes M1-M9, surfaces persistantes P1-P3"

raison_d_etre: >-
  Les composants fonctionnels portent la matière interactive vivante
  d'HistoLyon : la Carte qui interpole, le Pin qui combine 5 dimensions
  orthogonales, le Slider d'Époque producteur d'état partagé, le Lecteur
  audio qui enclenche P1, les formulaires producteurs de Compte ou de
  contributions communautaires. C'est ICI que le palier 9 (cartographie)
  se réifie en composants nommés. C'est aussi ici que vivent les 6 machines
  d'état + 1 matrice variants (comp-pin) détaillées du palier 10 (cf. § 2).
  Le Pin a une matrice de variants orthogonaux à 5 dimensions, pas une
  machine d'état séquentielle classique.

# -----------------------------------------------------------------------------
# 1. Composants fonctionnels — fiches
# -----------------------------------------------------------------------------
# 24 composants fonctionnels (20 d'origine + 4 cascade palier 5 maquette
# 2026-06-25 : comp-enigme, comp-citation, comp-saviez-vous, comp-puzzle).
# Format compact pour la majorité ; les 6 machines d'état + 1 matrice variants
# (comp-pin) ont leur section machine_etats détaillée en § 2.
# Atomes/molécules intégrés référencés par id (résolus en 01/02 par rédacteurs).
composants:

  # ---------------------------------------------------------------------------
  # FICHE EXEMPLAIRE COMPLÈTE — modèle pour les rédacteurs
  # ---------------------------------------------------------------------------
  - id: comp-pin
    nom: "Pin"
    famille: fonctionnel
    raison_d_etre: >-
      Marqueur géolocalisé sur la Carte qui réifie le mapping palier 9
      02-pins (provenance via couleur, multi-époques via forme empilée,
      vérification via contour, catégorie via icône). 5 dimensions
      orthogonales de variant, ~32 combinaisons théoriques avec
      contraintes invariantielles I3/I8/I9.

    ancrage:
      ecrans: [E-CARTE-PRINCIPALE, E-CARTE-APERCU-PIN]
      composants_qui_l_integrent: [comp-carte, comp-cluster-densite (héritage couleur dominante), comp-grid-recherche (variante mini)]

    composition:
      - id: comp-icone
        slot: "icone_categorie"
        cardinalite: 1
        note: "icône de catégorie ; mapping concret palier 13"
      - id: comp-badge-nombre
        slot: "badge_multi_epoques"
        cardinalite: 0..1
        note: "présent uniquement si multi-époques"

    variants:
      - dimension: provenance
        valeurs: [editorial, communautaire]
        registre: "couleur du Pin (palier 9 D3)"
      - dimension: multi_epoques
        valeurs: [simple, empile]
        registre: "forme du Pin (palier 9 D4)"
      - dimension: statut_verification
        valeurs: [absent, en_cours]
        registre: "contour du Pin (palier 9 D5)"
      - dimension: contexte_parcours
        valeurs: [normal, etape_courante, etape_complete, etape_future, hors_parcours]
        registre: "modulation halo+relief / opacité / atténuation (palier 9 02-pins variantes ; cohérent comp-item-liste-etape qui distingue [complete, courante, future])"
      - dimension: deja_visite
        valeurs: [non, oui]
        registre: "nuance chromatique adoucie"

    contraintes_invariantielles:
      - "I3 : provenance editorial → statut_verification toujours absent (jamais en cours)"
      - "I8 : multi_epoques admis sans restriction"
      - "I9 : Pin sans coordonnées géographiques → invisible sur Carte (mais accessible via comp-recherche-surface et catégorie)"
      - "PR1 (cf. 09-cartographie/02-pins.yaml) : combinaison etape_courante + deja_visite → mise en relief prime sur atténuation"
      - "PR2 : combinaison hors_parcours + deja_visite → cumul des deux modulations"

    etats_interactifs:
      - default
      - pressed
      - selected
      - focused        # a11y clavier/lecteur d'écran
      - disabled       # rare — Pin retiré ou hors-Époque

    interactions_natives:
      - "Tap → E2 émet 'pin_sélectionné' → écran parent ouvre B1 aperçu rapide (E-CARTE-APERCU-PIN)"
      - "Long-press → E2 émet 'pin_signalé' (potentiel — à confirmer plus tard ; pattern long-press retiré du catalogue § 5 de l'index faute de composants attachés confirmés)"

    intention_portee:
      parametrable: true   # l'écran qui l'instancie câble la cible (B1 ou autre)
      echelle: E2_inter_composant
      intention: "ouverture_apercu_pin"
      cible_referencee_par_defaut: "flow B1 (E-CARTE-APERCU-PIN)"
      note: "Composant à intention OUVERTE — l'écran orchestre la cible. Le Pin émet le signal ; la Carte le câble."

    couplage_etat_partage:
      - etat: ETAT-EPOQUE-COURANTE
        role: consommateur
        note: "visibilité conditionnelle (cf. palier 3 D1.2 — sur 'Aujourd'hui' tous les Pins de toutes Époques cumulés)"
      - etat: ETAT-PARCOURS-EN-COURS
        role: consommateur
        note: "détermine variant contexte_parcours"

    patterns_attaches: []

    consequences_variabilite:
      - "Icône catégorie absente → fallback icône générique (palier 13)"
      - "Combinaisons extrêmes (5 modulations cumulées) — perceptibilité validée palier 16"

    machine_etats: "voir § 2 — machine d'état riche détaillée"

    questions_ouvertes:
      - "Long-press → menu signalement : pertinent palier 10 ou réserver palier 11 ?"

  # ---------------------------------------------------------------------------
  # Composants fonctionnels — format compact
  # ---------------------------------------------------------------------------

  - id: comp-carte
    nom: "Carte"
    famille: fonctionnel
    raison_d_etre: "Affichage cartographique avec interpolation paramétrique du fond par Époque (palier 9 D8) et coexistence couches/pins/tracé."
    ancrage: { ecrans: [E-CARTE-PRINCIPALE], composants_qui_l_integrent: [comp-layout-carte-principale] }
    composition:
      - { id: comp-pin, slot: pins, cardinalite: 0..n }
      - { id: comp-cluster-densite, slot: clusters, cardinalite: 0..n }
      - { id: comp-trace-parcours, slot: trace_actif, cardinalite: 0..1 }
      - { id: comp-slider-epoque, slot: navigateur_temporel, cardinalite: 1 }
    variants:
      - { dimension: niveau_zoom, valeurs: [large, intermediaire, proche], registre: "selon zoom (cf. palier 9 04-densite-zoom)" }
      - { dimension: mode_affichage_offline, valeurs: [nominal, offline_avec_cache, offline_sans_cache] }
    etats_interactifs: [default, panning, zooming, loading_tuiles, geoloc_cursor_actif, pin_selected]
    interactions_natives:
      - "Pan (drag) → E1 recadrage carte"
      - "Pinch / pan zoom → E1 changement niveau zoom (peut déclencher clustering, palier 9 04)"
      - "Tap Pin → propage E2 'pin_sélectionné' au parent"
      - "Tap cluster → E1 zoom_in sur la zone du cluster (palier 9 R2)"
    intention_portee:
      parametrable: true
      echelle: E4_systemique
      note: "Le tap pin est une intention ouverte. Le pan/zoom est purement local. Le couplage E4 vient du slider d'Époque intégré (cascade palier 9 D8)."
    couplage_etat_partage:
      - { etat: ETAT-EPOQUE-COURANTE, role: consommateur, note: "interpolation des 5 axes paramétriques palier 9 fichier 01-fond-et-epoques" }
      - { etat: ETAT-CONNEXION-RESEAU, role: consommateur, note: "bascule vers offline_avec_cache si réseau perdu" }
      - { etat: ETAT-PERMISSIONS-SYSTEME, role: consommateur, note: "geoloc_cursor visible si permission accordée" }
    patterns_attaches: [PI-DRAG-ENTRE-VARIANTS]
    consequences_variabilite:
      - "Tuiles non disponibles offline → cas dégradé, message gracieux"
      - "Aucun Pin pour l'Époque courante → état vide gracieux (cf. palier 7 E-CARTE-PRINCIPALE état vide_a_l_epoque)"
    machine_etats: "voir § 2"

  - id: comp-slider-epoque
    nom: "Slider d'Époque"
    famille: fonctionnel
    raison_d_etre: "Navigateur temporel — drag continu interpolant les filtres carte (palier 9 D8) et fixant l'Époque au snap. PRODUCTEUR PRIMAIRE de ETAT-EPOQUE-COURANTE."
    ancrage: { ecrans: [E-CARTE-PRINCIPALE], composants_qui_l_integrent: [comp-carte] }
    composition:
      - { id: comp-libelle-texte, slot: epoque_courante, cardinalite: 1 }
      - { id: comp-libelle-texte, slot: dates_courantes, cardinalite: 1 }
    variants:
      - { dimension: orientation, valeurs: [horizontal, vertical], note: "palier 7 fixe l'orientation par écran" }
    etats_interactifs: [repos, dragging, snapping, pilote_automatique]
    interactions_natives:
      - "Drag handle → E4 émet position continue (interpolation 5 axes palier 9)"
      - "Relâchement (snap) → E4 émet Époque finale calée"
      - "Pilote automatique par parcours en cours possible (cf. palier 3 D1.2)"
    intention_portee:
      parametrable: false
      echelle: E4_systemique
      intention: "navigation_temporelle"
      cible_referencee: "ETAT-EPOQUE-COURANTE producteur — cascade carte+pins+tracés"
      note: "Intention CLOSE — le slider produit l'état d'Époque, ce comportement est invariant."
    couplage_etat_partage:
      - { etat: ETAT-EPOQUE-COURANTE, role: producteur, note: "primaire" }
      - { etat: ETAT-PARCOURS-EN-COURS, role: consommateur, note: "pilotage automatique optionnel par étape courante" }
    patterns_attaches: [PI-DRAG-ENTRE-VARIANTS]
    consequences_variabilite:
      - "Libellé Époque variable (longueurs FR/EN/JA) → truncate ou taille adaptative (palier 12)"
    machine_etats: "voir § 2"

  - id: comp-cluster-densite
    nom: "Cluster de densité"
    famille: fonctionnel
    raison_d_etre: "Agrégation visuelle de Pins quand densité élevée à un niveau de zoom (palier 9 04-densite-zoom). Hérite registres Pin (couleur provenance dominante, forme empilée si hétérogénéité temporelle)."
    ancrage: { ecrans: [E-CARTE-PRINCIPALE], composants_qui_l_integrent: [comp-carte] }
    composition:
      - { id: comp-libelle-texte, slot: compteur, cardinalite: 1, note: "abréviation au-delà d'un seuil (palier 16)" }
    variants:
      - { dimension: provenance_dominante, valeurs: [editorial, communautaire], registre: "≥1 éditorial → couleur éditoriale (palier 9 04)" }
      - { dimension: heterogeneite_temporelle, valeurs: [homogene, hetero], registre: "forme empilée si hétérogène ou ≥1 Pin multi-époque" }
      - { dimension: contient_verification, valeurs: [non, oui], registre: "contour distinctif si ≥1 Pin en cours de vérification" }
    etats_interactifs: [default, pressed]
    interactions_natives:
      - "Tap → E1 zoom_in sur la zone (palier 9 R2)"
    intention_portee:
      parametrable: false
      echelle: E1_atomique
      intention: "zoom_in_zone"
      cible_referencee: "comportement carte (palier 9 R2)"
      note: "Intention CLOSE — un cluster fait toujours zoom_in au tap."
    couplage_etat_partage:
      - { etat: ETAT-EPOQUE-COURANTE, role: consommateur, note: "recompute des clusters à chaque changement Époque" }
    consequences_variabilite:
      - "Compteur variable (jusqu'à abréviation '5+' ou similaire — palier 16)"

  - id: comp-trace-parcours
    nom: "Tracé Parcours"
    famille: fonctionnel
    raison_d_etre: "Réifie le mapping palier 9 03-parcours-traces : provenance via couleur, parcouru/à parcourir via opacité, étape courante en relief, vérification I3 via contour."
    ancrage: { ecrans: [E-PARCOURS-EN-COURS-TERRAIN, E-PARCOURS-FICHE-DETAIL (preview)], composants_qui_l_integrent: [comp-carte] }
    composition: []
    variants:
      - { dimension: provenance, valeurs: [editorial, communautaire], registre: "couleur du tracé" }
      - { dimension: etat_segment, valeurs: [a_parcourir, parcouru, etape_courante], registre: "rendu plein vif / rendu atténué / mise en relief" }
      - { dimension: statut_verification, valeurs: [absent, en_cours], registre: "contour distinctif (cohérent comp-pin)" }
      - { dimension: mode, valeurs: [terrain, canape, non_commence], note: "non_commence depuis fiche détail" }
    etats_interactifs: [default, loading, hidden_M4]
    interactions_natives:
      - "Tap segment → E2 émet 'etape_visee' (potentiel, optionnel)"
    intention_portee:
      parametrable: true
      echelle: E2_inter_composant
      note: "Tap optionnel — la carte parente câble si pertinent (sinon tracé décoratif)"
    couplage_etat_partage:
      - { etat: ETAT-PARCOURS-EN-COURS, role: consommateur, note: "détermine état_segment et étape courante" }
      - { etat: ETAT-EPOQUE-COURANTE, role: consommateur, note: "atténuation des étapes hors Époque courante" }
    consequences_variabilite:
      - "Tracé absent (Parcours sans coordonnées d'étapes — improbable mais I9 potentiel) → invisible carte"

  - id: comp-recherche-surface
    nom: "Surface de recherche"
    famille: fonctionnel
    raison_d_etre: "Surface ponctuelle (M6) de recherche libre + filtres. Réagit au texte avec debounce, filtre offline si réseau absent."
    ancrage: { ecrans: [E-CARTE-RECHERCHE], composants_qui_l_integrent: [comp-layout-carte-principale (point d'accès)] }
    composition:
      - { id: comp-champ-saisie-texte, slot: requete, cardinalite: 1 }
      - { reformulation_textuelle: "rangée scrollable de comp-chip-* (filtre/époque/catégorie selon contexte)", slot: filtres_actifs, cardinalite: 0..1 }
      - { id: comp-grid-recherche, slot: resultats, cardinalite: 1 }
      - { id: comp-button-fermeture-overlay, slot: fermeture, cardinalite: 1 }
    variants: []
    etats_interactifs: [empty, typing, querying, results_loaded, no_results, error, offline_local]
    interactions_natives:
      - "Tap résultat → E2 émet 'item_sélectionné' → écran parent recadre Carte + ouvre B1 ou C3 selon type"
      - "Tap-hors → fermeture (PI-TAP-HORS)"
    intention_portee:
      parametrable: true
      echelle: E2_inter_composant
      cible_referencee: "flow A4 recherche et filtrage"
    couplage_etat_partage:
      - { etat: ETAT-CONNEXION-RESEAU, role: consommateur, note: "bascule offline_local si pas de réseau" }
    patterns_attaches: [PI-TAP-HORS]
    consequences_variabilite:
      - "Liste résultats variable (0 à n)"
      - "Saisie i18n divergente (FR/EN/JA)"
    machine_etats: "voir § 2"

  - id: comp-grid-recherche
    nom: "Grille de résultats"
    famille: fonctionnel
    raison_d_etre: "Affiche une liste/grille paginée ou en scroll infini de Pins ou Parcours."
    ancrage: { ecrans: [E-CARTE-RECHERCHE, E-PARCOURS-PRINCIPAL (catalogue)], composants_qui_l_integrent: [comp-recherche-surface, comp-layout-parcours] }
    composition:
      - { id: comp-item-liste-pin-apercu, slot: items_pin, cardinalite: 0..n }
      - { id: comp-item-liste-parcours-simple, slot: items_parcours, cardinalite: 0..n }
      - { id: comp-indicateur-chargement, slot: loader, cardinalite: 0..1 }
    variants:
      - { dimension: type_contenu, valeurs: [pins, parcours, mixte] }
      - { dimension: mode_affichage, valeurs: [grille, liste] }
    etats_interactifs: [nominal, loading, vide, scroll_loading_more, erreur]
    interactions_natives:
      - "Scroll → charge plus (scroll infini par défaut)"
      - "Tap item → E2 émet 'item_sélectionné'"
    intention_portee:
      parametrable: true
      echelle: E2_inter_composant
    consequences_variabilite:
      - "Liste vide → état vide gracieux (composant dédié comp-zone-vide en atome)"

  - id: comp-filtres-couches
    nom: "Sélecteur de Couches cartographiques"
    famille: fonctionnel
    raison_d_etre: "Surface ponctuelle (M6) qui active/désactive les Couches cartographiques (palier 4 cluster 01 entité Couche cartographique)."
    ancrage: { ecrans: [E-CARTE-FILTRES-COUCHES], composants_qui_l_integrent: [comp-layout-carte-principale] }
    composition:
      - { id: comp-chip-couche-carte, slot: couches, cardinalite: 1..n }
      - { id: comp-button-fermeture-overlay, slot: fermeture, cardinalite: 1 }
    etats_interactifs: [default, pressed, applied]
    interactions_natives:
      - "Tap couche → toggle activation, émet E2 'couches_appliquees'"
    intention_portee: { parametrable: true, echelle: E2_inter_composant }
    patterns_attaches: [PI-TAP-HORS]

  - id: comp-alerte-proximite
    nom: "Alerte de proximité"
    famille: fonctionnel
    raison_d_etre: "M7 ponctuelle qui surgit sur la Carte quand un Pin éligible passe en proximité (mode Surprenez-moi flow E1) ou qu'on arrive à une Étape (mode terrain flow E2)."
    ancrage: { ecrans: [E-CARTE-ALERTE-PROXIMITE], composants_qui_l_integrent: [comp-layout-carte-principale] }
    composition:
      - { id: comp-libelle-texte, slot: titre, cardinalite: 1 }
      - { id: comp-libelle-texte, slot: teaser, cardinalite: 0..1 }
      - { id: comp-button-secondary, slot: action_accepter, cardinalite: 1 }
      - { id: comp-button-fermeture-overlay, slot: rejet, cardinalite: 1 }
    etats_interactifs: [emise, expiration, tap_accepte, geste_rejet, mode_silencieux_systeme]
    interactions_natives:
      - "Tap accepter → E3 → ouvre B1 (E1) ou B2 (E2 étape)"
      - "Geste rejet ou expiration → dismiss"
    intention_portee:
      parametrable: false
      echelle: E3_navigationnelle
      intention: "alerte_de_proximite"
      cible_referencee: "flows E1 (Surprenez-moi) et E2 (étape)"
      note: "Intention CLOSE — l'alerte ne sert qu'à proposer la cible géoloc."
    couplage_etat_partage:
      - { etat: ETAT-MODE-NOTIFICATION, role: consommateur, note: "présente uniquement si Surprenez-moi ou En parcours actif" }
      - { etat: ETAT-PERMISSIONS-SYSTEME, role: consommateur, note: "géoloc requise" }
    patterns_attaches: [PI-SWIPE-DISMISS]
    consequences_variabilite:
      - "Mode silencieux OS → alerte émise sans son ni vibration"

  - id: comp-lecteur-audio
    nom: "Lecteur audio"
    famille: fonctionnel
    raison_d_etre: "Lit la narration audio d'un Pin (palier 4 cluster 01 Média audio_narration). PRODUCTEUR de ETAT-AUDIO-EN-COURS."
    ancrage: { ecrans: [E-PIN-CONSULTATION-APPROFONDIE, E-PIN-MODE-PRESENTATION], composants_qui_l_integrent: [comp-layout-consultation-pin-approfondie] }
    composition:
      - { id: comp-button-play-audio, slot: play_pause, cardinalite: 1 }
      - { id: comp-libelle-texte, slot: titre_pin, cardinalite: 1 }
      - { id: comp-libelle-texte, slot: temps_courant, cardinalite: 1 }
      - { id: comp-libelle-texte, slot: temps_total, cardinalite: 1 }
    variants:
      - { dimension: posture, valeurs: [inline_consultation, persistant_p1] }
    etats_interactifs: [buffering, playing, paused, ended, error, seeking]
    interactions_natives:
      - "Tap play/pause → toggle"
      - "Drag timeline → seek"
      - "Activation depuis Pin → E4 produit ETAT-AUDIO-EN-COURS, émet apparition P1"
    intention_portee:
      parametrable: false
      echelle: E4_systemique
      cible_referencee: "ETAT-AUDIO-EN-COURS producteur ; cascade P1 surface persistante"
    couplage_etat_partage:
      - { etat: ETAT-AUDIO-EN-COURS, role: producteur }
    patterns_attaches: [PI-DRAG-ENTRE-VARIANTS]
    consequences_variabilite:
      - "Audio absent → composant masqué (Pin sans audio_narration)"
      - "Réseau perdu en streaming → bascule erreur ou cache"
    machine_etats: "voir § 2"

  - id: comp-lecteur-video
    nom: "Lecteur vidéo"
    famille: fonctionnel
    raison_d_etre: "Lit une vidéo intégrée à la narration d'un Pin (Média de type non explicitement modélisé en cluster 01 — relève de l'évolution plus tard si pertinent)."
    ancrage: { ecrans: [E-PIN-CONSULTATION-APPROFONDIE], composants_qui_l_integrent: [comp-zone-narration] }
    composition:
      - { id: comp-button-secondary, slot: play_pause, cardinalite: 1 }
      - { id: comp-libelle-texte, slot: temps, cardinalite: 1 }
    variants:
      - { dimension: ratio, valeurs: ['16:9', '4:3', '1:1'] }
    etats_interactifs: [buffering, playing, paused, ended, error, fullscreen]
    interactions_natives:
      - "Tap play/pause, scrub timeline, fullscreen"
    intention_portee: { parametrable: true, echelle: E1_atomique, note: "Pas de cascade applicative (distinct de l'audio narratif)" }
    consequences_variabilite:
      - "Vidéo absente → fallback titre"

  - id: comp-viewer-3d
    nom: "Viewer 3D"
    famille: fonctionnel
    raison_d_etre: "Visualisation 3D d'un Modèle 3D rattaché à un Pin (palier 4 cluster 01 entité Modèle 3D)."
    ancrage: { ecrans: [E-PIN-CONSULTATION-3D] }
    composition:
      - { id: comp-button-tertiary, slot: bascule_ar, cardinalite: 0..1 }
      - { id: comp-button-back, slot: retour, cardinalite: 1 }
    etats_interactifs: [loading, loaded, manipulating, error, fullscreen]
    interactions_natives:
      - "Drag → rotation 3D"
      - "Pinch → zoom 3D"
      - "Tap bascule_ar → E3 ouvre E-PIN-CONSULTATION-AR"
    intention_portee: { parametrable: false, echelle: E1_atomique, intention: "manipulation_3d" }
    consequences_variabilite:
      - "Modèle absent → message gracieux"

  - id: comp-camera-ar
    nom: "Caméra AR"
    famille: fonctionnel
    raison_d_etre: "Superposition AR d'un Modèle 3D sur le réel via la caméra du device."
    ancrage: { ecrans: [E-PIN-CONSULTATION-AR] }
    composition:
      - { id: comp-button-back, slot: retour, cardinalite: 1, note: "variant 'darked' (composant polymorphe N1+N4, cf. 01-atomes:154)" }
