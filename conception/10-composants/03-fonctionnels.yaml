      - { id: comp-libelle-texte, slot: ouverture, cardinalite: 1, note: "« Le saviez-vous »" }
      - { id: comp-libelle-texte, slot: fait, cardinalite: 1 }
    intention_portee: { non_interactif: true }
    consequences_variabilite:
      - "Longueur du fait variable (phrase à court paragraphe)"

