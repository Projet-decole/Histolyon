# =============================================================================
# Palier 10 — Composants atomes
# =============================================================================
# Atomes = briques indivisibles de l'UI. Boutons, chips, badges, libellés,
# icônes, champs de saisie, switches, séparateurs, indicateurs, marqueurs
# visuels. Inclut les atomes à intention CLOSE (button-back, button-fab-
# creation, button-fermeture-overlay, button-play-audio) et les atomes à
# intention OUVERTE (button-primary, button-secondary, chip-couche, etc.).
#
# Calibrage du format selon le pilote 03-fonctionnels.yaml v0.1.
# =============================================================================

document:
  type: palier_composants_atomes
  numero: 10
  fichier: "01-atomes.yaml"
  version: "0.1"
  date: "2026-05-06"
  format: yaml
  pilote: false
  audience:
    - "relecture"
    - "Auteurs des fichiers 02-molecules, 04-shell, 05-back-office (résolution des références d'atomes)"
    - "Auteurs paliers 11, 12, 13, 16"
  role: >-
    Inventaire des atomes UI réutilisables d'HistoLyon avec leur intention
    portée (close ou ouverte), échelle d'interaction (E1-E4), états
    interactifs, variants, conséquences de variabilité, et couplages
    éventuels à l'état applicatif partagé.
  prerequis_de_lecture:
    - "design/conception/10-composants/00-index.yaml v0.2 — § 3 échelles E1-E5, § 4 état applicatif partagé (7 ETAT-XXX), § 5 patterns d'interaction (PI-XXX), § 7 format de fiche enrichi"
    - "design/conception/10-composants/03-fonctionnels.yaml v0.1 (PILOTE) — fiche-exemplaire comp-pin et calibrage du format compact"
    - "design/conception/05-architecture-info.yaml — modes M1-M9, surfaces persistantes P1-P3, règles N1-N7, entrées E1-E3"
    - "design/conception/04-donnees/ — invariants I3 vérification, I8 multi-époques"
  scope_v3:
    nombre_d_atomes: 42
    repartition:
      boutons_generiques: 6
      bouton_specialise: 1
      chips: 4
      badges: 2
      representations: 2
      switch: 1
      slider: "1 (renvoi vers 03-fonctionnels.yaml)"
      champs_saisie: 5
      icone: 1
      libelles: 3
      spatiaux: 2
      indicateurs_messages: 5
      autres_atomes: 5
      marqueurs_visuels: 3

# -----------------------------------------------------------------------------
# Raison d'être de ce fichier
# -----------------------------------------------------------------------------
raison_d_etre: >-
  Les atomes sont les briques DRY de toute l'app — un seul comp-button-primary
  câblé dans des dizaines d'écrans, un seul comp-libelle-texte qui s'inscrit
  dans la quasi-totalité des compositions, un seul comp-icone qui mappera au
  palier 13 plus de 30 catégories/actions/états. Mais certains atomes sont
  AUSSI à intention close — comp-button-back POLYMORPHE qui sait faire
  retour gracieux ET sortir du mode présentation, comp-button-fab-creation
  qui sait déclencher la création de Parcours personnel. La distinction
  intention close/ouverte (cf. § 7 index v0.2) est ICI fondamentale : elle
  conditionne ce que l'écran doit câbler.

# -----------------------------------------------------------------------------
# Composants atomes — fiches
# -----------------------------------------------------------------------------
composants:

  # ===========================================================================
  # BOUTONS GÉNÉRIQUES (6)
  # ===========================================================================

  - id: comp-button-primary
    nom: "Bouton primaire"
    famille: atome
    raison_d_etre: "Cible d'action principale dans toute surface, affirmée visuellement. Pivot du palier 10 (≥8 intégrations recensées dans les 48 écrans palier 7)."
    ancrage:
      ecrans: ["la quasi-totalité des écrans M3 avec une action principale", "E-CARTE-RECHERCHE", "E-PARCOURS-FICHE-DETAIL", "E-PARCOURS-LANCEMENT", "E-PROFIL-CREATION-COMPTE", "E-PROFIL-CONNEXION-COMPTE", "E-COMMUNAUTE-SOUMISSION-PIN", "E-PARCOURS-EDITEUR"]
      composants_qui_l_integrent: ["comp-dialogue-confirmation", "comp-dialogue-permission", "comp-message-ephemere", "comp-formulaire-creation-compte", "comp-formulaire-connexion-compte", "comp-formulaire-saisie-pin", "comp-formulaire-creation-parcours", "comp-quiz", "comp-alerte-proximite (variante action)"]
    composition:
      - { id: comp-libelle-bouton, slot: "label", cardinalite: 1 }
      - { id: comp-icone, slot: "icone", cardinalite: 0..1, note: "icône fonctionnelle optionnelle, mapping concret palier 13" }
    variants:
      - { dimension: taille, valeurs: [standard, compact] }
      - { dimension: pleine_largeur, valeurs: [oui, non] }
    etats_interactifs: [default, pressed, disabled, loading, focused]
    interactions_natives:
      - "Tap → émet signal d'action (callback parent, intention ouverte)"
      - "Focus clavier (a11y) → état focused"
    intention_portee:
      parametrable: true
      echelle: variable   # E2 / E3 / E4 selon contexte d'instanciation
      intention: "action_principale"
      contrats:
        - "L'écran qui l'intègre DOIT définir la cible (flow palier 6 ou intention P5)"
        - "Voir elements_interactifs des écrans palier 7 pour les câblages concrets"
      note: "Composant à INTENTION OUVERTE. Selon contexte : E2 (soumission inline), E3 (navigation push) ou E4 (ex. 'Lancer le parcours' produit ETAT-PARCOURS-EN-COURS)."
    consequences_variabilite:
      - "Texte variable → truncate avec ellipse au-delà d'un seuil (palier 12)"
      - "i18n FR/EN/JA divergent ; perceptibilité validée palier 16"
      - "État loading → libellé remplacé par indicateur visuel inline"

  - id: comp-button-secondary
    nom: "Bouton secondaire"
    famille: atome
    raison_d_etre: "Cible d'action secondaire (alternative ou complément du primaire). Pivot du palier 10 (≥6 intégrations)."
    ancrage:
      ecrans: ["E-PROFIL-CREATION-COMPTE (alternative connexion)", "E-PROFIL-CONNEXION-COMPTE (alternative création)", "E-CARTE-ALERTE-PROXIMITE (rejet)", "E-PIN-CONSULTATION-APPROFONDIE", "écrans avec dialogue confirmation/annulation"]
      composants_qui_l_integrent: ["comp-dialogue-confirmation (slot annulation)", "comp-alerte-proximite (action_accepter)", "comp-lecteur-video (play_pause)", "comp-quiz (réponses)"]
    composition:
      - { id: comp-libelle-bouton, slot: "label", cardinalite: 1 }
      - { id: comp-icone, slot: "icone", cardinalite: 0..1 }
    variants:
      - { dimension: taille, valeurs: [standard, compact] }
    etats_interactifs: [default, pressed, disabled, loading, focused]
    interactions_natives:
      - "Tap → émet signal d'action (callback parent)"
    intention_portee:
      parametrable: true
      echelle: variable   # E2 le plus souvent, E3 occasionnel
      intention: "action_secondaire"
      contrats:
        - "L'écran instancie la cible. Visuellement subordonné au primaire."
      note: "Intention OUVERTE — câblage parent."
    consequences_variabilite:
      - "Texte variable → truncate (palier 12)"

  - id: comp-button-tertiary
    nom: "Bouton tertiaire"
    famille: atome
    raison_d_etre: "Action légère, contextuelle, sans dominance visuelle (lien-action discret). Souvent utilisé pour les actions optionnelles ou alternatives."
    ancrage:
      ecrans: ["E-PIN-CONSULTATION-APPROFONDIE (play audio inline avant la résorption en composant dédié)", "E-VIEWER-3D (bascule AR)", "écrans M6 avec actions secondaires"]
      composants_qui_l_integrent: ["comp-viewer-3d (slot bascule_ar)", "comp-dialogue-confirmation (variante annulation discrète)"]
    composition:
      - { id: comp-libelle-bouton, slot: "label", cardinalite: 0..1 }
      - { id: comp-icone, slot: "icone", cardinalite: 0..1 }
    variants:
      - { dimension: forme, valeurs: [compact, icon-only] }
    etats_interactifs: [default, pressed, disabled, focused]
    interactions_natives:
      - "Tap → émet signal d'action"
    intention_portee:
      parametrable: true
      echelle: variable
      intention: "action_legere"
      note: "Intention OUVERTE — le parent câble. Variante icon-only requiert un libellé d'accessibilité (palier 16)."
    consequences_variabilite:
      - "Variante icon-only → cible tactile généreuse (palier 12) + libellé d'a11y obligatoire"

  - id: comp-button-back
    nom: "Bouton retour"
    famille: atome
    raison_d_etre: >-
      Cible navigationnelle de retour gracieux (P5.N1) ET de sortie de mode
      présentation (P5.N4). Composant POLYMORPHE selon contexte — le
      composant sait à quel mode il appartient via son variant context.
    ancrage:
      ecrans: ["la quasi-totalité des écrans M3", "écrans M6 ponctuelles non fermées par tap-hors", "templates M8", "E-PIN-MODE-PRESENTATION (M4 — variant darked)", "E-PIN-CONSULTATION-AR (M4)"]
      composants_qui_l_integrent: ["comp-header-titre-action (variant avec retour)", "comp-viewer-3d (slot retour)", "comp-camera-ar (slot retour)"]
    composition:
      - { id: comp-icone, slot: "icone", cardinalite: 1, note: "icône fonctionnelle de retour ; concrète au palier 13" }
    variants:
      - { dimension: context, valeurs: [normal, darked], note: "normal pour M3/M6 ; darked pour M4 mode présentation (lisibilité sur média immersif)" }
    etats_interactifs: [default, pressed, disabled, focused]
    interactions_natives:
      - "Tap → déclenche le retour gracieux (intention close)"
    intention_portee:
      parametrable: false
      echelle: E3_navigationnelle
      intention: "retour_gracieux_polymorphe"
      cibles_referencees:
        - "P5.N1 — un seul geste vers le niveau immédiatement supérieur (variant normal)"
        - "P5.N4 — sortie M4 mode présentation vers M3 (variant darked)"
      cas_deep_link: "Si l'écran a été atteint via Lien universel sans pile constituée, le retour mène à la surface principale logique de la cible (cf. P5.E2). PRÉCISION IMPORTANTE — sans elle, les devs feront faux."
      note: >-
        Composant à INTENTION CLOSE — non surchargeable. L'écran qui l'instancie
        n'a pas à câbler son comportement, seulement à fixer son variant
        context. Le routing concret (push/pop/Navigator) est hors composant
        (palier 11 chorégraphie + architecture Flutter).
    consequences_variabilite:
      - "Pas de texte variable (icône uniquement)"
      - "Variant darked nécessite contraste suffisant sur média immersif (palier 12 + 16)"
    questions_ouvertes:
      - "Variant 'retour avec libellé' (ex. libellé visible) pour certains contextes a11y ? — palier 13 et palier 16."

  - id: comp-button-fermeture-overlay
    nom: "Bouton de fermeture d'overlay"
    famille: atome
    raison_d_etre: >-
      Cible explicite pour renoncer à une surface ponctuelle (M6 recherche,
      M6 filtres-couches, M2 aperçu rapide, M8 dialogue à fermeture explicite,
      M7 alerte de proximité — rejet). Sémantique « renoncer », distincte
      du retour gracieux (P5.N1) qui remonte la pile.
    ancrage:
      ecrans: ["E-CARTE-APERCU-PIN (aperçu M2)", "E-CARTE-RECHERCHE (M6)", "E-CARTE-FILTRES-COUCHES (M6)", "E-CARTE-ALERTE-PROXIMITE (M7 rejet)"]
      composants_qui_l_integrent: ["comp-recherche-surface (slot fermeture)", "comp-filtres-couches (slot fermeture)", "comp-alerte-proximite (slot rejet)", "comp-apercu-rapide-pin (futur, en 04-shell)"]
    composition:
      - { id: comp-icone, slot: "icone", cardinalite: 1, note: "icône fonctionnelle de fermeture ; concrète au palier 13" }
    etats_interactifs: [default, pressed, disabled, focused]
    interactions_natives:
      - "Tap → ferme la surface ponctuelle (intention close)"
    intention_portee:
      parametrable: false
      echelle: E3_navigationnelle
      intention: "fermeture_renoncement"
      cible_referencee: "P5.N5 fermeture implicite par interaction extérieure (ici rendue explicite)"
      note: >-
        Sémantique « renoncer » distincte du retour gracieux. Le bouton ne
        remonte PAS d'un niveau dans la pile — il ferme la surface ponctuelle
        en place. Si l'overlay supporte aussi PI-TAP-HORS, le bouton est
        l'alternative explicite (a11y, clarté).
    patterns_attaches: [PI-TAP-HORS]
    consequences_variabilite:
      - "Pas de texte variable"

  - id: comp-button-fab-creation
    nom: "Bouton flottant de création"
    famille: atome
    raison_d_etre: >-
      Cible flottante pour déclencher la création d'un Parcours personnel
      (flow C11). Geste constitutif du parcours créatif — composant à
      intention close.
    ancrage:
      ecrans: ["E-PARCOURS-PRINCIPAL (catalogue de Parcours)"]
      composants_qui_l_integrent: ["comp-formulaire-creation-parcours (slot ajout_etape — variante)", "comp-layout-parcours"]
    composition:
      - { id: comp-icone, slot: "icone", cardinalite: 1, note: "icône fonctionnelle de création ; concrète au palier 13" }
      - { id: comp-libelle-bouton, slot: "label", cardinalite: 0..1, note: "libellé optionnel selon variante FAB étendu/compact" }
    variants:
      - { dimension: forme, valeurs: [compact, etendu] }
    etats_interactifs: [default, pressed, disabled, focused]
    interactions_natives:
      - "Tap → ouvre le flow de création de Parcours (intention close)"
    intention_portee:
      parametrable: false
      echelle: E3_navigationnelle
      intention: "creation_parcours_personnel"
      cible_referencee: "flow C11 (création Parcours) — palier 6"
      note: >-
        Intention CLOSE — le bouton sait qu'il déclenche la création de
        Parcours. Désactivé si Compte non connecté (consommateur de
        ETAT-COMPTE-CONNECTE — I2 publication requiert Compte). Variante
        accessible aux non-connectés : sauvegarde locale jusqu'à publication
        (cf. I6).
    couplage_etat_partage:
      - { etat: ETAT-COMPTE-CONNECTE, role: consommateur, note: "désactivation gracieuse si déconnecté ET fonctionnalité requiert publication" }
    consequences_variabilite:
      - "Variante compact → cible tactile préservée (palier 12)"

  # ===========================================================================
  # BOUTON SPÉCIALISÉ (1)
  # ===========================================================================

  - id: comp-button-play-audio
    nom: "Bouton de lecture audio"
    famille: atome
    raison_d_etre: >-
      Déclenche la narration audio du Pin courant. Distinct du bouton tertiaire
      générique car porteur d'une intention close (lance la narration audio
      contextuelle ET produit ETAT-AUDIO-EN-COURS via cascade depuis le
      lecteur audio parent).
    ancrage:
      ecrans: ["E-PIN-CONSULTATION-APPROFONDIE (zone audio)", "E-PIN-MODE-PRESENTATION"]
      composants_qui_l_integrent: ["comp-lecteur-audio (slot play_pause)"]
    composition:
      - { id: comp-icone, slot: "icone", cardinalite: 1, note: "icône fonctionnelle de lecture/pause selon état ; mapping palier 13" }
    etats_interactifs: [default, pressed, playing, paused, loading, disabled, focused]
    interactions_natives:
      - "Tap → toggle play/pause (intention close — sait qu'il pilote la narration du Pin courant)"
    intention_portee:
      parametrable: false
      echelle: E4_systemique
      intention: "declenchement_narration_audio"
      cible_referencee: "zone audio du Pin courant ; cascade ETAT-AUDIO-EN-COURS via comp-lecteur-audio parent"
      note: >-
        Intention CLOSE — le bouton sait qu'il déclenche la narration audio
        du Pin courant. Production effective de ETAT-AUDIO-EN-COURS portée
        par le lecteur audio parent (cf. comp-lecteur-audio en
        03-fonctionnels.yaml), mais ce bouton est le point d'ancrage du
        geste utilisateur.
    couplage_etat_partage:
      - { etat: ETAT-AUDIO-EN-COURS, role: producteur, note: "via le lecteur audio parent (cascade P1 surface persistante)" }
    consequences_variabilite:
      - "Audio absent → bouton masqué (cohérent avec comp-lecteur-audio)"
      - "État loading → indicateur visuel pendant buffering"

  # ===========================================================================
  # CHIPS (4)
  # ===========================================================================

  - id: comp-chip-epoque
    nom: "Chip d'Époque"
    famille: atome
    raison_d_etre: >-
      Sélection d'une Époque alternative pour un Pin multi-époques (flow B3,
      palier 4 I8) ou affichage d'une Époque dans un filtre. Selon contexte :
      producteur OU consommateur de ETAT-EPOQUE-COURANTE.
    ancrage:
      ecrans: ["E-PIN-CONSULTATION-APPROFONDIE (zone navigation multi-époque)", "E-CARTE-RECHERCHE (filtre)"]
      composants_qui_l_integrent: ["comp-frise-chronologique (slot epoques)", "comp-recherche-surface (variante filtre)"]
    composition:
      - { id: comp-libelle-chip, slot: "label", cardinalite: 1 }
      - { id: comp-icone, slot: "icone", cardinalite: 0..1 }
    variants:
      - { dimension: etat_selection, valeurs: [default, active, disabled] }
    etats_interactifs: [default, pressed, active, disabled, focused]
    interactions_natives:
      - "Tap → E2 émet 'epoque_alternative_selectionnee' (variante frise) OU E4 modifie ETAT-EPOQUE-COURANTE (variante filtre carte)"
    intention_portee:
      parametrable: true
      echelle: variable   # E2 dans frise multi-époque, E4 dans filtre carte (rare)
      intention: "selection_epoque_alternative"
      contrats:
        - "Le parent (frise ou filtre) câble la cible. La frise consomme l'événement E2 ; un filtre carte produirait E4."
    couplage_etat_partage:
      - { etat: ETAT-EPOQUE-COURANTE, role: "variable selon contexte", note: "consommateur (highlight Époque courante dans frise) OU producteur (filtre carte)" }
    consequences_variabilite:
      - "Libellé Époque variable (longueurs FR/EN/JA divergentes) → truncate (palier 12)"

  - id: comp-chip-couche-carte
    nom: "Chip de Couche cartographique"
    famille: atome
    raison_d_etre: "Toggle d'activation/désactivation d'une Couche cartographique (palier 4 cluster 01 entité Couche cartographique)."
    ancrage:
      ecrans: ["E-CARTE-FILTRES-COUCHES"]
      composants_qui_l_integrent: ["comp-filtres-couches (slot couches)"]
    composition:
      - { id: comp-libelle-chip, slot: "label", cardinalite: 1 }
      - { id: comp-icone, slot: "icone", cardinalite: 1, note: "icône fonctionnelle de la couche ; mapping palier 13" }
    variants:
      - { dimension: etat_activation, valeurs: [active, inactive] }
    etats_interactifs: [default, pressed, active, inactive, disabled, focused]
    interactions_natives:
      - "Tap → toggle activation, émet E2 'couche_togglee' (le parent comp-filtres-couches agrège)"
    intention_portee:
      parametrable: true
      echelle: E2_inter_composant
      intention: "toggle_couche"
      contrats: ["Le parent câble l'application effective des couches sur la Carte"]
    consequences_variabilite:
      - "Libellé i18n divergent → truncate (palier 12)"

  - id: comp-chip-categorie
    nom: "Chip de Catégorie (display)"
    famille: atome
    raison_d_etre: >-
      Affichage non-interactif de la Catégorie d'un Pin/Parcours (palier 4
      cluster 01). Pivot du palier 10 (≥10 intégrations dans cards, items
      de liste, fiches).
    ancrage:
      ecrans: ["la quasi-totalité des écrans qui exposent un Pin ou Parcours"]
      composants_qui_l_integrent: ["comp-item-liste-pin-apercu", "comp-item-liste-parcours-simple", "comp-formulaire-saisie-pin (slot categorie sélectionnée)", "comp-grid-recherche", "comp-frise-chronologique"]
    composition:
      - { id: comp-icone, slot: "icone", cardinalite: 1, note: "icône fonctionnelle de catégorie" }
      - { id: comp-libelle-chip, slot: "label", cardinalite: 1 }
    variants:
      - { dimension: taille, valeurs: [standard, compact] }
    intention_portee: { non_interactif: true }
    interactions_natives: []
    consequences_variabilite:
      - "Libellé Catégorie variable (FR/EN/JA) → truncate (palier 12)"
      - "Icône absente → fallback générique (palier 13)"

  - id: comp-chip-filtre
    nom: "Chip de filtre"
    famille: atome
    raison_d_etre: "Application/retrait d'un filtre dans une surface de recherche (filtre par Époque, Catégorie, état, provenance)."
    ancrage:
      ecrans: ["E-CARTE-RECHERCHE", "E-PARCOURS-PRINCIPAL (catalogue)"]
      composants_qui_l_integrent: ["comp-recherche-surface (slot filtres_actifs)", "comp-grid-recherche"]
    composition:
      - { id: comp-libelle-chip, slot: "label", cardinalite: 1 }
      - { id: comp-icone, slot: "icone_retrait", cardinalite: 0..1, note: "icône fonctionnelle de retrait quand filtre actif" }
    variants:
      - { dimension: type_filtre, valeurs: [epoque, categorie, etat, provenance] }
      - { dimension: etat, valeurs: [active, inactive] }
    etats_interactifs: [default, pressed, active, inactive, focused]
    interactions_natives:
      - "Tap → toggle activation/désactivation, émet E2 'filtre_togglé'"
    intention_portee:
      parametrable: true
      echelle: E2_inter_composant
      intention: "application_filtre"
      contrats: ["Le parent (surface de recherche) câble l'agrégation des filtres et le requêtage"]
    consequences_variabilite:
      - "Libellé i18n → truncate (palier 12)"

  # ===========================================================================
  # BADGES (2)
  # ===========================================================================

  - id: comp-badge-statut
    nom: "Badge de statut"
    famille: atome
    raison_d_etre: "Marqueur permanent indiquant un statut (officiel, en revue, retiré, brouillon, archivé) — affichage non-interactif distinct du tag-provenance et du status-pin-verification."
    ancrage:
      ecrans: ["E-PIN-CONSULTATION-APPROFONDIE", "E-COMMUNAUTE-FILE-MODERATION (back-office)", "E-PROFIL-CONTRIBUTIONS"]
      composants_qui_l_integrent: ["comp-item-liste-pin-apercu"]
    composition:
      - { id: comp-libelle-texte, slot: "texte", cardinalite: 1 }
      - { id: comp-icone, slot: "icone", cardinalite: 0..1 }
    variants:
      - { dimension: type, valeurs: [officiel, en_revue, retire, brouillon, archive] }
    intention_portee: { non_interactif: true }
    interactions_natives: []
    consequences_variabilite:
      - "Libellé court (palier 8 microcopy) — pas de truncate attendu"

  - id: comp-badge-nombre
    nom: "Badge de nombre"
    famille: atome
    raison_d_etre: "Compteur visuel — multi-époques sur Pin (palier 9 02-pins, badge_multi_epoques), comptage cluster, nombre d'éléments."
    ancrage:
      ecrans: ["E-CARTE-PRINCIPALE (Pins multi-époques, clusters)"]
      composants_qui_l_integrent: ["comp-pin (slot badge_multi_epoques)", "comp-cluster-densite (variante compteur intégré)", "comp-item-liste-* (variantes avec compteur)"]
    composition:
      - { id: comp-libelle-texte, slot: "compteur", cardinalite: 1, note: "abréviation au-delà d'un seuil — palier 16" }
    variants:
      - { dimension: taille, valeurs: [standard, compact] }
    intention_portee: { non_interactif: true }
    interactions_natives: []
    consequences_variabilite:
      - "Compteur élevé → abréviation (ex. au-delà d'un seuil — palier 16)"

