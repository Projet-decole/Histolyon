name: histolyon
publish_to: none

environment:
  sdk: ^3.13.3

workspace:
  - apps/mobile
  - apps/admin
  - packages/api_types

dev_dependencies:
  melos: ^8.7.0
  test: ^1.25.0
  supadart: ^1.9.3
  yaml: ^3.1.4

melos:
  scripts:
    analyze:
      description: Analyse statique de tout le workspace, plus la règle de lint d'imports maison (AD-5).
      run: dart analyze . && dart run tools/check_import_direction.dart
    test:
      description: Tests de chaque package du workspace qui a un dossier test/.
      run: dart run melos exec --dir-exists=test -- "flutter test || dart test"
    format:
      description: Vérifie le formatage de tout le workspace (sans corriger).
      run: dart format --set-exit-if-changed .
    gen:
      description: Génération de code (build_runner) pour chaque package qui en dépend.
      run: dart run melos exec --depends-on=build_runner -- "dart run build_runner build --delete-conflicting-outputs"
