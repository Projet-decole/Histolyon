name: ci-mobile

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "tools/check_import_direction.dart"
      - "tools/check_tokens.dart"
      - "packages/**"
      - ".github/workflows/ci-mobile.yml"

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: "stable"

      - run: flutter pub get

      - name: Analyse statique (workspace, cf. AD-5)
        run: dart run melos run analyze

      - name: Formatage (dart format)
        run: dart format --output=none --set-exit-if-changed apps/mobile packages

      - name: Tests + couverture
        working-directory: apps/mobile
        run: flutter test --coverage

      # La couverture sert à suivre l'avancement (indicateur du suivi), pas à
      # bloquer une PR.
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: apps/mobile/coverage/lcov.info
