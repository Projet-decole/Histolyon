name: ci-admin

# L'app admin est un gabarit vide jusqu'au second semestre : on ne la teste que
# lorsqu'on la touche.

on:
  pull_request:
    paths:
      - "apps/admin/**"
      - ".github/workflows/ci-admin.yml"

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: "stable"

      - run: flutter pub get

      - name: Analyse statique (workspace, cf. AD-5)
        run: dart run melos run analyze

      - name: Formatage (dart format)
        run: dart format --output=none --set-exit-if-changed apps/admin

      - name: Tests
        working-directory: apps/admin
        run: flutter test
