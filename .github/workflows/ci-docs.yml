name: ci-docs

# Contrôles légers : le produit (`produit/`), les tokens et les scripts de
# `tools/`. Pas de Supabase ici ; la régénération des types est dans ci-types.

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "**/CLAUDE.md"
      - "apps/*/AGENTS.md"
      - "supabase/AGENTS.md"
      - "produit/**"
      - "tools/**"
      - "test/tools/**"
      - "packages/design_tokens/**"
      - "pubspec.yaml"
      - ".github/workflows/ci-docs.yml"

jobs:
  produit-et-outils:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: "stable"

      - run: flutter pub get

      - name: Cohérence de produit/ (identifiants, liens, budgets)
        run: dart run tools/ctx.dart check

      - name: Vérifier packages/design_tokens contre l'export Figma (AD-10)
        run: dart run tools/check_tokens.dart

      - name: Tests des scripts de tools/
        run: dart test --concurrency=1 test/tools

      - name: Formatage des scripts et de leurs tests
        run: dart format --output=none --set-exit-if-changed tools test
