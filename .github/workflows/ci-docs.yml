name: ci-docs

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "apps/*/AGENTS.md"
      - "supabase/AGENTS.md"
      - "tools/sync_agents.dart"
      - "tools/gen_types.dart"
      - "tools/ctx.dart"
      - "tools/check_tokens.dart"
      - "tools/check_migration_order.dart"
      - "tools/coverage_ratchet.dart"
      - "test/tools/**"
      - "packages/design_tokens/**"
      - "conception/**"
      - "supabase/migrations/**"
      - ".github/workflows/ci-docs.yml"

jobs:
  regenerer-et-verifier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: "stable"

      - run: flutter pub get

      - name: Régénérer CLAUDE.md / .cursor / copilot-instructions depuis les AGENTS.md
        run: dart run tools/sync_agents.dart

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Supabase local (pour gen-types)
        run: |
          supabase start
          supabase db reset

      - name: Récupérer les clés locales
        run: |
          STATUS=$(supabase status -o json)
          echo "SUPABASE_URL=$(echo "$STATUS" | jq -r .API_URL)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS" | jq -r .SERVICE_ROLE_KEY)" >> "$GITHUB_ENV"

      - name: Régénérer packages/api_types et content/schema/
        run: dart run tools/gen_types.dart

      - name: Régénérer conception/INDEX.md
        run: dart run tools/ctx.dart --index

      - name: Vérifier packages/design_tokens contre l'export Figma (AD-10)
        run: dart run tools/check_tokens.dart

      - name: Tests des scripts tools/ (ctx, sync_agents, check_tokens, check_migration_order, coverage_ratchet, validate_content)
        run: dart test test/tools

      - name: Refuser tout diff après régénération
        run: |
          git diff --exit-code -- CLAUDE.md .cursor .github/copilot-instructions.md packages/api_types content/schema conception/INDEX.md || (
            echo "::error::La documentation ou les types générés ne sont pas à jour — relancer dart run tools/sync_agents.dart, tools/gen_types.dart et tools/ctx.dart --index, committer le résultat." &&
            exit 1
          )
